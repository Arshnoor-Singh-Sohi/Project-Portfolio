<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 740" width="1280" height="740" role="img" aria-label="Three copies of one conversation" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>Three copies of one conversation</title><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#100D12"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2A9D8F"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2D6A4F"/></marker><marker id="arrow-gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B8860B"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C81D25"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A8A8A"/></marker></defs><rect x="0" y="0" width="1280" height="740" fill="#FFFFFF"/><text x="640" y="44" font-family="Helvetica, Arial, sans-serif" font-size="30" fill="#100D12" font-weight="bold" text-anchor="middle">Three copies of one conversation</text><rect x="30" y="80" width="380" height="440" rx="12" fill="#EEF5F1" stroke="#2D6A4F" stroke-width="2.5"/><text x="220" y="118" font-family="Helvetica, Arial, sans-serif" font-size="23" fill="#2D6A4F" font-weight="bold" text-anchor="middle">Copy 1: user transcript</text><rect x="450" y="80" width="380" height="440" rx="12" fill="#F3F8F5" stroke="#2D6A4F" stroke-width="2.5"/><text x="640" y="118" font-family="Helvetica, Arial, sans-serif" font-size="23" fill="#2D6A4F" font-weight="bold" text-anchor="middle">Copy 2: harness state</text><rect x="870" y="80" width="380" height="440" rx="12" fill="#FAFAFA" stroke="#8A8A8A" stroke-width="2.5" stroke-dasharray="8 6"/><text x="1060" y="118" font-family="Helvetica, Arial, sans-serif" font-size="23" fill="#100D12" font-weight="bold" text-anchor="middle">Copy 3: model input</text><text x="50" y="160" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" font-weight="normal" text-anchor="start">Written by: your application</text><text x="50" y="190" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" font-weight="normal" text-anchor="start">Lives in: your database</text><text x="50" y="235" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" font-weight="bold" text-anchor="start">Holds what the user saw:</text><text x="70" y="268" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" font-weight="normal" text-anchor="start">- user text</text><text x="70" y="298" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" font-weight="normal" text-anchor="start">- answer text</text><text x="70" y="328" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" font-weight="normal" text-anchor="start">- tool steps (call + result)</text><text x="70" y="358" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" font-weight="normal" text-anchor="start">- charts, files</text><text x="50" y="410" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#2D6A4F" font-weight="bold" text-anchor="start">Only adds. Never shrinks.</text><text x="230" y="480" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#2D6A4F" font-weight="bold" text-anchor="middle">SOURCE OF TRUTH</text><text x="470" y="160" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" font-weight="normal" text-anchor="start">Written by: the harness</text><text x="470" y="190" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" font-weight="normal" text-anchor="start">SDK: session file on local disk</text><text x="470" y="220" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" font-weight="normal" text-anchor="start">LangGraph: checkpoint</text><text x="470" y="265" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" font-weight="bold" text-anchor="start">Holds model messages:</text><text x="490" y="298" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" font-weight="normal" text-anchor="start">- content blocks</text><text x="490" y="328" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" font-weight="normal" text-anchor="start">- tool_use and tool_result</text><text x="490" y="358" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" font-weight="normal" text-anchor="start">- thinking with signatures</text><text x="490" y="388" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" font-weight="normal" text-anchor="start">- compaction summaries</text><text x="470" y="440" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#C81D25" font-weight="bold" text-anchor="start">Shrinks: compaction, summaries</text><text x="640" y="480" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#2D6A4F" font-weight="bold" text-anchor="middle">A CACHE</text><text x="890" y="160" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" font-weight="normal" text-anchor="start">Built by: the harness, per call</text><text x="890" y="190" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" font-weight="normal" text-anchor="start">Lives in: one HTTP request</text><text x="890" y="235" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" font-weight="bold" text-anchor="start">Holds:</text><text x="910" y="268" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#6A4C93" font-weight="normal" text-anchor="start">- system prompt</text><text x="910" y="298" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#2A9D8F" font-weight="normal" text-anchor="start">- tool definitions</text><text x="910" y="328" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" font-weight="normal" text-anchor="start">- summary + recent messages</text><text x="910" y="358" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#8A8A8A" font-weight="normal" text-anchor="start">- old tool outputs cleared</text><text x="910" y="388" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1E6091" font-weight="normal" text-anchor="start">- the new user message</text><text x="1060" y="480" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#100D12" font-weight="bold" text-anchor="middle">A VIEW</text><line x1="412" y1="560" x2="448" y2="560" stroke="#2D6A4F" stroke-width="3" marker-end="url(#arrow-green)"/><line x1="832" y1="560" x2="868" y2="560" stroke="#8A8A8A" stroke-width="3" marker-end="url(#arrow-gray)"/><text x="430" y="600" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#2D6A4F" font-weight="normal" text-anchor="middle">rebuild (Flow 2)</text><text x="850" y="600" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" font-weight="normal" text-anchor="middle">built for each call</text><path d="M640,640 C 520,700 340,700 230,650" fill="none" stroke="#C81D25" stroke-width="3" stroke-dasharray="10 7" marker-end="url(#arrow-red)"/><text x="435" y="712" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#C81D25" font-weight="bold" text-anchor="middle">never: do not save the transcript from copy 2</text><text x="1060" y="640" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#100D12" font-weight="bold" text-anchor="middle">Data flows left to right only.</text><text x="1060" y="672" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" font-weight="normal" text-anchor="middle">The app saves copy 1 from the</text><text x="1060" y="700" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" font-weight="normal" text-anchor="middle">events that it showed the user.</text></svg>