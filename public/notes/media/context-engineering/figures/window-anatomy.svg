<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 300" width="820" height="300" font-family="Inter, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect x="0" y="0" width="820" height="300" fill="#ffffff"/>
  <text x="410" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#100D12">One call: what fills the context window</text>
  <text x="410" y="52" text-anchor="middle" font-size="13" fill="#555">Widths are an example, not a rule. The input and the output share one limit.</text>
  <!-- bar from x=40 to x=780 (740 px) -->
  <g stroke="#100D12" stroke-width="1">
    <rect x="40"  y="120" width="70"  height="56" fill="#6A4C93"/>
    <rect x="110" y="120" width="70"  height="56" fill="#2A9D8F"/>
    <rect x="180" y="120" width="172" height="56" fill="#8A8A8A"/>
    <rect x="352" y="120" width="170" height="56" fill="#B8860B"/>
    <rect x="522" y="120" width="90"  height="56" fill="#2A9D8F" fill-opacity="0.65"/>
    <rect x="612" y="120" width="24"  height="56" fill="#2D6A4F"/>
    <rect x="636" y="120" width="14"  height="56" fill="#1E6091"/>
    <rect x="650" y="120" width="130" height="56" fill="#ffffff" stroke-dasharray="6 4"/>
  </g>
  <!-- labels above -->
  <g font-size="13" fill="#100D12" text-anchor="middle">
    <text x="75" y="94">System</text><text x="75" y="108">prompt</text>
    <text x="145" y="94">Tool</text><text x="145" y="108">definitions</text>
    <text x="266" y="108">Conversation history</text>
    <text x="437" y="108">Retrieved documents</text>
    <text x="567" y="108">Tool results</text>
    <text x="715" y="108">Output reserve</text>
  </g>
  <!-- labels below for thin segments -->
  <g font-size="13" fill="#100D12">
    <line x1="624" y1="176" x2="590" y2="214" stroke="#2D6A4F" stroke-width="1.5"/>
    <text x="586" y="230" text-anchor="end">State and memory</text>
    <line x1="643" y1="176" x2="676" y2="214" stroke="#1E6091" stroke-width="1.5"/>
    <text x="680" y="230" text-anchor="start">New user message</text>
  </g>
  <!-- brace for input / output -->
  <g stroke="#100D12" stroke-width="1.5" fill="none">
    <path d="M40 186 v8 h610 v-8"/>
    <path d="M650 186 v8 h130 v-8"/>
  </g>
  <g font-size="14" font-weight="700" fill="#100D12" text-anchor="middle">
    <text x="300" y="262">Input: the application assembles it</text>
    <text x="715" y="262">Output</text>
  </g>
  <text x="410" y="290" text-anchor="middle" font-size="12" fill="#555">input tokens + output tokens ≤ window size</text>
</svg>
