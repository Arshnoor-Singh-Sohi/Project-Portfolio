<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-label="The architecture of the Claude Agent SDK" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>The architecture of the Claude Agent SDK</title><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#100D12"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2A9D8F"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2D6A4F"/></marker><marker id="arrow-gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B8860B"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C81D25"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A8A8A"/></marker></defs><rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/><text x="640" y="44" font-family="Helvetica, Arial, sans-serif" font-size="30" fill="#100D12" font-weight="bold" text-anchor="middle">The Claude Agent SDK: who does what</text><rect x="30" y="80" width="380" height="470" rx="12" fill="#F3F7FB" stroke="#1E6091" stroke-width="2.5"/><text x="50" y="115" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#1E6091" font-weight="bold" text-anchor="start">Your Python process</text><rect x="55" y="140" width="330" height="70" rx="12" fill="#FFFFFF" stroke="#100D12" stroke-width="2.5"/><text x="220" y="183" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#100D12" font-weight="normal" text-anchor="middle">Your code</text><rect x="55" y="245" width="330" height="90" rx="12" fill="#FFFFFF" stroke="#100D12" stroke-width="2.5"/><text x="220" y="283" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#100D12" font-weight="bold" text-anchor="middle">SDK</text><text x="220" y="313" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" font-weight="normal" text-anchor="middle">query() or ClaudeSDKClient</text><rect x="55" y="420" width="330" height="100" rx="12" fill="#FFFFFF" stroke="#2A9D8F" stroke-width="2.5"/><text x="220" y="460" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#2A9D8F" font-weight="normal" text-anchor="middle">In-process MCP tools,</text><text x="220" y="490" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#2A9D8F" font-weight="normal" text-anchor="middle">hooks, permission checks</text><line x1="220" y1="210" x2="220" y2="243" stroke="#100D12" stroke-width="3" marker-end="url(#arrow-ink)"/><rect x="560" y="80" width="380" height="470" rx="12" fill="#F7F6F8" stroke="#100D12" stroke-width="2.5"/><text x="580" y="115" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#100D12" font-weight="bold" text-anchor="start">CLI subprocess (claude)</text><rect x="585" y="140" width="330" height="70" rx="12" fill="#FFFFFF" stroke="#100D12" stroke-width="2.5"/><text x="750" y="183" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#100D12" font-weight="bold" text-anchor="middle">Agent loop</text><rect x="585" y="230" width="330" height="60" rx="12" fill="#FFFFFF" stroke="#2A9D8F" stroke-width="2.5"/><text x="750" y="268" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#2A9D8F" font-weight="normal" text-anchor="middle">Built-in tools</text><rect x="585" y="310" width="330" height="60" rx="12" fill="#FFFFFF" stroke="#6A4C93" stroke-width="2.5"/><text x="750" y="348" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#6A4C93" font-weight="normal" text-anchor="middle">System prompt record</text><rect x="585" y="390" width="330" height="60" rx="12" fill="#FFFFFF" stroke="#100D12" stroke-width="2.5"/><text x="750" y="428" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#100D12" font-weight="normal" text-anchor="middle">Compaction</text><text x="750" y="495" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#100D12" font-weight="normal" text-anchor="middle" font-style="italic">One process per query() call.</text><text x="750" y="522" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#100D12" font-weight="normal" text-anchor="middle" font-style="italic">One process for a whole client.</text><line x1="387" y1="270" x2="557" y2="270" stroke="#100D12" stroke-width="3" marker-end="url(#arrow-ink)"/><text x="485" y="252" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" font-weight="bold" text-anchor="middle">stdin</text><line x1="560" y1="305" x2="387" y2="305" stroke="#100D12" stroke-width="3" marker-end="url(#arrow-ink)"/><text x="485" y="332" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" font-weight="bold" text-anchor="middle">stdout</text><text x="485" y="362" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#100D12" font-weight="normal" text-anchor="middle" font-style="italic">JSON lines</text><line x1="560" y1="470" x2="387" y2="470" stroke="#2A9D8F" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrow-teal)"/><text x="485" y="455" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#2A9D8F" font-weight="normal" text-anchor="middle">control</text><text x="485" y="500" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#2A9D8F" font-weight="normal" text-anchor="middle">request</text><rect x="1010" y="120" width="240" height="110" rx="12" fill="#FBF6EA" stroke="#B8860B" stroke-width="2.5"/><text x="1130" y="165" font-family="Helvetica, Arial, sans-serif" font-size="23" fill="#B8860B" font-weight="bold" text-anchor="middle">Model API</text><text x="1130" y="197" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#B8860B" font-weight="normal" text-anchor="middle">stateless calls</text><line x1="917" y1="165" x2="1007" y2="165" stroke="#B8860B" stroke-width="3" marker-end="url(#arrow-gold)"/><line x1="1007" y1="195" x2="917" y2="195" stroke="#B8860B" stroke-width="3" marker-end="url(#arrow-gold)"/><path d="M1000,346 a130.0,16 0 0,0 260,0 a130.0,16 0 0,0 -260,0 v168 a130.0,16 0 0,0 260,0 v-168" fill="#EEF5F1" stroke="#2D6A4F" stroke-width="2.5"/><text x="1130" y="395" font-family="Helvetica, Arial, sans-serif" font-size="23" fill="#2D6A4F" font-weight="bold" text-anchor="middle">Local disk</text><text x="1130" y="430" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#2D6A4F" font-weight="normal" text-anchor="middle">session file</text><text x="1130" y="460" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#2D6A4F" font-weight="normal" text-anchor="middle">&lt;session-id&gt;.jsonl</text><text x="1130" y="490" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#2D6A4F" font-weight="normal" text-anchor="middle" font-style="italic">(the CLI writes it)</text><line x1="942" y1="470" x2="997" y2="470" stroke="#2D6A4F" stroke-width="3" marker-end="url(#arrow-green)"/><text x="970" y="455" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#2D6A4F" font-weight="normal" text-anchor="middle">writes</text><rect x="30" y="580" width="1220" height="110" rx="12" fill="#FAFAFA" stroke="#8A8A8A" stroke-width="2" stroke-dasharray="8 6"/><text x="55" y="620" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#100D12" font-weight="normal" text-anchor="start">options become CLI flags. options.env sets the environment of the CLI only, not os.environ.</text><text x="55" y="655" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#100D12" font-weight="normal" text-anchor="start">The CLI calls the model, runs built-in tools, keeps the session file and compacts the context.</text></svg>