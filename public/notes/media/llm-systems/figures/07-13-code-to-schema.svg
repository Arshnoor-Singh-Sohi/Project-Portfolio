<text x="72" y="306" font-size="20" fill="#100D12" font-weight="normal" text-anchor="start" font-style="normal" font-family="Menlo, Consolas, monospace">        description="Order ID, ...")],</text>
<circle cx="48" cy="335" r="14" fill="#B8860B"/>
<text x="48" y="342" font-size="19" fill="#FFFFFF" font-weight="bold" text-anchor="middle" font-style="normal">6</text>
<text x="72" y="342" font-size="20" fill="#100D12" font-weight="normal" text-anchor="start" font-style="normal" font-family="Menlo, Consolas, monospace">) -&gt; Order:</text>
<circle cx="48" cy="371" r="14" fill="#B8860B"/>
<text x="48" y="378" font-size="19" fill="#FFFFFF" font-weight="bold" text-anchor="middle" font-style="normal">2</text>
<text x="72" y="378" font-size="20" fill="#100D12" font-weight="normal" text-anchor="start" font-style="normal" font-family="Menlo, Consolas, monospace">    """Return one production</text>
<circle cx="48" cy="407" r="14" fill="#B8860B"/>
<text x="48" y="414" font-size="19" fill="#FFFFFF" font-weight="bold" text-anchor="middle" font-style="normal">2</text>
<text x="72" y="414" font-size="20" fill="#100D12" font-weight="normal" text-anchor="start" font-style="normal" font-family="Menlo, Consolas, monospace">    order by its ID."""</text>
<text x="72" y="450" font-size="20" fill="#100D12" font-weight="normal" text-anchor="start" font-style="normal" font-family="Menlo, Consolas, monospace"></text>
<text x="72" y="486" font-size="20" fill="#100D12" font-weight="normal" text-anchor="start" font-style="normal" font-family="Menlo, Consolas, monospace">async def count_orders(</text>
<text x="72" y="522" font-size="20" fill="#100D12" font-weight="normal" text-anchor="start" font-style="normal" font-family="Menlo, Consolas, monospace">    status: Literal[...],</text>
