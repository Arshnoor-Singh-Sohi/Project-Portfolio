<text x="48" y="558" font-size="19" fill="#FFFFFF" font-weight="bold" text-anchor="middle" font-style="normal">7</text>
<text x="72" y="558" font-size="20" fill="#8A8A8A" font-weight="normal" text-anchor="start" font-style="normal" font-family="Menlo, Consolas, monospace">    ctx: Context) -&gt; int:</text>
<rect x="660" y="80" width="600" height="540" rx="10" fill="#F3EFF8" fill-opacity="1.0" stroke="#6A4C93" stroke-width="2.5"/>
<text x="680" y="118" font-size="21" fill="#6A4C93" font-weight="bold" text-anchor="start" font-style="normal">tools/list entry (real output, shortened)</text>
<circle cx="688" cy="155" r="14" fill="#B8860B"/>
<text x="688" y="162" font-size="19" fill="#FFFFFF" font-weight="bold" text-anchor="middle" font-style="normal">1</text>
<text x="712" y="162" font-size="20" fill="#100D12" font-weight="normal" text-anchor="start" font-style="normal" font-family="Menlo, Consolas, monospace">"name": "get_order",</text>
<circle cx="688" cy="191" r="14" fill="#B8860B"/>
<text x="688" y="198" font-size="19" fill="#FFFFFF" font-weight="bold" text-anchor="middle" font-style="normal">2</text>
<text x="712" y="198" font-size="20" fill="#100D12" font-weight="normal" text-anchor="start" font-style="normal" font-family="Menlo, Consolas, monospace">"description": "Return one</text>
<circle cx="688" cy="227" r="14" fill="#B8860B"/>
<text x="688" y="234" font-size="19" fill="#FFFFFF" font-weight="bold" text-anchor="middle" font-style="normal">2</text>
<text x="712" y="234" font-size="20" fill="#100D12" font-weight="normal" text-anchor="start" font-style="normal" font-family="Menlo, Consolas, monospace">   production order by its ID.",</text>
<text x="712" y="270" font-size="20" fill="#100D12" font-weight="normal" text-anchor="start" font-style="normal" font-family="Menlo, Consolas, monospace">"inputSchema": {</text>
<text x="712" y="306" font-size="20" fill="#100D12" font-weight="normal" text-anchor="start" font-style="normal" font-family="Menlo, Consolas, monospace">  "type": "object",</text>
<circle cx="688" cy="335" r="14" fill="#B8860B"/>
<text x="688" y="342" font-size="19" fill="#FFFFFF" font-weight="bold" text-anchor="middle" font-style="normal">3</text>
<text x="712" y="342" font-size="20" fill="#100D12" font-weight="normal" text-anchor="start" font-style="normal" font-family="Menlo, Consolas, monospace">  "properties": {"order_id": {</text>
<circle cx="688" cy="371" r="14" fill="#B8860B"/>
<text x="688" y="378" font-size="19" fill="#FFFFFF" font-weight="bold" text-anchor="middle" font-style="normal">3</text>
<text x="712" y="378" font-size="20" fill="#100D12" font-weight="normal" text-anchor="start" font-style="normal" font-family="Menlo, Consolas, monospace">    "type": "string",</text>
<circle cx="688" cy="407" r="14" fill="#B8860B"/>
<text x="688" y="414" font-size="19" fill="#FFFFFF" font-weight="bold" text-anchor="middle" font-style="normal">4</text>
<text x="712" y="414" font-size="20" fill="#100D12" font-weight="normal" text-anchor="start" font-style="normal" font-family="Menlo, Consolas, monospace">    "pattern": "^PO-\\d{4}$",</text>
<circle cx="688" cy="443" r="14" fill="#B8860B"/>
<text x="688" y="450" font-size="19" fill="#FFFFFF" font-weight="bold" text-anchor="middle" font-style="normal">4</text>
<text x="712" y="450" font-size="20" fill="#100D12" font-weight="normal" text-anchor="start" font-style="normal" font-family="Menlo, Consolas, monospace">    "description": "Order ID, ...",</text>
<text x="712" y="486" font-size="20" fill="#100D12" font-weight="normal" text-anchor="start" font-style="normal" font-family="Menlo, Consolas, monospace">    "title": "Order Id"}},</text>
<circle cx="688" cy="515" r="14" fill="#B8860B"/>
<text x="688" y="522" font-size="19" fill="#FFFFFF" font-weight="bold" text-anchor="middle" font-style="normal">5</text>
<text x="712" y="522" font-size="20" fill="#100D12" font-weight="normal" text-anchor="start" font-style="normal" font-family="Menlo, Consolas, monospace">  "required": ["order_id"]},</text>
<circle cx="688" cy="551" r="14" fill="#B8860B"/>
<text x="688" y="558" font-size="19" fill="#FFFFFF" font-weight="bold" text-anchor="middle" font-style="normal">6</text>
<text x="712" y="558" font-size="20" fill="#100D12" font-weight="normal" text-anchor="start" font-style="normal" font-family="Menlo, Consolas, monospace">"outputSchema": {"title": "Order", ...}</text>
<text x="20" y="666" font-size="21" fill="#100D12" font-weight="bold" text-anchor="start" font-style="normal">The mapping:</text>
<text x="20" y="700" font-size="19" fill="#100D12" font-weight="normal" text-anchor="start" font-style="normal">1  function name → name</text>
<text x="660" y="700" font-size="19" fill="#100D12" font-weight="normal" text-anchor="start" font-style="normal">2  docstring → description</text>
<text x="20" y="730" font-size="19" fill="#100D12" font-weight="normal" text-anchor="start" font-style="normal">3  parameter + type hint → typed property</text>
<text x="660" y="730" font-size="19" fill="#100D12" font-weight="normal" text-anchor="start" font-style="normal">4  Field(pattern=, description=) → keywords</text>
<text x="20" y="760" font-size="19" fill="#100D12" font-weight="normal" text-anchor="start" font-style="normal">5  parameter without a default → required</text>
<text x="660" y="760" font-size="19" fill="#100D12" font-weight="normal" text-anchor="start" font-style="normal">6  return type (Pydantic model) → outputSchema</text>
<text x="20" y="790" font-size="19" fill="#8A8A8A" font-weight="normal" text-anchor="start" font-style="normal">7  ctx: Context → left out of the schema</text>
</svg>