<text x="640.0" y="44.0" font-family="Helvetica, Arial, sans-serif" font-size="28" font-weight="bold" fill="#100D12" text-anchor="middle">One MCP endpoint, two revisions of Streamable HTTP</text>
<text x="330" y="92.0" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="bold" fill="#100D12" text-anchor="middle">2025-11-25: a session</text>
<rect x="30" y="115" width="345" height="74" rx="8" fill="#1E6091" fill-opacity="0.07" stroke="#1E6091" stroke-width="2.5"/>
<text x="44" y="145.0" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="normal" fill="#1E6091" text-anchor="start">POST initialize</text>
<line x1="378" y1="152.0" x2="412" y2="152.0" stroke="#100D12" stroke-width="2" marker-end="url(#a100D12)"/>
<rect x="416" y="115" width="214" height="74" rx="8" fill="#6A4C93" fill-opacity="0.07" stroke="#6A4C93" stroke-width="2.5"/>
<text x="428" y="145.0" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="normal" fill="#6A4C93" text-anchor="start">200 and header</text>
<text x="428" y="168.8" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="normal" fill="#6A4C93" text-anchor="start">Mcp-Session-Id</text>
