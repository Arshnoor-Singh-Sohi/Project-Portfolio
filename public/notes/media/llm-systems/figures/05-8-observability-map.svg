<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="780" viewBox="0 0 1280 780">
<rect x="0" y="0" width="1280" height="780" fill="#FFFFFF"/>
<defs><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E6091"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B8860B"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6A4C93"/></marker><marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2D6A4F"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C81D25"/></marker><marker id="agy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A8A8A"/></marker><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#100D12"/></marker></defs>
<text x="640.0" y="46" font-family="Helvetica, Arial, sans-serif" font-size="28" fill="#100D12" font-weight="bold" text-anchor="middle">What to measure, and where it goes</text>
<rect x="20" y="80" width="390" height="190" rx="10" fill="#FFFFFF" stroke="#1E6091" stroke-width="3"/>
<text x="40" y="116" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#1E6091" font-weight="bold" text-anchor="start">Gateway</text>
<text x="40" y="152" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" font-weight="normal" text-anchor="start">errors by status: 429, 5xx, 529</text>
<text x="40" y="181" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" font-weight="normal" text-anchor="start">client TTFT and latency</text>
<text x="40" y="210" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" font-weight="normal" text-anchor="start">tokens per tenant, fallbacks</text>
<line x1="215" y1="270" x2="215" y2="327" stroke="#100D12" stroke-width="3" marker-end="url(#ak)"/>
<rect x="445" y="80" width="390" height="190" rx="10" fill="#FFFFFF" stroke="#6A4C93" stroke-width="3"/>
<text x="465" y="116" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#6A4C93" font-weight="bold" text-anchor="start">vLLM engine</text>
<text x="465" y="152" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" font-weight="normal" text-anchor="start">requests waiting and running</text>
<text x="465" y="181" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" font-weight="normal" text-anchor="start">KV usage, preemptions</text>
<text x="465" y="210" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" font-weight="normal" text-anchor="start">TTFT, inter-token latency</text>
<text x="465" y="239" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" font-weight="normal" text-anchor="start">prefix hits, finish reasons</text>
<line x1="640" y1="270" x2="640" y2="327" stroke="#100D12" stroke-width="3" marker-end="url(#ak)"/>
<rect x="870" y="80" width="390" height="190" rx="10" fill="#FFFFFF" stroke="#B8860B" stroke-width="3"/>
<text x="890" y="116" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#100D12" font-weight="bold" text-anchor="start">GPU node (DCGM)</text>
<text x="890" y="152" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" font-weight="normal" text-anchor="start">DRAM active, tensor active</text>
<text x="890" y="181" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" font-weight="normal" text-anchor="start">Xid errors, remapped rows</text>
<text x="890" y="210" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" font-weight="normal" text-anchor="start">temperature, power, NVLink</text>
<line x1="1065" y1="270" x2="1065" y2="327" stroke="#100D12" stroke-width="3" marker-end="url(#ak)"/>
<rect x="20" y="330" width="1240" height="110" rx="10" fill="#FFFFFF" stroke="#100D12" stroke-width="2"/>
<text x="40" y="368" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#100D12" font-weight="bold" text-anchor="start">Metrics to Prometheus</text>
<text x="40" y="402" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#100D12" font-weight="normal" text-anchor="start">scraped every 15 s to 1 min</text>
<text x="465" y="368" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#100D12" font-weight="bold" text-anchor="start">Traces to an OTel collector</text>
<text x="465" y="402" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#100D12" font-weight="normal" text-anchor="start">gen_ai.* spans, no prompts</text>
<text x="890" y="368" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#100D12" font-weight="bold" text-anchor="start">Logs to a log store</text>
<text x="890" y="402" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#100D12" font-weight="normal" text-anchor="start">IDs, counts, latency, no content</text>
<rect x="20" y="510" width="295" height="140" rx="10" fill="#FFFFFF" stroke="#100D12" stroke-width="2"/>
<text x="38" y="548" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#100D12" font-weight="bold" text-anchor="start">Dashboards</text>
<text x="38" y="584" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#100D12" font-weight="normal" text-anchor="start">per model, per tenant</text>
<rect x="335" y="510" width="295" height="140" rx="10" fill="#FFFFFF" stroke="#C81D25" stroke-width="3"/>
<text x="353" y="548" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#C81D25" font-weight="bold" text-anchor="start">SLO burn-rate alerts</text>
<text x="353" y="584" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#100D12" font-weight="normal" text-anchor="start">page at 14.4 over</text>
<text x="353" y="610" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#100D12" font-weight="normal" text-anchor="start">1 hour and 5 minutes</text>
<rect x="650" y="510" width="295" height="140" rx="10" fill="#FFFFFF" stroke="#100D12" stroke-width="2"/>
<text x="668" y="548" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#100D12" font-weight="bold" text-anchor="start">Autoscaler (L5)</text>
<text x="668" y="584" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#100D12" font-weight="normal" text-anchor="start">queue and running</text>
<rect x="965" y="510" width="295" height="140" rx="10" fill="#FFFFFF" stroke="#2D6A4F" stroke-width="3"/>
<text x="983" y="548" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#2D6A4F" font-weight="bold" text-anchor="start">Protected content store</text>
<text x="983" y="584" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#100D12" font-weight="normal" text-anchor="start">opt-in, separate access,</text>
<text x="983" y="610" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#100D12" font-weight="normal" text-anchor="start">retention, redaction</text>
<line x1="167" y1="440" x2="167" y2="507" stroke="#100D12" stroke-width="3" marker-end="url(#ak)"/>
<line x1="482" y1="440" x2="482" y2="507" stroke="#100D12" stroke-width="3" marker-end="url(#ak)"/>
<line x1="797" y1="440" x2="797" y2="507" stroke="#100D12" stroke-width="3" marker-end="url(#ak)"/>
<line x1="1112" y1="440" x2="1112" y2="507" stroke="#8A8A8A" stroke-width="3" marker-end="url(#agy)" stroke-dasharray="8 6"/>
<text x="1125" y="482" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#8A8A8A" font-weight="normal" text-anchor="start">only if opted in</text>
<text x="640" y="720" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#C81D25" font-weight="bold" text-anchor="middle">Blind spot: HTTP 200 with a worse answer. Add sampled evaluations as an SLI.</text>
</svg>
