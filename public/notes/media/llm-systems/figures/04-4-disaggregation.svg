<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 700" width="1280" height="700"><defs><marker id="a1E6091" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E6091"/></marker><marker id="s1E6091" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E6091"/></marker><marker id="aB8860B" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B8860B"/></marker><marker id="sB8860B" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B8860B"/></marker><marker id="a6A4C93" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6A4C93"/></marker><marker id="s6A4C93" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6A4C93"/></marker><marker id="a2D6A4F" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2D6A4F"/></marker><marker id="s2D6A4F" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2D6A4F"/></marker><marker id="aC81D25" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C81D25"/></marker><marker id="sC81D25" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C81D25"/></marker><marker id="a8A8A8A" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A8A8A"/></marker><marker id="s8A8A8A" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A8A8A"/></marker><marker id="a100D12" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#100D12"/></marker><marker id="s100D12" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#100D12"/></marker></defs><rect x="0" y="0" width="1280" height="700" fill="#FFFFFF"/><text x="640.0" y="44" font-family="Helvetica, Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="middle" fill="#100D12">Prefill-decode disaggregation: two pools and a KV cache transfer</text><rect x="420" y="75" width="440" height="90" rx="6" fill="none" stroke="#1E6091" stroke-width="3"/><text x="640" y="115" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" fill="#1E6091">Router</text><text x="640" y="142" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="normal" text-anchor="middle" fill="#100D12">prefill first, then decode</text><rect x="60" y="230" width="470" height="260" rx="6" fill="none" stroke="#B8860B" stroke-width="3"/><text x="295" y="268" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" fill="#B8860B">Prefill pool (compute-bound)</text><rect x="95" y="295" width="120" height="90" rx="6" fill="#B8860B" fill-opacity="0.8" stroke="#B8860B" stroke-width="2"/><text x="155" y="348" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#FFFFFF">GPU P1</text><rect x="235" y="295" width="120" height="90" rx="6" fill="#B8860B" fill-opacity="0.8" stroke="#B8860B" stroke-width="2"/><text x="295" y="348" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#FFFFFF">GPU P2</text><rect x="375" y="295" width="120" height="90" rx="6" fill="#B8860B" fill-opacity="0.8" stroke="#B8860B" stroke-width="2"/><text x="435" y="348" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#FFFFFF">GPU P3</text><text x="295" y="425" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" text-anchor="middle" fill="#100D12">runs the prompt, makes token 1,</text><text x="295" y="455" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" text-anchor="middle" fill="#100D12">writes the KV cache</text><rect x="750" y="230" width="470" height="260" rx="6" fill="none" stroke="#6A4C93" stroke-width="3"/><text x="985" y="268" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" fill="#6A4C93">Decode pool (memory-bound)</text><rect x="785" y="295" width="120" height="90" rx="6" fill="#6A4C93" fill-opacity="0.8" stroke="#6A4C93" stroke-width="2"/><text x="845" y="348" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#FFFFFF">GPU D1</text><rect x="925" y="295" width="120" height="90" rx="6" fill="#6A4C93" fill-opacity="0.8" stroke="#6A4C93" stroke-width="2"/><text x="985" y="348" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#FFFFFF">GPU D2</text><rect x="1065" y="295" width="120" height="90" rx="6" fill="#6A4C93" fill-opacity="0.8" stroke="#6A4C93" stroke-width="2"/><text x="1125" y="348" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#FFFFFF">GPU D3</text><text x="985" y="425" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" text-anchor="middle" fill="#100D12">large batches of decode steps,</text><text x="985" y="455" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" text-anchor="middle" fill="#100D12">streams tokens 2, 3, 4, ...</text><line x1="560" y1="160" x2="330" y2="228" stroke="#1E6091" stroke-width="3" marker-end="url(#a1E6091)"/><line x1="720" y1="160" x2="950" y2="228" stroke="#1E6091" stroke-width="3" marker-end="url(#a1E6091)"/><line x1="530" y1="340" x2="748" y2="340" stroke="#2D6A4F" stroke-width="6" marker-end="url(#a2D6A4F)"/><text x="640" y="318" font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="bold" text-anchor="middle" fill="#2D6A4F">KV cache</text><text x="640" y="372" font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="bold" text-anchor="middle" fill="#2D6A4F">transfer</text><text x="640" y="545" font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="bold" text-anchor="middle" fill="#100D12">Llama-3.1-8B, 2,000-token prompt: KV cache = 2,000 × 128 KiB = 262 MB.</text><text x="640" y="583" font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="normal" text-anchor="middle" fill="#100D12">At 50 GB/s (a 400 Gb/s link): about 5.2 ms.   At 3.125 GB/s (a 25 Gb/s link): about 84 ms.</text><text x="640" y="621" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" text-anchor="middle" fill="#100D12">Splitwise sends the KV cache layer by layer, so most of the transfer overlaps the prefill.</text><text x="640" y="659" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" text-anchor="middle" fill="#100D12">Gain: each pool has its own batch size and parallelism, and prefills never stall decodes.</text></svg>