<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 900" width="1280" height="900"><defs><marker id="a1E6091" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E6091"/></marker><marker id="s1E6091" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E6091"/></marker><marker id="aB8860B" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B8860B"/></marker><marker id="sB8860B" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B8860B"/></marker><marker id="a6A4C93" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6A4C93"/></marker><marker id="s6A4C93" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6A4C93"/></marker><marker id="a2D6A4F" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2D6A4F"/></marker><marker id="s2D6A4F" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2D6A4F"/></marker><marker id="aC81D25" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C81D25"/></marker><marker id="sC81D25" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C81D25"/></marker><marker id="a8A8A8A" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A8A8A"/></marker><marker id="s8A8A8A" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A8A8A"/></marker><marker id="a100D12" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#100D12"/></marker><marker id="s100D12" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#100D12"/></marker></defs><rect x="0" y="0" width="1280" height="900" fill="#FFFFFF"/>
<text x="640.0" y="44.0" font-family="Helvetica, Arial, sans-serif" font-size="28" font-weight="bold" fill="#100D12" text-anchor="middle">The 2025-11-25 lifecycle: handshake, operation, shutdown</text>
<rect x="220" y="75" width="220" height="50" rx="12" fill="#1E6091" fill-opacity="0.08" stroke="#1E6091" stroke-width="2.5"/>
<text x="330" y="108.0" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" fill="#1E6091" text-anchor="middle">Client</text>
<rect x="890" y="75" width="220" height="50" rx="12" fill="#6A4C93" fill-opacity="0.08" stroke="#6A4C93" stroke-width="2.5"/>
<text x="1000" y="108.0" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" fill="#6A4C93" text-anchor="middle">Server</text>
<line x1="330" y1="125" x2="330" y2="840" stroke="#1E6091" stroke-width="2" stroke-dasharray="9 6"/>
<line x1="1000" y1="125" x2="1000" y2="840" stroke="#6A4C93" stroke-width="2" stroke-dasharray="9 6"/>
<rect x="1018" y="205" width="26" height="590" rx="6" fill="#2D6A4F" fill-opacity="0.35" stroke="#2D6A4F" stroke-width="2.5"/>
<text x="1056" y="470.0" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" fill="#2D6A4F" text-anchor="start">session</text>
<text x="1056" y="498.0" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="normal" fill="#2D6A4F" text-anchor="start">version,</text>
<text x="1056" y="522.0" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="normal" fill="#2D6A4F" text-anchor="start">capabilities,</text>
<text x="1056" y="546.0" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="normal" fill="#2D6A4F" text-anchor="start">subscriptions,</text>
<text x="1056" y="570.0" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="normal" fill="#2D6A4F" text-anchor="start">log level,</text>
<text x="1056" y="594.0" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="normal" fill="#2D6A4F" text-anchor="start">waiting calls</text>
<rect x="30" y="140" width="150" height="205" rx="8" fill="none" fill-opacity="1.0" stroke="#8A8A8A" stroke-width="2.5" stroke-dasharray="9 6"/>
<text x="105" y="249.5" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" fill="#100D12" text-anchor="middle">Initialization</text>
<rect x="30" y="355" width="150" height="400" rx="8" fill="none" fill-opacity="1.0" stroke="#8A8A8A" stroke-width="2.5" stroke-dasharray="9 6"/>
<text x="105" y="562.0" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" fill="#100D12" text-anchor="middle">Operation</text>
<rect x="30" y="765" width="150" height="80" rx="8" fill="none" fill-opacity="1.0" stroke="#8A8A8A" stroke-width="2.5" stroke-dasharray="9 6"/>
<text x="105" y="812.0" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" fill="#100D12" text-anchor="middle">Shutdown</text>
<line x1="334" y1="180" x2="996" y2="180" stroke="#1E6091" stroke-width="2.5" marker-end="url(#a1E6091)"/>
<text x="665.0" y="170.0" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" fill="#100D12" text-anchor="middle">initialize (id 1): protocolVersion, capabilities, clientInfo</text>
<line x1="996" y1="255" x2="334" y2="255" stroke="#6A4C93" stroke-width="2.5" marker-end="url(#a6A4C93)"/>
<text x="665.0" y="245.0" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" fill="#100D12" text-anchor="middle">result (id 1): protocolVersion, capabilities, serverInfo, instructions</text>
<line x1="334" y1="325" x2="996" y2="325" stroke="#1E6091" stroke-width="2.5" stroke-dasharray="9 6" marker-end="url(#a1E6091)"/>
<text x="665.0" y="315.0" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" fill="#100D12" text-anchor="middle">notifications/initialized (no id, no reply)</text>
<line x1="334" y1="395" x2="996" y2="395" stroke="#1E6091" stroke-width="2.5" marker-end="url(#a1E6091)"/>
<text x="665.0" y="385.0" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" fill="#100D12" text-anchor="middle">tools/list (id 2), then tools/call (id 3)</text>
<line x1="996" y1="465" x2="334" y2="465" stroke="#6A4C93" stroke-width="2.5" marker-end="url(#a6A4C93)"/>
<text x="665.0" y="455.0" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" fill="#100D12" text-anchor="middle">elicitation/create (id 1): a request from the SERVER</text>
<text x="665.0" y="489.0" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="normal" fill="#8A8A8A" text-anchor="middle">the tool call (id 3) waits in server memory</text>
<line x1="334" y1="560" x2="996" y2="560" stroke="#1E6091" stroke-width="2.5" marker-end="url(#a1E6091)"/>
<text x="665.0" y="550.0" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" fill="#100D12" text-anchor="middle">response (id 1): action accept, content</text>
<line x1="996" y1="630" x2="334" y2="630" stroke="#6A4C93" stroke-width="2.5" marker-end="url(#a6A4C93)"/>
<text x="665.0" y="620.0" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" fill="#100D12" text-anchor="middle">result (id 3): content, isError</text>
<line x1="334" y1="710" x2="996" y2="710" stroke="#1E6091" stroke-width="2.5" marker-end="url(#a1E6091)"/>
<text x="665.0" y="700.0" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" fill="#100D12" text-anchor="middle">ping (either side) and its empty result {}</text>
<line x1="334" y1="805" x2="996" y2="805" stroke="#1E6091" stroke-width="2.5" marker-end="url(#a1E6091)"/>
<text x="665.0" y="795.0" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" fill="#100D12" text-anchor="middle">close stdin, or DELETE with Mcp-Session-Id (HTTP)</text>
<text x="640" y="880.0" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" fill="#100D12" text-anchor="middle">Everything above the shutdown line is read in the context of the handshake that the server remembers.</text></svg>
