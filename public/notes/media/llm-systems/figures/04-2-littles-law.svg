<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640"><defs><marker id="a1E6091" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E6091"/></marker><marker id="s1E6091" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E6091"/></marker><marker id="aB8860B" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B8860B"/></marker><marker id="sB8860B" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B8860B"/></marker><marker id="a6A4C93" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6A4C93"/></marker><marker id="s6A4C93" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6A4C93"/></marker><marker id="a2D6A4F" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2D6A4F"/></marker><marker id="s2D6A4F" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2D6A4F"/></marker><marker id="aC81D25" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C81D25"/></marker><marker id="sC81D25" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C81D25"/></marker><marker id="a8A8A8A" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A8A8A"/></marker><marker id="s8A8A8A" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A8A8A"/></marker><marker id="a100D12" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#100D12"/></marker><marker id="s100D12" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#100D12"/></marker></defs><rect x="0" y="0" width="1280" height="640" fill="#FFFFFF"/><text x="640.0" y="44" font-family="Helvetica, Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="middle" fill="#100D12">Little's law: requests in the system = arrival rate × time in the system</text><line x1="60" y1="200" x2="300" y2="200" stroke="#1E6091" stroke-width="3" marker-end="url(#a1E6091)"/><line x1="60" y1="260" x2="300" y2="260" stroke="#1E6091" stroke-width="3" marker-end="url(#a1E6091)"/><line x1="60" y1="320" x2="300" y2="320" stroke="#1E6091" stroke-width="3" marker-end="url(#a1E6091)"/><line x1="60" y1="380" x2="300" y2="380" stroke="#1E6091" stroke-width="3" marker-end="url(#a1E6091)"/><text x="180" y="170" font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="bold" text-anchor="middle" fill="#1E6091">arrivals</text><text x="180" y="430" font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="bold" text-anchor="middle" fill="#1E6091">λ = 5 requests/s</text><rect x="320" y="130" width="560" height="330" rx="6" fill="none" stroke="#6A4C93" stroke-width="3"/><text x="600" y="168" font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="bold" text-anchor="middle" fill="#6A4C93">the serving system (queue + running batch)</text><rect x="350" y="195" width="40" height="40" rx="5" fill="#6A4C93" fill-opacity="0.35" stroke="#6A4C93" stroke-width="2"/><rect x="402" y="195" width="40" height="40" rx="5" fill="#6A4C93" fill-opacity="0.35" stroke="#6A4C93" stroke-width="2"/><rect x="454" y="195" width="40" height="40" rx="5" fill="#6A4C93" fill-opacity="0.35" stroke="#6A4C93" stroke-width="2"/><rect x="506" y="195" width="40" height="40" rx="5" fill="#6A4C93" fill-opacity="0.35" stroke="#6A4C93" stroke-width="2"/><rect x="558" y="195" width="40" height="40" rx="5" fill="#6A4C93" fill-opacity="0.35" stroke="#6A4C93" stroke-width="2"/><rect x="610" y="195" width="40" height="40" rx="5" fill="#6A4C93" fill-opacity="0.35" stroke="#6A4C93" stroke-width="2"/><rect x="662" y="195" width="40" height="40" rx="5" fill="#6A4C93" fill-opacity="0.35" stroke="#6A4C93" stroke-width="2"/><rect x="714" y="195" width="40" height="40" rx="5" fill="#6A4C93" fill-opacity="0.35" stroke="#6A4C93" stroke-width="2"/><rect x="766" y="195" width="40" height="40" rx="5" fill="#6A4C93" fill-opacity="0.35" stroke="#6A4C93" stroke-width="2"/><rect x="818" y="195" width="40" height="40" rx="5" fill="#6A4C93" fill-opacity="0.35" stroke="#6A4C93" stroke-width="2"/><rect x="350" y="247" width="40" height="40" rx="5" fill="#6A4C93" fill-opacity="0.35" stroke="#6A4C93" stroke-width="2"/><rect x="402" y="247" width="40" height="40" rx="5" fill="#6A4C93" fill-opacity="0.35" stroke="#6A4C93" stroke-width="2"/><rect x="454" y="247" width="40" height="40" rx="5" fill="#6A4C93" fill-opacity="0.35" stroke="#6A4C93" stroke-width="2"/><rect x="506" y="247" width="40" height="40" rx="5" fill="#6A4C93" fill-opacity="0.35" stroke="#6A4C93" stroke-width="2"/><rect x="558" y="247" width="40" height="40" rx="5" fill="#6A4C93" fill-opacity="0.35" stroke="#6A4C93" stroke-width="2"/><rect x="610" y="247" width="40" height="40" rx="5" fill="#6A4C93" fill-opacity="0.35" stroke="#6A4C93" stroke-width="2"/><rect x="662" y="247" width="40" height="40" rx="5" fill="#6A4C93" fill-opacity="0.35" stroke="#6A4C93" stroke-width="2"/><rect x="714" y="247" width="40" height="40" rx="5" fill="#6A4C93" fill-opacity="0.35" stroke="#6A4C93" stroke-width="2"/><rect x="766" y="247" width="40" height="40" rx="5" fill="#6A4C93" fill-opacity="0.35" stroke="#6A4C93" stroke-width="2"/><rect x="818" y="247" width="40" height="40" rx="5" fill="#6A4C93" fill-opacity="0.35" stroke="#6A4C93" stroke-width="2"/><rect x="350" y="299" width="40" height="40" rx="5" fill="#6A4C93" fill-opacity="0.35" stroke="#6A4C93" stroke-width="2"/><rect x="402" y="299" width="40" height="40" rx="5" fill="#6A4C93" fill-opacity="0.35" stroke="#6A4C93" stroke-width="2"/><rect x="454" y="299" width="40" height="40" rx="5" fill="#6A4C93" fill-opacity="0.35" stroke="#6A4C93" stroke-width="2"/><rect x="506" y="299" width="40" height="40" rx="5" fill="#6A4C93" fill-opacity="0.35" stroke="#6A4C93" stroke-width="2"/><rect x="558" y="299" width="40" height="40" rx="5" fill="#6A4C93" fill-opacity="0.35" stroke="#6A4C93" stroke-width="2"/><rect x="610" y="299" width="40" height="40" rx="5" fill="#6A4C93" fill-opacity="0.35" stroke="#6A4C93" stroke-width="2"/><rect x="662" y="299" width="40" height="40" rx="5" fill="#6A4C93" fill-opacity="0.35" stroke="#6A4C93" stroke-width="2"/><rect x="714" y="299" width="40" height="40" rx="5" fill="#6A4C93" fill-opacity="0.35" stroke="#6A4C93" stroke-width="2"/><rect x="766" y="299" width="40" height="40" rx="5" fill="#6A4C93" fill-opacity="0.35" stroke="#6A4C93" stroke-width="2"/><rect x="818" y="299" width="40" height="40" rx="5" fill="#6A4C93" fill-opacity="0.35" stroke="#6A4C93" stroke-width="2"/><rect x="350" y="351" width="40" height="40" rx="5" fill="#6A4C93" fill-opacity="0.35" stroke="#6A4C93" stroke-width="2"/><rect x="402" y="351" width="40" height="40" rx="5" fill="#6A4C93" fill-opacity="0.35" stroke="#6A4C93" stroke-width="2"/><rect x="454" y="351" width="40" height="40" rx="5" fill="#6A4C93" fill-opacity="0.35" stroke="#6A4C93" stroke-width="2"/><rect x="506" y="351" width="40" height="40" rx="5" fill="#6A4C93" fill-opacity="0.35" stroke="#6A4C93" stroke-width="2"/><rect x="558" y="351" width="40" height="40" rx="5" fill="#6A4C93" fill-opacity="0.35" stroke="#6A4C93" stroke-width="2"/><rect x="610" y="351" width="40" height="40" rx="5" fill="#6A4C93" fill-opacity="0.35" stroke="#6A4C93" stroke-width="2"/><rect x="662" y="351" width="40" height="40" rx="5" fill="#6A4C93" fill-opacity="0.35" stroke="#6A4C93" stroke-width="2"/><rect x="714" y="351" width="40" height="40" rx="5" fill="#6A4C93" fill-opacity="0.35" stroke="#6A4C93" stroke-width="2"/><rect x="766" y="351" width="40" height="40" rx="5" fill="#6A4C93" fill-opacity="0.35" stroke="#6A4C93" stroke-width="2"/><rect x="818" y="351" width="40" height="40" rx="5" fill="#6A4C93" fill-opacity="0.35" stroke="#6A4C93" stroke-width="2"/><text x="600" y="440" font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="bold" text-anchor="middle" fill="#6A4C93">L = 40 requests inside, on average</text><line x1="900" y1="200" x2="1140" y2="200" stroke="#100D12" stroke-width="3" marker-end="url(#a100D12)"/><line x1="900" y1="260" x2="1140" y2="260" stroke="#100D12" stroke-width="3" marker-end="url(#a100D12)"/><line x1="900" y1="320" x2="1140" y2="320" stroke="#100D12" stroke-width="3" marker-end="url(#a100D12)"/><line x1="900" y1="380" x2="1140" y2="380" stroke="#100D12" stroke-width="3" marker-end="url(#a100D12)"/><text x="1020" y="170" font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="bold" text-anchor="middle" fill="#100D12">departures</text><text x="1020" y="430" font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="bold" text-anchor="middle" fill="#100D12">average stay W = 8 s</text><text x="640" y="515" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#100D12">L = λ × W = 5 × 8 = 40 requests in the system, on average</text><text x="640" y="560" font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="normal" text-anchor="middle" fill="#100D12">If one replica can hold 32 requests and still meet the SLO, you need ceil(40 / 32) = 2 replicas.</text><text x="640" y="600" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" text-anchor="middle" fill="#100D12">The law links long-run averages. It needs a stable system: on average, arrivals do not exceed capacity.</text></svg>