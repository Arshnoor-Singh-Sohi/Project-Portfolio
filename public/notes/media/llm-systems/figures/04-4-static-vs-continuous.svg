="middle" fill="#100D12">0</text><rect x="254" y="384" width="92" height="52" rx="6" fill="#B8860B" fill-opacity="0.8" stroke="#B8860B" stroke-width="2"/><text x="300.0" y="418" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="bold" text-anchor="middle" fill="#FFFFFF">R1 prefill</text><rect x="254" y="444" width="92" height="52" rx="6" fill="#B8860B" fill-opacity="0.8" stroke="#B8860B" stroke-width="2"/><text x="300.0" y="478" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="bold" text-anchor="middle" fill="#FFFFFF">R2 prefill</text><text x="400.0" y="370" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="normal" text-anchor="middle" fill="#100D12">1</text><rect x="354" y="384" width="92" height="52" rx="6" fill="#6A4C93" fill-opacity="0.8" stroke="#6A4C93" stroke-width="2"/><text x="400.0" y="418" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="bold" text-anchor="middle" fill="#FFFFFF">R1</text><rect x="354" y="444" width="92" height="52" rx="6" fill="#6A4C93" fill-opacity="0.8" stroke="#6A4C93" stroke-width="2"/><text x="400.0" y="478" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="bold" text-anchor="middle" fill="#FFFFFF">R2</text><text x="500.0" y="370" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="normal" text-anchor="middle" fill="#100D12">2</text><rect x="454" y="384" width="92" height="52" rx="6" fill="#B8860B" fill-opacity="0.8" stroke="#B8860B" stroke-width="2"/><text x="500.0" y="418" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="bold" text-anchor="middle" fill="#FFFFFF">R3 prefill</text><rect x="454" y="444" width="92" height="52" rx="6" fill="#6A4C93" fill-opacity="0.8" stroke="#6A4C93" stroke-width="2"/><text x="500.0" y="478" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="bold" text-anchor="middle" fill="#FFFFFF">R2</text><text x="600.0" y="370" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="normal" text-anchor="middle" fill="#100D12">3</text><rect x="554" y="384" width="92" height="52" rx="6" fill="#6A4C93" fill-opacity="0.8" stroke="#6A4C93" stroke-width="2"/><text x="600.0" y="418" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="bold" text-anchor="middle" fill="#FFFFFF">R3</text><rect x="554" y="444" width="92" height="52" rx="6" fill="#6A4C93" fill-opacity="0.8" stroke="#6A4C93" stroke-width="2"/><text x="600.0" y="478" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="bold" text-anchor="middle" fill="#FFFFFF">R2</text><text x="700.0" y="370" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="normal" text-anchor="middle" fill="#100D12">4</text><rect x="654" y="384" width="92" height="52" rx="6" fill="#6A4C93" fill-opacity="0.8" stroke="#6A4C93" stroke-width="2"/><text x="700.0" y="418" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="bold" text-anchor="middle" fill="#FFFFFF">R3</text><rect x="654" y="444" width="92" height="52" rx="6" fill="#6A4C93" fill-opacity="0.8" stroke="#6A4C93" stroke-width="2"/><text x="700.0" y="478" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="bold" text-anchor="middle" fill="#FFFFFF">R2</text><text x="800.0" y="370" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="normal" text-anchor="middle" fill="#100D12">5</text><rect x="754" y="384" width="92" height="52" rx="6" fill="#B8860B" fill-opacity="0.8" stroke="#B8860B" stroke-width="2"/><text x="800.0" y="418" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="bold" text-anchor="middle" fill="#FFFFFF">R4 prefill</text><rect x="754" y="444" width="92" height="52" rx="6" fill="#6A4C93" fill-opacity="0.8" stroke="#6A4C93" stroke-width="2"/><text x="800.0" y="478" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="bold" text-anchor="middle" fill="#FFFFFF">R2</text><text x="900.0" y="370" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="normal" text-anchor="middle" fill="#100D12">6</text><rect x="854" y="384" width="92" height="52" rx="6" fill="#6A4C93" fill-opacity="0.8" stroke="#6A4C93" stroke-width="2"/><text x="900.0" y="418" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="bold" text-anchor="middle" fill="#FFFFFF">R4</text><rect x="854" y="444" width="92" height="52" rx="6" fill="#C81D25" fill-opacity="0.12" stroke="#C81D25" stroke-width="2" stroke-dasharray="6,4"/><text x="900.0" y="478" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="bold" text-anchor="middle" fill="#C81D25">idle</text><text x="236" y="418" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="normal" text-anchor="end" fill="#100D12">slot 1</text><text x="236" y="478" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="normal" text-anchor="end" fill="#100D12">slot 2</text><text x="250" y="534" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#100D12">7 steps. Mean latency 4.25 steps. Slots used 13 of 14 (93%).</text><text x="30" y="640" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#100D12">Requests: R1 and R2 arrive at step 0, R3 at step 1, R4 at step 2.</text><text x="30" y="672" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#100D12">Output tokens: R1 = 2, R2 = 6, R3 = 3, R4 = 2. One step produces one token for each running request.</text><text x="30" y="704" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#100D12">Gold = the prefill step (it also makes the first token). Purple = decode steps. Red = a slot that does no work.</text><text x="30" y="736" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#100D12">Step number on top. Under continuous batching a finished request leaves at once and a waiting one joins.</text></svg>