<text x="640" y="651.0" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" fill="#2D6A4F" text-anchor="middle">Both sets are declared once in the handshake and stored in the session for every later message.</text>
<text x="640" y="712.0" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" fill="#100D12" text-anchor="middle">ping needs no capability. An empty object {} means supported (for elicitation: form mode only).</text></svg>
