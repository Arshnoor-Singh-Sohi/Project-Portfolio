<rect x="30" y="75" width="600" height="78" rx="12" fill="#1E6091" fill-opacity="0.1" stroke="#1E6091" stroke-width="2.5"/>
<text x="330" y="107.0" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" fill="#1E6091" text-anchor="middle">The client declares</text>
<text x="330" y="138.0" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="normal" fill="#1E6091" text-anchor="middle">so the server may send</text>
