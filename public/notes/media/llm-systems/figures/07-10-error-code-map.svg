<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 780" width="1280" height="780" font-family="Helvetica, Arial, sans-serif">
<defs>
</defs>
<rect x="0" y="0" width="1280" height="780" fill="#FFFFFF"/>
<text x="640.0" y="46" font-size="28" fill="#100D12" font-weight="bold" text-anchor="middle" font-style="normal">Where every MCP error code lives (revision 2026-07-28)</text>
<text x="60" y="100" font-size="22" fill="#100D12" font-weight="bold" text-anchor="start" font-style="normal">JSON-RPC 2.0 standard codes (used by MCP for general protocol failures)</text>
<rect x="60" y="118" width="222" height="92" rx="10" fill="#FFFFFF" fill-opacity="1.0" stroke="#100D12" stroke-width="2.5"/>
<text x="171.0" y="150" font-size="24" fill="#100D12" font-weight="bold" text-anchor="middle" font-style="normal">-32700</text>
<text x="171.0" y="177" font-size="20" fill="#100D12" font-weight="normal" text-anchor="middle" font-style="normal">Parse error</text>
<rect x="294" y="118" width="222" height="92" rx="10" fill="#FFFFFF" fill-opacity="1.0" stroke="#100D12" stroke-width="2.5"/>
<text x="405.0" y="150" font-size="24" fill="#100D12" font-weight="bold" text-anchor="middle" font-style="normal">-32600</text>
<text x="405.0" y="177" font-size="20" fill="#100D12" font-weight="normal" text-anchor="middle" font-style="normal">Invalid Request</text>
<rect x="528" y="118" width="222" height="92" rx="10" fill="#FFFFFF" fill-opacity="1.0" stroke="#100D12" stroke-width="2.5"/>
<text x="639.0" y="150" font-size="24" fill="#100D12" font-weight="bold" text-anchor="middle" font-style="normal">-32601</text>
<text x="639.0" y="177" font-size="20" fill="#100D12" font-weight="normal" text-anchor="middle" font-style="normal">Method not found</text>
<rect x="762" y="118" width="222" height="92" rx="10" fill="#FFFFFF" fill-opacity="1.0" stroke="#100D12" stroke-width="2.5"/>
<text x="873.0" y="150" font-size="24" fill="#100D12" font-weight="bold" text-anchor="middle" font-style="normal">-32602</text>
<text x="873.0" y="177" font-size="20" fill="#100D12" font-weight="normal" text-anchor="middle" font-style="normal">Invalid params</text>
<rect x="996" y="118" width="222" height="92" rx="10" fill="#FFFFFF" fill-opacity="1.0" stroke="#100D12" stroke-width="2.5"/>
<text x="1107.0" y="150" font-size="24" fill="#100D12" font-weight="bold" text-anchor="middle" font-style="normal">-32603</text>
<text x="1107.0" y="177" font-size="20" fill="#100D12" font-weight="normal" text-anchor="middle" font-style="normal">Internal error</text>
<text x="60" y="262" font-size="22" fill="#100D12" font-weight="bold" text-anchor="start" font-style="normal">Server-error range -32099 to -32000: implementation-defined in JSON-RPC, split by MCP</text>
<rect x="60" y="280" width="760" height="290" rx="10" fill="#F3EFF8" fill-opacity="1.0" stroke="#6A4C93" stroke-width="2.5"/>
<text x="80" y="314" font-size="21" fill="#6A4C93" font-weight="bold" text-anchor="start" font-style="normal">-32099 to -32020: reserved for the MCP specification</text>
<rect x="80" y="334" width="720" height="52" rx="10" fill="#FFFFFF" fill-opacity="1.0" stroke="#6A4C93" stroke-width="2.5"/>
<text x="100" y="368" font-size="22" fill="#6A4C93" font-weight="bold" text-anchor="start" font-style="normal">-32020</text>
<text x="210" y="368" font-size="21" fill="#100D12" font-weight="normal" text-anchor="start" font-style="normal">HeaderMismatch</text>
<rect x="80" y="396" width="720" height="52" rx="10" fill="#FFFFFF" fill-opacity="1.0" stroke="#6A4C93" stroke-width="2.5"/>
<text x="100" y="430" font-size="22" fill="#6A4C93" font-weight="bold" text-anchor="start" font-style="normal">-32021</text>
<text x="210" y="430" font-size="21" fill="#100D12" font-weight="normal" text-anchor="start" font-style="normal">MissingRequiredClientCapability</text>
<rect x="80" y="458" width="720" height="52" rx="10" fill="#FFFFFF" fill-opacity="1.0" stroke="#6A4C93" stroke-width="2.5"/>
<text x="100" y="492" font-size="22" fill="#6A4C93" font-weight="bold" text-anchor="start" font-style="normal">-32022</text>
<text x="210" y="492" font-size="21" fill="#100D12" font-weight="normal" text-anchor="start" font-style="normal">UnsupportedProtocolVersion</text>
<rect x="80" y="520" width="720" height="48" rx="10" fill="#FFFFFF" fill-opacity="1.0" stroke="#8A8A8A" stroke-width="2.5" stroke-dasharray="8 6"/>
<text x="100" y="552" font-size="22" fill="#8A8A8A" font-weight="bold" text-anchor="start" font-style="normal">-32042</text>
<text x="210" y="552" font-size="20" fill="#8A8A8A" font-weight="normal" text-anchor="start" font-style="normal">URL elicitation required (2025-11-25 only, retired)</text>
<rect x="840" y="280" width="380" height="290" rx="10" fill="#FFFFFF" fill-opacity="1.0" stroke="#100D12" stroke-width="2.5"/>
<text x="860" y="314" font-size="21" fill="#100D12" font-weight="bold" text-anchor="start" font-style="normal">-32019 to -32000: legacy</text>
<text x="860" y="342" font-size="19" fill="#100D12" font-weight="normal" text-anchor="start" font-style="normal">no new codes. The Python SDK uses:</text>
<rect x="860" y="360" width="340" height="52" rx="10" fill="#FFFFFF" fill-opacity="1.0" stroke="#100D12" stroke-width="2.5"/>
<text x="876" y="394" font-size="19" fill="#100D12" font-weight="normal" text-anchor="start" font-style="normal">-32000  connection closed</text>
<rect x="860" y="422" width="340" height="52" rx="10" fill="#FFFFFF" fill-opacity="1.0" stroke="#100D12" stroke-width="2.5"/>
<text x="876" y="456" font-size="19" fill="#100D12" font-weight="normal" text-anchor="start" font-style="normal">-32001  request timeout</text>
<rect x="860" y="484" width="340" height="66" rx="10" fill="#FFFFFF" fill-opacity="1.0" stroke="#C81D25" stroke-width="2.5"/>
<text x="876" y="512" font-size="19" fill="#C81D25" font-weight="normal" text-anchor="start" font-style="normal">-32002  resource not found</text>
<text x="876" y="538" font-size="19" fill="#C81D25" font-weight="normal" text-anchor="start" font-style="normal">until 2025-11-25, now -32602</text>
<rect x="60" y="600" width="760" height="150" rx="10" fill="#FFFFFF" fill-opacity="1.0" stroke="#100D12" stroke-width="2.5"/>
<text x="80" y="636" font-size="21" fill="#100D12" font-weight="bold" text-anchor="start" font-style="normal">Other integers (outside -32768 to -32000)</text>
<text x="80" y="668" font-size="19" fill="#100D12" font-weight="normal" text-anchor="start" font-style="normal">free for application-defined errors</text>
<text x="80" y="692" font-size="19" fill="#100D12" font-weight="normal" text-anchor="start" font-style="normal">(the spec says: SHOULD use this space</text>
<text x="80" y="716" font-size="19" fill="#100D12" font-weight="normal" text-anchor="start" font-style="normal">for codes it does not define)</text>
<rect x="840" y="600" width="380" height="150" rx="10" fill="#EEF4F8" fill-opacity="1.0" stroke="#1E6091" stroke-width="2.5"/>
<text x="860" y="636" font-size="21" fill="#1E6091" font-weight="bold" text-anchor="start" font-style="normal">A failing tool: no error code</text>
<text x="860" y="668" font-size="19" fill="#100D12" font-weight="normal" text-anchor="start" font-style="normal">result with isError: true</text>
<text x="860" y="692" font-size="19" fill="#100D12" font-weight="normal" text-anchor="start" font-style="normal">so the model can read it</text>
<text x="860" y="716" font-size="19" fill="#100D12" font-weight="normal" text-anchor="start" font-style="normal">and correct the call</text>
</svg>