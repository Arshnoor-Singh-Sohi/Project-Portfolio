<line x1="190" y1="172" x2="330" y2="172" stroke="#100D12" stroke-width="2" marker-end="url(#arr100D12)"/>
<text x="260" y="162" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#100D12" font-weight="normal" text-anchor="middle">x W_DKV</text>
