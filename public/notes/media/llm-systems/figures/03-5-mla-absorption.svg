<rect x="40" y="630" width="1200" height="150" rx="10" fill="none" stroke="#8A8A8A" stroke-width="2" stroke-dasharray="8 6"/>
<text x="64" y="670" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#8A8A8A" font-weight="normal" text-anchor="start">Never built at decode: per-head keys c_j W_UK_i and values c_j W_UV_i.</text>
<text x="64" y="705" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#100D12" font-weight="normal" text-anchor="start">DeepSeek-V3, full K and V: 128 heads x (192 + 128) = 40,960 numbers per token per layer.</text>
<text x="64" y="740" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#2D6A4F" font-weight="normal" text-anchor="start">DeepSeek-V3, MLA cache: 512 + 64 = 576 numbers. About 71 times fewer.</text></svg>
