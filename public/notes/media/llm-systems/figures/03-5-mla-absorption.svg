<text x="512.5" y="542.0" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" font-weight="normal" text-anchor="middle">x (W_UV_i W_O_i): output of head i</text>
<text x="40" y="545" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#6A4C93" font-weight="normal" text-anchor="start">W_UV_i and W_O_i merge</text>
