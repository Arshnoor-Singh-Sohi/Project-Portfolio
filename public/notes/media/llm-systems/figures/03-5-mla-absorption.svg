<text x="575" y="272" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#2D6A4F" font-weight="normal" text-anchor="start">per token, per layer</text>
<text x="40" y="345" font-family="Helvetica, Arial, sans-serif" font-size="23" fill="#100D12" font-weight="bold" text-anchor="start">Read path: each decode step, for each query head i</text>
