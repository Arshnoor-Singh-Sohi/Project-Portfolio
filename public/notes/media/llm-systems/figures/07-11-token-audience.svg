<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 700" width="1280" height="700" font-family="Helvetica, Arial, sans-serif">
<defs>
<marker id="arr1E6091" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1E6091"/></marker>
<marker id="arr6A4C93" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6A4C93"/></marker>
<marker id="arrC81D25" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#C81D25"/></marker>
</defs>
<rect x="0" y="0" width="1280" height="700" fill="#FFFFFF"/>
<text x="640.0" y="46" font-size="28" fill="#100D12" font-weight="bold" text-anchor="middle" font-style="normal">Two tokens, two audiences: no token passthrough</text>
<text x="640" y="100" font-size="22" fill="#100D12" font-weight="bold" text-anchor="middle" font-style="normal">Correct: the MCP server is a resource server AND a separate OAuth client</text>
<rect x="40" y="130" width="210" height="110" rx="10" fill="#FFFFFF" fill-opacity="1.0" stroke="#1E6091" stroke-width="2.5"/>
<text x="145.0" y="162" font-size="22" fill="#1E6091" font-weight="bold" text-anchor="middle" font-style="normal">MCP client</text>
<text x="145.0" y="189" font-size="20" fill="#100D12" font-weight="normal" text-anchor="middle" font-style="normal">token A</text>
<rect x="500" y="130" width="280" height="110" rx="10" fill="#FFFFFF" fill-opacity="1.0" stroke="#6A4C93" stroke-width="2.5"/>
<text x="640.0" y="162" font-size="22" fill="#6A4C93" font-weight="bold" text-anchor="middle" font-style="normal">MCP server</text>
<text x="640.0" y="189" font-size="20" fill="#100D12" font-weight="normal" text-anchor="middle" font-style="normal">checks: aud of A = me</text>
<rect x="1030" y="130" width="210" height="110" rx="10" fill="#FFFFFF" fill-opacity="1.0" stroke="#B8860B" stroke-width="2.5"/>
<text x="1135.0" y="162" font-size="22" fill="#B8860B" font-weight="bold" text-anchor="middle" font-style="normal">Upstream API</text>
<text x="1135.0" y="189" font-size="20" fill="#100D12" font-weight="normal" text-anchor="middle" font-style="normal">needs token B</text>
<line x1="250" y1="185" x2="496" y2="185" stroke="#1E6091" stroke-width="2.5" marker-end="url(#arr1E6091)"/>
<text x="375" y="172" font-size="19" fill="#100D12" font-weight="normal" text-anchor="middle" font-style="normal">Bearer A (aud = MCP)</text>
<line x1="780" y1="185" x2="1026" y2="185" stroke="#6A4C93" stroke-width="2.5" marker-end="url(#arr6A4C93)"/>
<text x="905" y="172" font-size="19" fill="#100D12" font-weight="normal" text-anchor="middle" font-style="normal">Bearer B (aud = API)</text>
<text x="500" y="290" font-size="19" fill="#100D12" font-weight="normal" text-anchor="start" font-style="normal">The upstream authorization server issues token B</text>
<text x="500" y="314" font-size="19" fill="#100D12" font-weight="normal" text-anchor="start" font-style="normal">to the MCP server, for example in its own OAuth flow.</text>
<text x="500" y="338" font-size="19" fill="#100D12" font-weight="normal" text-anchor="start" font-style="normal">Audit logs and rate limits stay correct.</text>
<line x1="40" y1="400" x2="1240" y2="400" stroke="#8A8A8A" stroke-width="2.5" stroke-dasharray="8 6"/>
<text x="640" y="450" font-size="22" fill="#C81D25" font-weight="bold" text-anchor="middle" font-style="normal">Forbidden: token passthrough</text>
<rect x="40" y="480" width="210" height="110" rx="10" fill="#FFFFFF" fill-opacity="1.0" stroke="#1E6091" stroke-width="2.5"/>
<text x="145.0" y="512" font-size="22" fill="#1E6091" font-weight="bold" text-anchor="middle" font-style="normal">MCP client</text>
<text x="145.0" y="539" font-size="20" fill="#100D12" font-weight="normal" text-anchor="middle" font-style="normal">token for API</text>
<rect x="500" y="480" width="280" height="110" rx="10" fill="#FFFFFF" fill-opacity="1.0" stroke="#C81D25" stroke-width="2.5"/>
<text x="640.0" y="512" font-size="22" fill="#C81D25" font-weight="bold" text-anchor="middle" font-style="normal">MCP server</text>
<text x="640.0" y="539" font-size="20" fill="#100D12" font-weight="normal" text-anchor="middle" font-style="normal">no audience check</text>
<rect x="1030" y="480" width="210" height="110" rx="10" fill="#FFFFFF" fill-opacity="1.0" stroke="#B8860B" stroke-width="2.5"/>
<text x="1135.0" y="512" font-size="22" fill="#B8860B" font-weight="bold" text-anchor="middle" font-style="normal">Upstream API</text>
<text x="1135.0" y="539" font-size="20" fill="#100D12" font-weight="normal" text-anchor="middle" font-style="normal">trusts the token</text>
<line x1="250" y1="535" x2="496" y2="535" stroke="#C81D25" stroke-width="2.5" marker-end="url(#arrC81D25)"/>
<text x="375" y="522" font-size="19" fill="#C81D25" font-weight="normal" text-anchor="middle" font-style="normal">Bearer (aud = API)</text>
<line x1="780" y1="535" x2="1026" y2="535" stroke="#C81D25" stroke-width="2.5" marker-end="url(#arrC81D25)"/>
<text x="905" y="522" font-size="19" fill="#C81D25" font-weight="normal" text-anchor="middle" font-style="normal">same token, forwarded</text>
<text x="640" y="650" font-size="21" fill="#C81D25" font-weight="normal" text-anchor="middle" font-style="normal">Spec: MCP servers MUST NOT accept or transit any other tokens.</text>
</svg>