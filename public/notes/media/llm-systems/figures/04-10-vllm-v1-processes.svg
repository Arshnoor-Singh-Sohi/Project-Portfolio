<rect x="340" y="75" width="900" height="150" rx="12" fill="none" fill-opacity="1.0" stroke="#6A4C93" stroke-width="3"/>
<text x="360" y="108" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#6A4C93" font-weight="bold" text-anchor="start">API server process (port 8000 by default)</text>
<text x="360" y="142" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" font-weight="normal" text-anchor="start">OpenAI-compatible routes: /v1/chat/completions, /v1/completions, /v1/models, ...</text>
<text x="360" y="172" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" font-weight="normal" text-anchor="start">also /v1/messages, /health, /metrics. Tokenization, multimodal input,</text>
<text x="360" y="202" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" font-weight="normal" text-anchor="start">detokenization and streaming of output tokens.</text>
<line x1="790" y1="225" x2="790" y2="290" stroke="#100D12" stroke-width="2" marker-end="url(#arr100D12)"/>
<line x1="830" y1="290" x2="830" y2="225" stroke="#100D12" stroke-width="2" marker-end="url(#arr100D12)"/>
<text x="850" y="265" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#100D12" font-weight="normal" text-anchor="start">ZMQ sockets: requests down, outputs up</text>
<rect x="340" y="290" width="900" height="170" rx="12" fill="none" fill-opacity="1.0" stroke="#B8860B" stroke-width="3"/>
<text x="360" y="323" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#B8860B" font-weight="bold" text-anchor="start">Engine core process (one per data-parallel rank)</text>
<text x="360" y="357" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" font-weight="normal" text-anchor="start">Scheduler loop: token budget per step, continuous batching, chunked prefill,</text>
<text x="360" y="387" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" font-weight="normal" text-anchor="start">preemption, speculative tokens.</text>
<rect x="360" y="400" width="860" height="46" rx="8" fill="none" fill-opacity="1.0" stroke="#2D6A4F" stroke-width="3"/>
<text x="790.0" y="430.0" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#2D6A4F" font-weight="normal" text-anchor="middle">KV cache manager: block pool, prefix cache (hash → block), free queue</text>
