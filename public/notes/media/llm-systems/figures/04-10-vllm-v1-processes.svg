<text x="40" y="760" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" font-weight="normal" text-anchor="start">Process count = A + DP + N (+1 coordinator if DP &gt; 1), with A API servers and N = DP × PP × TP workers.</text>
<text x="40" y="790" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" font-weight="normal" text-anchor="start">Here: 1 API server + 1 engine core + 4 workers = 6 processes (vLLM architecture overview).</text></svg>
