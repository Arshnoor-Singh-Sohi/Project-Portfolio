<text x="640.0" y="44" font-family="Helvetica, Arial, sans-serif" font-size="28" fill="#100D12" font-weight="bold" text-anchor="middle">vLLM V1 processes for vllm serve with TP = 4 (6 processes)</text>
<rect x="40" y="90" width="230" height="90" rx="8" fill="none" fill-opacity="1.0" stroke="#1E6091" stroke-width="3"/>
<text x="155.0" y="129.75" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#1E6091" font-weight="normal" text-anchor="middle">clients</text>
<text x="155.0" y="154.95" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#1E6091" font-weight="normal" text-anchor="middle">HTTP + SSE</text>
