<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="850" viewBox="0 0 1280 850" font-family="Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="1280" height="850" fill="#FFFFFF"/>
<text x="640.0" y="46" font-size="30" fill="#100D12" font-weight="bold" text-anchor="middle">The 45-minute mock interview</text>
<text x="640.0" y="80" font-size="20" fill="#100D12" font-weight="normal" text-anchor="middle">Bar length and label = minutes. Right column = the deepest level to reach (1 definition ... 5 production).</text>
<line x1="400.0" y1="120" x2="400.0" y2="704" stroke="#D0D0D0" stroke-width="1"/>
<text x="400.0" y="734" font-size="20" fill="#100D12" font-weight="normal" text-anchor="middle">0</text>
<line x1="481.1" y1="120" x2="481.1" y2="704" stroke="#D0D0D0" stroke-width="1"/>
<text x="481.1111111111111" y="734" font-size="20" fill="#100D12" font-weight="normal" text-anchor="middle">5</text>
<line x1="562.2" y1="120" x2="562.2" y2="704" stroke="#D0D0D0" stroke-width="1"/>
<text x="562.2222222222222" y="734" font-size="20" fill="#100D12" font-weight="normal" text-anchor="middle">10</text>
<line x1="643.3" y1="120" x2="643.3" y2="704" stroke="#D0D0D0" stroke-width="1"/>
<text x="643.3333333333334" y="734" font-size="20" fill="#100D12" font-weight="normal" text-anchor="middle">15</text>
<line x1="724.4" y1="120" x2="724.4" y2="704" stroke="#D0D0D0" stroke-width="1"/>
<text x="724.4444444444445" y="734" font-size="20" fill="#100D12" font-weight="normal" text-anchor="middle">20</text>
<line x1="805.6" y1="120" x2="805.6" y2="704" stroke="#D0D0D0" stroke-width="1"/>
<text x="805.5555555555555" y="734" font-size="20" fill="#100D12" font-weight="normal" text-anchor="middle">25</text>
<line x1="886.7" y1="120" x2="886.7" y2="704" stroke="#D0D0D0" stroke-width="1"/>
<text x="886.6666666666667" y="734" font-size="20" fill="#100D12" font-weight="normal" text-anchor="middle">30</text>
<line x1="967.8" y1="120" x2="967.8" y2="704" stroke="#D0D0D0" stroke-width="1"/>
<text x="967.7777777777778" y="734" font-size="20" fill="#100D12" font-weight="normal" text-anchor="middle">35</text>
<line x1="1048.9" y1="120" x2="1048.9" y2="704" stroke="#D0D0D0" stroke-width="1"/>
<text x="1048.888888888889" y="734" font-size="20" fill="#100D12" font-weight="normal" text-anchor="middle">40</text>
<line x1="1130.0" y1="120" x2="1130.0" y2="704" stroke="#D0D0D0" stroke-width="1"/>
<text x="1130.0" y="734" font-size="20" fill="#100D12" font-weight="normal" text-anchor="middle">45</text>
<text x="765.0" y="768" font-size="20" fill="#100D12" font-weight="normal" text-anchor="middle">minutes</text>
<text x="1205" y="110" font-size="20" fill="#100D12" font-weight="bold" text-anchor="middle">level</text>
<text x="24" y="166" font-size="22" fill="#100D12" font-weight="bold" text-anchor="start">A. Opening</text>
<text x="24" y="194" font-size="19" fill="#4A4A4A" font-weight="normal" text-anchor="start">30 s about you, bridge to the paper</text>
<rect x="400.0" y="150" width="48.7" height="50" rx="6" fill="#FFFFFF" stroke="#8A8A8A" stroke-width="2.5" stroke-dasharray="7 5"/>
<text x="424.33333333333337" y="182" font-size="19" fill="#100D12" font-weight="normal" text-anchor="middle">0-3</text>
<circle cx="1205" cy="175" r="24" fill="#FFFFFF" stroke="#8A8A8A" stroke-width="3"/>
<text x="1205" y="183" font-size="22" fill="#100D12" font-weight="bold" text-anchor="middle">1</text>
<text x="24" y="248" font-size="22" fill="#100D12" font-weight="bold" text-anchor="start">B. The paper</text>
<text x="24" y="276" font-size="19" fill="#4A4A4A" font-weight="normal" text-anchor="start">2-minute pitch, 3 follow-ups</text>
<rect x="448.7" y="232" width="81.1" height="50" rx="6" fill="#100D12"/>
<text x="489.2222222222223" y="264" font-size="20" fill="#FFFFFF" font-weight="bold" text-anchor="middle">3-8</text>
<circle cx="1205" cy="257" r="24" fill="#FFFFFF" stroke="#100D12" stroke-width="3"/>
<text x="1205" y="265" font-size="22" fill="#100D12" font-weight="bold" text-anchor="middle">3</text>
<text x="24" y="330" font-size="22" fill="#100D12" font-weight="bold" text-anchor="start">C. KV cache and attention</text>
<text x="24" y="358" font-size="19" fill="#4A4A4A" font-weight="normal" text-anchor="start">formula, sizing, implementation</text>
<rect x="529.8" y="314" width="194.7" height="50" rx="6" fill="#2D6A4F"/>
<text x="627.1111111111111" y="346" font-size="20" fill="#FFFFFF" font-weight="bold" text-anchor="middle">8-20</text>
<circle cx="1205" cy="339" r="24" fill="#FFFFFF" stroke="#2D6A4F" stroke-width="3"/>
<text x="1205" y="347" font-size="22" fill="#100D12" font-weight="bold" text-anchor="middle">5</text>
<text x="24" y="412" font-size="22" fill="#100D12" font-weight="bold" text-anchor="start">D. Inference and cloud</text>
<text x="24" y="440" font-size="19" fill="#4A4A4A" font-weight="normal" text-anchor="start">metrics, 70B on GPUs, cost</text>
<rect x="724.4" y="396" width="129.8" height="50" rx="6" fill="#B8860B"/>
<text x="789.3333333333333" y="428" font-size="20" fill="#FFFFFF" font-weight="bold" text-anchor="middle">20-28</text>
<circle cx="1205" cy="421" r="24" fill="#FFFFFF" stroke="#B8860B" stroke-width="3"/>
<text x="1205" y="429" font-size="22" fill="#100D12" font-weight="bold" text-anchor="middle">4</text>
<text x="24" y="494" font-size="22" fill="#100D12" font-weight="bold" text-anchor="start">E. RAG</text>
<text x="24" y="522" font-size="19" fill="#4A4A4A" font-weight="normal" text-anchor="start">permissions, hybrid search, evaluation</text>
<rect x="854.2" y="478" width="97.3" height="50" rx="6" fill="#6A4C93"/>
<text x="902.8888888888889" y="510" font-size="20" fill="#FFFFFF" font-weight="bold" text-anchor="middle">28-34</text>
<circle cx="1205" cy="503" r="24" fill="#FFFFFF" stroke="#6A4C93" stroke-width="3"/>
<text x="1205" y="511" font-size="22" fill="#100D12" font-weight="bold" text-anchor="middle">4</text>
<text x="24" y="576" font-size="22" fill="#100D12" font-weight="bold" text-anchor="start">F. MCP</text>
<text x="24" y="604" font-size="19" fill="#4A4A4A" font-weight="normal" text-anchor="start">what's new, stateless, argument schema</text>
<rect x="951.6" y="560" width="129.8" height="50" rx="6" fill="#1E6091"/>
<text x="1016.4444444444446" y="592" font-size="20" fill="#FFFFFF" font-weight="bold" text-anchor="middle">34-42</text>
<circle cx="1205" cy="585" r="24" fill="#FFFFFF" stroke="#1E6091" stroke-width="3"/>
<text x="1205" y="593" font-size="22" fill="#100D12" font-weight="bold" text-anchor="middle">5</text>
<text x="24" y="658" font-size="22" fill="#100D12" font-weight="bold" text-anchor="start">G. Your questions</text>
<text x="24" y="686" font-size="19" fill="#4A4A4A" font-weight="normal" text-anchor="start">close and score</text>
<rect x="1081.3" y="642" width="48.7" height="50" rx="6" fill="#FFFFFF" stroke="#8A8A8A" stroke-width="2.5" stroke-dasharray="7 5"/>
<text x="1071.3333333333335" y="674" font-size="19" fill="#100D12" font-weight="normal" text-anchor="end">42-45</text>
<circle cx="1205" cy="667" r="24" fill="#FFFFFF" stroke="#8A8A8A" stroke-width="3"/>
<text x="1205" y="675" font-size="22" fill="#100D12" font-weight="bold" text-anchor="middle">-</text>
<text x="24" y="828" font-size="20" fill="#100D12">Parts C and F get the most time: the friend's interviewer went deepest on the KV cache and on MCP.</text>
</svg>