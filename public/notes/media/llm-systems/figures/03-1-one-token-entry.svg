<text x="985" y="157" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#2D6A4F" text-anchor="middle" font-weight="bold">One KV head (h8) in layer 1</text>
<rect x="752" y="180" width="466" height="72" rx="6" fill="#B8860B" fill-opacity="0.15" stroke="#B8860B" stroke-width="2"/>
<text x="772" y="210" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#B8860B" text-anchor="start" font-weight="bold">key vector (after RoPE)</text>
<text x="772" y="239" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" text-anchor="start" font-weight="normal">128 numbers x 2 bytes = 256 bytes</text>
<rect x="752" y="272" width="466" height="72" rx="6" fill="#6A4C93" fill-opacity="0.15" stroke="#6A4C93" stroke-width="2"/>
<text x="772" y="302" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#6A4C93" text-anchor="start" font-weight="bold">value vector</text>
<text x="772" y="331" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" text-anchor="start" font-weight="normal">128 numbers x 2 bytes = 256 bytes</text>
<text x="772" y="392" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1E6091" text-anchor="start" font-weight="normal">No query is stored: only the newest</text>
<text x="772" y="420" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1E6091" text-anchor="start" font-weight="normal">query is ever used again.</text>
<rect x="60" y="480" width="1180" height="180" rx="6" fill="#FFFFFF" stroke="#100D12" stroke-width="2"/>
<text x="650" y="520" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#100D12" text-anchor="middle" font-weight="normal">Per token: 32 layers x 8 KV heads x 2 vectors x 128 numbers = 65,536 numbers</text>
<text x="650" y="560" font-family="Helvetica, Arial, sans-serif" font-size="23" fill="#2D6A4F" text-anchor="middle" font-weight="bold">In BF16 (2 bytes each): 131,072 bytes = 128 KiB per token</text>
<text x="650" y="600" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#100D12" text-anchor="middle" font-weight="normal">8,192 tokens = 1 GiB, and 131,072 tokens = 16 GiB</text>
<text x="650" y="638" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" text-anchor="middle" font-weight="normal">Tensors per layer: keys [B, 8, T, 128] and values [B, 8, T, 128]</text>
