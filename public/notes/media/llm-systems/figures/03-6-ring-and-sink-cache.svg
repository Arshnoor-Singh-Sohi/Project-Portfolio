<text x="640.0" y="46" font-family="Helvetica, Arial, sans-serif" font-size="28" fill="#100D12" font-weight="bold" text-anchor="middle">Two bounded caches: a ring buffer and an attention-sink cache</text>
<text x="40" y="110" font-family="Helvetica, Arial, sans-serif" font-size="23" fill="#100D12" font-weight="bold" text-anchor="start">Sliding window, W = 4: token p goes to slot p mod 4</text>
<text x="40" y="145" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#8A8A8A" font-weight="normal" text-anchor="start">State after token 9 (tokens 0 to 5 were overwritten):</text>
