<text x="965.0" y="536" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1E6091" font-weight="normal" text-anchor="middle">pos 7</text>
<text x="60" y="590" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#2D6A4F" font-weight="bold" text-anchor="start">Sinks: tokens 0 to 3</text>
<text x="60" y="630" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" font-weight="normal" text-anchor="start">Positions are given inside the cache (0 to 7), not in the original text (0 to 9).</text>
<text x="60" y="664" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#B8860B" font-weight="normal" text-anchor="start">So the keys are cached BEFORE RoPE and rotated again at every step.</text>
<text x="60" y="698" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" font-weight="normal" text-anchor="start">The paper's example: cache [0, 1, 2, 3, 6, 7, 8], new token gets positions 0 to 7.</text></svg>
