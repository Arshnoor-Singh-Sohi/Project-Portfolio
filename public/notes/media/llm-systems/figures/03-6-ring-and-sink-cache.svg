<text x="305.0" y="226" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#8A8A8A" font-weight="normal" text-anchor="middle">slot 2</text>
<rect x="360" y="165" width="90" height="76" rx="6" fill="#D8EBE2" stroke="#2D6A4F" stroke-width="2"/>
<text x="405.0" y="197" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" font-weight="normal" text-anchor="middle">token 7</text>
<text x="405.0" y="226" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#8A8A8A" font-weight="normal" text-anchor="middle">slot 3</text>
<line x1="305" y1="300" x2="305" y2="246" stroke="#1E6091" stroke-width="3" marker-end="url(#arr1E6091)"/>
<text x="200" y="325" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1E6091" font-weight="normal" text-anchor="start">token 10 overwrites slot 2 (token 6)</text>
<text x="560" y="195" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" font-weight="normal" text-anchor="start">Memory per layer stays at W tokens.</text>
<text x="560" y="225" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" font-weight="normal" text-anchor="start">Order in memory does not matter:</text>
<text x="560" y="255" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" font-weight="normal" text-anchor="start">softmax treats the keys as a set.</text>
<text x="560" y="285" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#B8860B" font-weight="normal" text-anchor="start">Keys keep their RoPE at their true positions.</text>
<line x1="40" y1="360" x2="1240" y2="360" stroke="#8A8A8A" stroke-width="1" stroke-dasharray="8 6"/>
<text x="40" y="410" font-family="Helvetica, Arial, sans-serif" font-size="23" fill="#100D12" font-weight="bold" text-anchor="start">StreamingLLM: 4 sink tokens + recent tokens, when token 9 arrives</text>
