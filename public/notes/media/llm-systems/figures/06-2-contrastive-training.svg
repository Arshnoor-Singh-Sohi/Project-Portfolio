<text x="40" y="670" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#100D12" font-weight="bold" text-anchor="start">L_i = −log( exp(S_ii / τ) / Σ_j exp(S_ij / τ) )</text>
