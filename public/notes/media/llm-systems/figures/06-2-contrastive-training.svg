<text x="690" y="560" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" font-weight="normal" text-anchor="start">Softmax of each row of S / τ, τ = 0.05. Loss = −log p(positive):</text>
<text x="690" y="592" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#2D6A4F" font-weight="normal" text-anchor="start">q1: p = 0.9999, loss 0.0001</text>
<text x="690" y="622" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#2D6A4F" font-weight="normal" text-anchor="start">q2: p = 0.9974, loss 0.0026</text>
<text x="690" y="652" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#C81D25" font-weight="normal" text-anchor="start">q3: p = 0.731,  loss 0.3133  (hard negative 0.55)</text>
<text x="690" y="690" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#100D12" font-weight="bold" text-anchor="start">Mean InfoNCE loss = 0.1053</text>
<text x="40" y="600" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" font-weight="normal" text-anchor="start">Each query gets B − 1 = 2 negatives for free:</text>
