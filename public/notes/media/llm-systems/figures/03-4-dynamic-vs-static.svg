<text x="640.0" y="46" font-family="Helvetica, Arial, sans-serif" font-size="28" fill="#100D12" font-weight="bold" text-anchor="middle">Two ways to grow a cache: concatenate or write at a slot</text>
<text x="40" y="110" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#100D12" font-weight="bold" text-anchor="start">Dynamic cache: torch.cat on every decode step</text>
<rect x="40" y="150" width="88" height="56" rx="6" fill="#F0F0F0" stroke="#8A8A8A" stroke-width="2" stroke-dasharray="8 6"/>
<text x="84.0" y="186" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#8A8A8A" font-weight="normal" text-anchor="middle">the</text>
<rect x="136" y="150" width="88" height="56" rx="6" fill="#F0F0F0" stroke="#8A8A8A" stroke-width="2" stroke-dasharray="8 6"/>
<text x="180.0" y="186" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#8A8A8A" font-weight="normal" text-anchor="middle">cat</text>
<rect x="232" y="150" width="88" height="56" rx="6" fill="#F0F0F0" stroke="#8A8A8A" stroke-width="2" stroke-dasharray="8 6"/>
<text x="276.0" y="186" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#8A8A8A" font-weight="normal" text-anchor="middle">sat</text>
<text x="40" y="240" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#8A8A8A" font-weight="normal" text-anchor="start">old tensor: 3 slots, then freed</text>
<line x1="338" y1="178.0" x2="438" y2="178.0" stroke="#C81D25" stroke-width="3" marker-end="url(#arrC81D25)"/>
<text x="388" y="138" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#C81D25" font-weight="normal" text-anchor="middle">copy 3 rows</text>
<rect x="458" y="150" width="88" height="56" rx="6" fill="#F7D9DB" stroke="#C81D25" stroke-width="2"/>
<text x="502.0" y="186" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" font-weight="normal" text-anchor="middle">the</text>
<rect x="554" y="150" width="88" height="56" rx="6" fill="#F7D9DB" stroke="#C81D25" stroke-width="2"/>
<text x="598.0" y="186" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" font-weight="normal" text-anchor="middle">cat</text>
<rect x="650" y="150" width="88" height="56" rx="6" fill="#F7D9DB" stroke="#C81D25" stroke-width="2"/>
<text x="694.0" y="186" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" font-weight="normal" text-anchor="middle">sat</text>
<rect x="746" y="150" width="88" height="56" rx="6" fill="#DCE8F2" stroke="#1E6091" stroke-width="4"/>
<text x="790.0" y="186" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" font-weight="bold" text-anchor="middle">down</text>
<text x="458" y="240" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" font-weight="normal" text-anchor="start">new tensor: 4 slots (3 copied + 1 new)</text>
<text x="900" y="160" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" font-weight="normal" text-anchor="start">Every step: allocate T + 1 slots,</text>
<text x="900" y="190" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" font-weight="normal" text-anchor="start">copy T slots, free the old tensor.</text>
<text x="900" y="220" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" font-weight="normal" text-anchor="start">The shape changes every step.</text>
<text x="900" y="250" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#C81D25" font-weight="normal" text-anchor="start">Copy cost grows with T.</text>
<line x1="40" y1="330" x2="1240" y2="330" stroke="#8A8A8A" stroke-width="1" stroke-dasharray="8 6"/>
<text x="40" y="385" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#100D12" font-weight="bold" text-anchor="start">Static cache: allocate T_max slots once, write at slot n</text>
