<text x="396" y="453" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1E6091" font-weight="normal" text-anchor="start">write at n = 3, then n = 4</text>
<text x="40" y="620" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#8A8A8A" font-weight="normal" text-anchor="start">Slots 4 to 7: reserved memory, hidden by the mask</text>
<text x="40" y="680" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#100D12" font-weight="normal" text-anchor="start">Same shape every step: works with torch.compile and CUDA graphs.</text>
<text x="40" y="712" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#100D12" font-weight="normal" text-anchor="start">The in-place write copies only the new slot.</text>
<text x="40" y="744" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#C81D25" font-weight="normal" text-anchor="start">Cost: memory for T_max is reserved even for a short answer.</text></svg>
