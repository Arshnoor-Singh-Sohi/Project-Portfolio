<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760">
<rect x="0" y="0" width="1280" height="760" fill="#FFFFFF"/>
<defs><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E6091"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B8860B"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6A4C93"/></marker><marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2D6A4F"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C81D25"/></marker><marker id="agy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A8A8A"/></marker><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#100D12"/></marker></defs>
<text x="640.0" y="46" font-family="Helvetica, Arial, sans-serif" font-size="28" fill="#100D12" font-weight="bold" text-anchor="middle">The autoscaling loop for vLLM replicas</text>
<rect x="30" y="110" width="170" height="90" rx="10" fill="#FFFFFF" stroke="#1E6091" stroke-width="3"/>
<text x="115" y="148" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#1E6091" font-weight="normal" text-anchor="middle">Users</text>
<text x="115" y="175" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#1E6091" font-weight="normal" text-anchor="middle">12 req/s</text>
<line x1="200" y1="155" x2="255" y2="155" stroke="#1E6091" stroke-width="3" marker-end="url(#ab)"/>
<rect x="258" y="110" width="190" height="90" rx="10" fill="#FFFFFF" stroke="#100D12" stroke-width="2"/>
<text x="353" y="148" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#100D12" font-weight="normal" text-anchor="middle">Gateway</text>
<text x="353" y="175" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#100D12" font-weight="normal" text-anchor="middle">and router</text>
<line x1="448" y1="140" x2="520" y2="140" stroke="#1E6091" stroke-width="3" marker-end="url(#ab)"/>
<line x1="448" y1="175" x2="520" y2="250" stroke="#1E6091" stroke-width="3" marker-end="url(#ab)"/>
<rect x="522" y="95" width="300" height="100" rx="10" fill="#FFFFFF" stroke="#B8860B" stroke-width="3"/>
<text x="540" y="127" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#100D12" font-weight="bold" text-anchor="start">Pod 1: Ready (1 GPU)</text>
<text x="540" y="157" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#C81D25" font-weight="normal" text-anchor="start">waiting 13</text>
<text x="680" y="157" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" font-weight="normal" text-anchor="start">running 64</text>
<text x="540" y="183" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#2D6A4F" font-weight="normal" text-anchor="start">KV cache usage 0.92</text>
<rect x="522" y="210" width="300" height="100" rx="10" fill="#FFFFFF" stroke="#B8860B" stroke-width="3"/>
<text x="540" y="242" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#100D12" font-weight="bold" text-anchor="start">Pod 2: Ready (1 GPU)</text>
<text x="540" y="272" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#C81D25" font-weight="normal" text-anchor="start">waiting 13</text>
<text x="680" y="272" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" font-weight="normal" text-anchor="start">running 64</text>
<text x="540" y="298" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#2D6A4F" font-weight="normal" text-anchor="start">KV cache usage 0.92</text>
<rect x="522" y="330" width="300" height="112" rx="10" fill="#FFFFFF" stroke="#8A8A8A" stroke-width="2" stroke-dasharray="9 7"/>
<text x="540" y="362" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#8A8A8A" font-weight="bold" text-anchor="start">Pods 3 to 6: not Ready</text>
<text x="540" y="392" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#8A8A8A" font-weight="normal" text-anchor="start">cold start: GPU node, image,</text>
<text x="540" y="418" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#8A8A8A" font-weight="normal" text-anchor="start">weights, warm-up (minutes)</text>
<rect x="900" y="95" width="350" height="92" rx="10" fill="#FFFFFF" stroke="#100D12" stroke-width="2"/>
<text x="915" y="128" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" font-weight="normal" text-anchor="start">Prometheus scrapes /metrics</text>
<text x="915" y="154" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" font-weight="normal" text-anchor="start">default every 1 min, often 15 s</text>
<rect x="900" y="222" width="350" height="92" rx="10" fill="#FFFFFF" stroke="#100D12" stroke-width="2"/>
<text x="915" y="255" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" font-weight="normal" text-anchor="start">KEDA queries Prometheus</text>
<text x="915" y="281" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" font-weight="normal" text-anchor="start">sum(waiting) = 26, every 30 s</text>
<rect x="900" y="349" width="350" height="120" rx="10" fill="#FFFFFF" stroke="#100D12" stroke-width="2"/>
<text x="915" y="382" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" font-weight="normal" text-anchor="start">HPA, every 15 s:</text>
<text x="915" y="408" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" font-weight="normal" text-anchor="start">desired = ceil(26 / 5) = 6</text>
<text x="915" y="434" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" font-weight="normal" text-anchor="start">allowed: max(+100%, +4 pods)</text>
<line x1="822" y1="140" x2="897" y2="140" stroke="#100D12" stroke-width="3" marker-end="url(#ak)"/>
<line x1="1075" y1="187" x2="1075" y2="219" stroke="#100D12" stroke-width="3" marker-end="url(#ak)"/>
<line x1="1075" y1="314" x2="1075" y2="346" stroke="#100D12" stroke-width="3" marker-end="url(#ak)"/>
<rect x="900" y="505" width="350" height="70" rx="10" fill="#FFFFFF" stroke="#100D12" stroke-width="2"/>
<text x="915" y="548" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#100D12" font-weight="normal" text-anchor="start">Deployment: replicas 2 to 6</text>
<line x1="1075" y1="469" x2="1075" y2="502" stroke="#100D12" stroke-width="3" marker-end="url(#ak)"/>
<path d="M 900 540 L 672 540 L 672 446" fill="none" stroke="#100D12" stroke-width="3" marker-end="url(#ak)"/>
<text x="690" y="530" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#100D12" font-weight="normal" text-anchor="start">creates pods</text>
<text x="30" y="625" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#100D12" font-weight="bold" text-anchor="start">Delay chain from a growing queue to a new Ready replica:</text>
<rect x="30" y="645" width="84" height="50" rx="6" fill="#FFFFFF" stroke="#100D12" stroke-width="2"/>
<text x="72.0" y="677" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#100D12" font-weight="normal" text-anchor="middle">scrape</text>
<rect x="120" y="645" width="74" height="50" rx="6" fill="#FFFFFF" stroke="#100D12" stroke-width="2"/>
<text x="157.0" y="677" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#100D12" font-weight="normal" text-anchor="middle">poll</text>
<rect x="200" y="645" width="64" height="50" rx="6" fill="#FFFFFF" stroke="#100D12" stroke-width="2"/>
<text x="232.0" y="677" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#100D12" font-weight="normal" text-anchor="middle">HPA</text>
<rect x="270" y="645" width="294" height="50" rx="6" fill="#FFFFFF" stroke="#8A8A8A" stroke-width="2" stroke-dasharray="8 6"/>
<text x="417.0" y="677" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#8A8A8A" font-weight="normal" text-anchor="middle">GPU node</text>
<rect x="570" y="645" width="554" height="50" rx="6" fill="#FFFFFF" stroke="#8A8A8A" stroke-width="2" stroke-dasharray="8 6"/>
<text x="847.0" y="677" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#8A8A8A" font-weight="normal" text-anchor="middle">image + weights + warm-up</text>
<rect x="1130" y="645" width="84" height="50" rx="6" fill="#FFFFFF" stroke="#B8860B" stroke-width="2"/>
<text x="1172.0" y="677" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#100D12" font-weight="normal" text-anchor="middle">Ready</text>
<text x="30" y="728" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#100D12" font-weight="normal" text-anchor="start">seconds</text>
<text x="270" y="728" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#C81D25" font-weight="normal" text-anchor="start">minutes, and a GPU may not be free</text>
<text x="820" y="728" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#C81D25" font-weight="normal" text-anchor="start">the queue keeps growing during this time</text>
</svg>
