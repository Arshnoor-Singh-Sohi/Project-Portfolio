<text x="470.0" y="272.0" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#B8860B" font-weight="normal" text-anchor="middle">encoder (offline,</text>
<text x="470.0" y="297.0" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#B8860B" font-weight="normal" text-anchor="middle">once per chunk)</text>
<text x="470.0" y="322.0" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#B8860B" font-weight="normal" text-anchor="middle">tokens → H [T, d]</text>
