<text x="955.0" y="172.0" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" font-weight="normal" text-anchor="middle">[CLS] query [SEP] document [SEP]</text>

<rect x="675" y="235" width="560" height="140" rx="10" fill="#FFFFFF" stroke="#B8860B" stroke-width="2.5"/>
<text x="955.0" y="287.0" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#B8860B" font-weight="normal" text-anchor="middle">one encoder, all layers:</text>
<text x="955.0" y="312.0" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#B8860B" font-weight="normal" text-anchor="middle">every query token attends</text>
<text x="955.0" y="337.0" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#B8860B" font-weight="normal" text-anchor="middle">to every document token</text>
