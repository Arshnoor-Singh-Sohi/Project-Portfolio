<text x="955.0" y="452.0" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" font-weight="normal" text-anchor="middle">hidden state of [CLS] → linear layer</text>
<line x1="955" y1="377" x2="955" y2="413" stroke="#100D12" stroke-width="2.5" marker-end="url(#arink)"/>
<rect x="830" y="515" width="250" height="60" rx="10" fill="#FFFFFF" stroke="#6A4C93" stroke-width="2.5"/>
<text x="955.0" y="552.0" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#6A4C93" font-weight="normal" text-anchor="middle">relevance score</text>
<line x1="955" y1="477" x2="955" y2="513" stroke="#100D12" stroke-width="2.5" marker-end="url(#arink)"/>
<text x="675" y="625" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#100D12" font-weight="normal" text-anchor="start">Per query: N full passes, one per candidate.</text>
<text x="675" y="648" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#100D12" font-weight="normal" text-anchor="start">Nothing can be computed in advance.</text>
