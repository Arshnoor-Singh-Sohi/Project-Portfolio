<text x="320" y="585" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#100D12" font-weight="bold" text-anchor="middle">score = cos(q, d)</text>
<text x="45" y="625" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#100D12" font-weight="normal" text-anchor="start">Per query: 1 encoder pass + N dot products.</text>
<text x="45" y="648" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#100D12" font-weight="normal" text-anchor="start">Query and document meet only in the dot product.</text>
