<text x="470.0" y="422.0" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" font-weight="normal" text-anchor="middle">pool + normalize</text>
<line x1="170" y1="347" x2="170" y2="383" stroke="#100D12" stroke-width="2.5" marker-end="url(#arink)"/>
<line x1="470" y1="347" x2="470" y2="383" stroke="#100D12" stroke-width="2.5" marker-end="url(#arink)"/>
<rect x="45" y="485" width="250" height="60" rx="10" fill="#FFFFFF" stroke="#1E6091" stroke-width="2.5"/>
<text x="170.0" y="522.0" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1E6091" font-weight="normal" text-anchor="middle">q: one vector [d]</text>
<rect x="335" y="485" width="270" height="60" rx="10" fill="#FFFFFF" stroke="#2D6A4F" stroke-width="2.5"/>
<text x="470.0" y="522.0" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#2D6A4F" font-weight="normal" text-anchor="middle">d: stored in the index</text>
