<text x="170.0" y="284.5" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#B8860B" font-weight="normal" text-anchor="middle">encoder</text>
<text x="170.0" y="309.5" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#B8860B" font-weight="normal" text-anchor="middle">tokens → H [T, d]</text>
