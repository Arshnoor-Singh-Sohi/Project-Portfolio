<text x="355" y="113" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#FFFFFF" font-weight="bold" text-anchor="middle">Tool object in tools/list (from the server)</text>
<text x="597" y="158" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#100D12" font-weight="normal" text-anchor="middle" font-style="italic">read by</text>
<text x="50" y="200" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#6A4C93" font-weight="bold" text-anchor="start">name</text>
<text x="215" y="200" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" font-weight="normal" text-anchor="start">"search_orders" (required)</text>
<rect x="530" y="179" width="135" height="28" rx="14.0" fill="#B8860B" stroke="#B8860B" stroke-width="1"/>
<text x="597.5" y="199.65" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#FFFFFF" font-weight="bold" text-anchor="middle">model+host</text>
<text x="50" y="252" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#6A4C93" font-weight="bold" text-anchor="start">title</text>
<text x="215" y="252" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" font-weight="normal" text-anchor="start">"Search orders" (display)</text>
<rect x="530" y="231" width="135" height="28" rx="14.0" fill="#1E6091" stroke="#1E6091" stroke-width="1"/>
<text x="597.5" y="251.65" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#FFFFFF" font-weight="bold" text-anchor="middle">host UI</text>
<text x="50" y="304" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#6A4C93" font-weight="bold" text-anchor="start">description</text>
<text x="215" y="304" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" font-weight="normal" text-anchor="start">what it does, returns, when</text>
<rect x="530" y="283" width="135" height="28" rx="14.0" fill="#B8860B" stroke="#B8860B" stroke-width="1"/>
<text x="597.5" y="303.65" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#FFFFFF" font-weight="bold" text-anchor="middle">model</text>
<text x="50" y="356" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#6A4C93" font-weight="bold" text-anchor="start">inputSchema</text>
<text x="215" y="356" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" font-weight="normal" text-anchor="start">{ type: "object", properties,</text>
<rect x="530" y="335" width="135" height="28" rx="14.0" fill="#B8860B" stroke="#B8860B" stroke-width="1"/>
<text x="597.5" y="355.65" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#FFFFFF" font-weight="bold" text-anchor="middle">model+host</text>
<text x="215" y="408" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" font-weight="normal" text-anchor="start">  required, additionalProperties }</text>
<text x="50" y="460" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#6A4C93" font-weight="bold" text-anchor="start">outputSchema</text>
<text x="215" y="460" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" font-weight="normal" text-anchor="start">shape of structuredContent</text>
<rect x="530" y="439" width="135" height="28" rx="14.0" fill="#1E6091" stroke="#1E6091" stroke-width="1"/>
<text x="597.5" y="459.65" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#FFFFFF" font-weight="bold" text-anchor="middle">host</text>
