<text x="900.0" y="598.65" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#FFFFFF" font-weight="bold" text-anchor="middle">to the model</text>
<text x="820" y="646" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#6A4C93" font-weight="bold" text-anchor="start">structuredContent: {orders, ...}</text>
<rect x="820" y="658" width="160" height="28" rx="14.0" fill="#1E6091" stroke="#1E6091" stroke-width="1"/>
<text x="900.0" y="678.65" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#FFFFFF" font-weight="bold" text-anchor="middle">to the host</text>
