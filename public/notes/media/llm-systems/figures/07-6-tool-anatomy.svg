<text x="835" y="276" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" font-weight="normal" text-anchor="start">{"customer_id": "CUS-0042",</text>
<text x="835" y="304" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" font-weight="normal" text-anchor="start"> "status": "shipped", "limit": 2}</text>
<text x="820" y="344" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#100D12" font-weight="normal" text-anchor="start">params._meta: protocolVersion,</text>
<text x="835" y="370" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#100D12" font-weight="normal" text-anchor="start">clientCapabilities, clientInfo</text>
