<text x="215" y="512" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" font-weight="normal" text-anchor="start">readOnlyHint, destructiveHint,</text>
<rect x="530" y="491" width="135" height="28" rx="14.0" fill="#1E6091" stroke="#1E6091" stroke-width="1"/>
<text x="597.5" y="511.65" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#FFFFFF" font-weight="bold" text-anchor="middle">host</text>
<text x="215" y="564" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" font-weight="normal" text-anchor="start">idempotentHint, openWorldHint, title</text>
<text x="50" y="616" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#6A4C93" font-weight="bold" text-anchor="start">icons</text>
<text x="215" y="616" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" font-weight="normal" text-anchor="start">src, mimeType, sizes, theme</text>
<rect x="530" y="595" width="135" height="28" rx="14.0" fill="#1E6091" stroke="#1E6091" stroke-width="1"/>
<text x="597.5" y="615.65" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#FFFFFF" font-weight="bold" text-anchor="middle">host UI</text>
<text x="50" y="668" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#6A4C93" font-weight="bold" text-anchor="start">_meta</text>
<text x="215" y="668" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" font-weight="normal" text-anchor="start">"com.example/owner": ...</text>
<rect x="530" y="647" width="135" height="28" rx="14.0" fill="#1E6091" stroke="#1E6091" stroke-width="1"/>
<text x="597.5" y="667.65" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#FFFFFF" font-weight="bold" text-anchor="middle">host</text>
<text x="50" y="735" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#100D12" font-weight="normal" text-anchor="start" font-style="italic">Gold: the model reads it. Blue: only the host reads it.</text>
<text x="50" y="760" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#C81D25" font-weight="normal" text-anchor="start" font-style="italic">Annotations are hints. Untrusted unless the server is trusted.</text>
