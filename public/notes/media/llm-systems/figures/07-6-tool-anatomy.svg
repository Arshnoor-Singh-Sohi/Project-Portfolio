<rect x="0" y="0" width="1280" height="800" fill="#FFFFFF"/>
<text x="640.0" y="46" font-family="Helvetica, Arial, sans-serif" font-size="28" fill="#100D12" font-weight="bold" text-anchor="middle">Anatomy of an MCP tool: the definition and one call</text>
<rect x="30" y="80" width="650" height="690" rx="10" fill="none" stroke="#6A4C93" stroke-width="3"/>
