<rect x="652" y="90" width="280" height="460" rx="10" fill="#FFFFFF" fill-opacity="1.0" stroke="#100D12" stroke-width="2.5"/>
<text x="792.0" y="130" font-size="24" fill="#100D12" font-weight="bold" text-anchor="middle" font-style="normal">2025-11-25</text>
<circle cx="674" cy="177" r="5" fill="#100D12"/>
<text x="688" y="184" font-size="20" fill="#100D12" font-weight="normal" text-anchor="start" font-style="normal">OpenID Connect</text>
<text x="688" y="210" font-size="20" fill="#100D12" font-weight="normal" text-anchor="start" font-style="normal">discovery added</text>
<circle cx="674" cy="263" r="5" fill="#100D12"/>
<text x="688" y="270" font-size="20" fill="#100D12" font-weight="normal" text-anchor="start" font-style="normal">CIMD recommended</text>
<text x="688" y="296" font-size="20" fill="#100D12" font-weight="normal" text-anchor="start" font-style="normal">(SEP-991)</text>
<circle cx="674" cy="349" r="5" fill="#100D12"/>
<text x="688" y="356" font-size="20" fill="#100D12" font-weight="normal" text-anchor="start" font-style="normal">scope in challenge,</text>
<text x="688" y="382" font-size="20" fill="#100D12" font-weight="normal" text-anchor="start" font-style="normal">step-up (SEP-835)</text>
<circle cx="674" cy="435" r="5" fill="#100D12"/>
<text x="688" y="442" font-size="20" fill="#100D12" font-weight="normal" text-anchor="start" font-style="normal">PRM header optional,</text>
<text x="688" y="468" font-size="20" fill="#100D12" font-weight="normal" text-anchor="start" font-style="normal">well-known fallback</text>
<line x1="934" y1="320" x2="956" y2="320" stroke="#8A8A8A" stroke-width="2.5" marker-end="url(#arr8A8A8A)"/>
<rect x="958" y="90" width="280" height="460" rx="10" fill="#FFFFFF" fill-opacity="1.0" stroke="#6A4C93" stroke-width="2.5"/>
<text x="1098.0" y="130" font-size="24" fill="#6A4C93" font-weight="bold" text-anchor="middle" font-style="normal">2026-07-28</text>
<circle cx="980" cy="177" r="5" fill="#6A4C93"/>
<text x="994" y="184" font-size="20" fill="#100D12" font-weight="normal" text-anchor="start" font-style="normal">iss validation</text>
<text x="994" y="210" font-size="20" fill="#100D12" font-weight="normal" text-anchor="start" font-style="normal">(RFC 9207)</text>
<circle cx="980" cy="263" r="5" fill="#6A4C93"/>
<text x="994" y="270" font-size="20" fill="#100D12" font-weight="normal" text-anchor="start" font-style="normal">application_type</text>
<text x="994" y="296" font-size="20" fill="#100D12" font-weight="normal" text-anchor="start" font-style="normal">in DCR (SEP-837)</text>
<circle cx="980" cy="349" r="5" fill="#6A4C93"/>
<text x="994" y="356" font-size="20" fill="#100D12" font-weight="normal" text-anchor="start" font-style="normal">credentials keyed</text>
<text x="994" y="382" font-size="20" fill="#100D12" font-weight="normal" text-anchor="start" font-style="normal">by issuer</text>
<circle cx="980" cy="435" r="5" fill="#6A4C93"/>
<text x="994" y="442" font-size="20" fill="#100D12" font-weight="normal" text-anchor="start" font-style="normal">DCR deprecated,</text>
<text x="994" y="468" font-size="20" fill="#100D12" font-weight="normal" text-anchor="start" font-style="normal">CIMD preferred</text>
