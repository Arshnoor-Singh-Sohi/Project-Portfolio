<rect x="140" y="438" width="1000" height="56" rx="8" fill="#FFFFFF" fill-opacity="1.0" stroke="#6A4C93" stroke-width="3"/>
<text x="640.0" y="473.35" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#6A4C93" font-weight="normal" text-anchor="middle">all-reduce 1: sum the two partial outputs  (16 KiB per token = 8192 × 2 bytes)</text>
<rect x="140" y="650" width="1000" height="56" rx="8" fill="#FFFFFF" fill-opacity="1.0" stroke="#6A4C93" stroke-width="3"/>
<text x="640.0" y="685.35" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#6A4C93" font-weight="normal" text-anchor="middle">all-reduce 2: sum the two partial outputs  (16 KiB per token)</text>
<text x="40" y="776" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" font-weight="normal" text-anchor="start">No communication inside the attention or MLP blocks: each GPU works on its own heads and its own MLP columns.</text>
<text x="40" y="806" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" font-weight="normal" text-anchor="start">Shown with TP = 2. With TP = 4 each GPU holds 16 query heads, 2 KV heads and 80 KiB of KV cache per token.</text></svg>
