<text x="60" y="698" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#8A8A8A" font-weight="normal" text-anchor="start">End to end = TTFT + TPOT x (n - 1) = 1,287 + 20 x 299 = 7,267 ms. Streaming shows text after 1.3 s.</text>
