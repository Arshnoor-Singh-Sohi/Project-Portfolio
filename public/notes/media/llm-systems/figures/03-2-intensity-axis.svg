<text x="707.3595942764551" y="214" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" text-anchor="middle" font-weight="bold">weight multiplications</text>
<text x="707.3595942764551" y="238" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" text-anchor="middle" font-weight="normal">at batch 64 ≈ 64</text>
<circle cx="1024.8236386260448" cy="330" r="10" fill="#B8860B" stroke="#B8860B" stroke-width="2"/>
