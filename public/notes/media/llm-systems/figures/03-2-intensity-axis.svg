<text x="1024.8236386260448" y="238" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#B8860B" text-anchor="middle" font-weight="normal">≈ 1,775</text>
<text x="640" y="492" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#100D12" text-anchor="middle" font-weight="normal">Batching raises the intensity of the weight multiplications (about b FLOPs per byte).</text>
<text x="640" y="526" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#100D12" text-anchor="middle" font-weight="normal">Decode attention stays at H / H_kv FLOPs per byte, because each sequence reads its own cache.</text>
<text x="640" y="570" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#8A8A8A" text-anchor="middle" font-weight="normal">Axis: FLOPs per byte (log scale)</text>
</svg>
