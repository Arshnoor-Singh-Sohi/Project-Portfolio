<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 760" width="1280" height="760">
<rect x="0" y="0" width="1280" height="760" rx="0" fill="#FFFFFF" stroke="none" stroke-width="2"/>
<text x="640.0" y="44" font-family="Helvetica, Arial, sans-serif" font-size="28" fill="#100D12" text-anchor="middle" font-weight="bold">Bytes between HBM and SRAM: standard attention vs FlashAttention</text>
<defs><marker id="ah100D12" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#100D12"/></marker><marker id="ah1E6091" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E6091"/></marker><marker id="ahB8860B" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B8860B"/></marker><marker id="ah6A4C93" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6A4C93"/></marker><marker id="ah2D6A4F" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2D6A4F"/></marker><marker id="ahC81D25" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C81D25"/></marker><marker id="ah8A8A8A" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A8A8A"/></marker></defs>
<line x1="640" y1="70" x2="640" y2="740" stroke="#8A8A8A" stroke-width="2" stroke-dasharray="6 6"/>
<text x="320" y="100" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#100D12" text-anchor="middle" font-weight="bold">Standard attention (Algorithm 0)</text>
<rect x="40" y="125" width="560" height="130" rx="10" fill="#EFEFEF" stroke="#100D12" stroke-width="2"/>
<text x="60" y="155" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#100D12" text-anchor="start" font-weight="bold">SRAM (on chip), three separate steps:</text>
<text x="60" y="185" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" text-anchor="start" font-weight="normal">1 read Q, K and compute S = QKᵀ → 2 write S</text>
<text x="60" y="213" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" text-anchor="start" font-weight="normal">3 read S and compute P = softmax(S) → 4 write P</text>
<text x="60" y="241" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" text-anchor="start" font-weight="normal">5 read P and V, compute O = PV, write O</text>
<rect x="40" y="430" width="560" height="230" rx="10" fill="#FFFFFF" stroke="#100D12" stroke-width="2"/>
<text x="60" y="645" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#100D12" text-anchor="start" font-weight="bold">HBM (80 GB, about 3.35 TB/s)</text>
<rect x="60" y="450" width="60" height="160" rx="4" fill="#D3E1EE" stroke="#1E6091" stroke-width="2.5"/>
<text x="90.0" y="537.0" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1E6091" text-anchor="middle" font-weight="bold">Q</text>
<rect x="130" y="450" width="60" height="160" rx="4" fill="#F1E4C4" stroke="#B8860B" stroke-width="2.5"/>
<text x="160.0" y="537.0" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#B8860B" text-anchor="middle" font-weight="bold">K</text>
<rect x="200" y="450" width="60" height="160" rx="4" fill="#E2D9EE" stroke="#6A4C93" stroke-width="2.5"/>
<text x="230.0" y="537.0" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#6A4C93" text-anchor="middle" font-weight="bold">V</text>
<rect x="280" y="450" width="140" height="160" rx="4" fill="#F6D3D5" stroke="#C81D25" stroke-width="2.5"/>
<text x="350.0" y="537.0" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#C81D25" text-anchor="middle" font-weight="bold">S [T, T]</text>
<rect x="440" y="450" width="140" height="160" rx="4" fill="#F6D3D5" stroke="#C81D25" stroke-width="2.5"/>
<text x="510.0" y="537.0" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#C81D25" text-anchor="middle" font-weight="bold">P [T, T]</text>
<line x1="125" y1="448" x2="125" y2="262" stroke="#100D12" stroke-width="2.5" marker-end="url(#ah100D12)"/>
<circle cx="125" cy="350" r="17" fill="#FFFFFF" stroke="#100D12" stroke-width="2.5"/>
<text x="125" y="357" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" text-anchor="middle" font-weight="bold">1</text>
<line x1="310" y1="262" x2="310" y2="446" stroke="#C81D25" stroke-width="3" marker-end="url(#ahC81D25)"/>
<circle cx="310" cy="330" r="17" fill="#FFFFFF" stroke="#C81D25" stroke-width="2.5"/>
<text x="310" y="337" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#C81D25" text-anchor="middle" font-weight="bold">2</text>
<line x1="390" y1="448" x2="390" y2="262" stroke="#C81D25" stroke-width="3" marker-end="url(#ahC81D25)"/>
<circle cx="390" cy="370" r="17" fill="#FFFFFF" stroke="#C81D25" stroke-width="2.5"/>
<text x="390" y="377" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#C81D25" text-anchor="middle" font-weight="bold">3</text>
<line x1="470" y1="262" x2="470" y2="446" stroke="#C81D25" stroke-width="3" marker-end="url(#ahC81D25)"/>
<circle cx="470" cy="330" r="17" fill="#FFFFFF" stroke="#C81D25" stroke-width="2.5"/>
<text x="470" y="337" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#C81D25" text-anchor="middle" font-weight="bold">4</text>
<line x1="550" y1="448" x2="550" y2="262" stroke="#C81D25" stroke-width="3" marker-end="url(#ahC81D25)"/>
<circle cx="550" cy="370" r="17" fill="#FFFFFF" stroke="#C81D25" stroke-width="2.5"/>
<text x="550" y="377" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#C81D25" text-anchor="middle" font-weight="bold">5</text>
<text x="320" y="695" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" text-anchor="middle" font-weight="normal">per head, T = 8,192, BF16: S and P 4 × 128 MiB</text>
<text x="320" y="723" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#C81D25" text-anchor="middle" font-weight="bold">+ Q, K, V, O 8 MiB = 520 MiB</text>
<text x="960" y="100" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#100D12" text-anchor="middle" font-weight="bold">FlashAttention (one fused kernel)</text>
<rect x="680" y="125" width="560" height="200" rx="10" fill="#EFEFEF" stroke="#100D12" stroke-width="2"/>
<text x="700" y="155" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#100D12" text-anchor="start" font-weight="bold">SRAM (on chip): tiles only</text>
<rect x="700" y="172" width="70" height="60" rx="4" fill="#D3E1EE" stroke="#1E6091" stroke-width="2.5"/>
<text x="735.0" y="209.0" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1E6091" text-anchor="middle" font-weight="bold">Q_i</text>
<rect x="780" y="172" width="70" height="60" rx="4" fill="#F1E4C4" stroke="#B8860B" stroke-width="2.5"/>
<text x="815.0" y="209.0" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#B8860B" text-anchor="middle" font-weight="bold">K_j</text>
<rect x="860" y="172" width="70" height="60" rx="4" fill="#E2D9EE" stroke="#6A4C93" stroke-width="2.5"/>
<text x="895.0" y="209.0" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#6A4C93" text-anchor="middle" font-weight="bold">V_j</text>
<rect x="950" y="172" width="90" height="60" rx="4" fill="#FFFFFF" stroke="#8A8A8A" stroke-width="2.5" stroke-dasharray="6 4"/>
<text x="995.0" y="209.0" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#8A8A8A" text-anchor="middle" font-weight="bold">S_ij</text>
<text x="1060" y="194" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" text-anchor="start" font-weight="normal">running m, ℓ</text>
<text x="1060" y="222" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" text-anchor="start" font-weight="normal">and õ per row</text>
<text x="700" y="268" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" text-anchor="start" font-weight="normal">S_ij and its probabilities stay here.</text>
<text x="700" y="296" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" text-anchor="start" font-weight="normal">Online softmax merges tile after tile.</text>
<rect x="680" y="430" width="560" height="230" rx="10" fill="#FFFFFF" stroke="#100D12" stroke-width="2"/>
<text x="700" y="645" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#100D12" text-anchor="start" font-weight="bold">HBM</text>
<rect x="700" y="450" width="60" height="160" rx="4" fill="#D3E1EE" stroke="#1E6091" stroke-width="2.5"/>
<text x="730.0" y="537.0" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1E6091" text-anchor="middle" font-weight="bold">Q</text>
<rect x="770" y="450" width="60" height="160" rx="4" fill="#F1E4C4" stroke="#B8860B" stroke-width="2.5"/>
<text x="800.0" y="537.0" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#B8860B" text-anchor="middle" font-weight="bold">K</text>
<rect x="840" y="450" width="60" height="160" rx="4" fill="#E2D9EE" stroke="#6A4C93" stroke-width="2.5"/>
<text x="870.0" y="537.0" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#6A4C93" text-anchor="middle" font-weight="bold">V</text>
<rect x="920" y="450" width="60" height="160" rx="4" fill="#FFFFFF" stroke="#100D12" stroke-width="2.5"/>
<text x="950.0" y="537.0" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" text-anchor="middle" font-weight="bold">O</text>
<rect x="990" y="450" width="40" height="160" rx="4" fill="#FFFFFF" stroke="#100D12" stroke-width="2.5"/>
<text x="1010.0" y="537.0" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" text-anchor="middle" font-weight="bold">L</text>
<rect x="1050" y="450" width="170" height="160" rx="4" fill="none" stroke="#8A8A8A" stroke-width="2" stroke-dasharray="7 5"/>
<text x="1135" y="525" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#8A8A8A" text-anchor="middle" font-weight="bold">no S, no P</text>
<text x="1135" y="552" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#8A8A8A" text-anchor="middle" font-weight="normal">in HBM</text>
<line x1="715" y1="448" x2="715" y2="332" stroke="#1E6091" stroke-width="2.5" marker-end="url(#ah1E6091)"/>
<text x="723" y="375" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1E6091" text-anchor="start" font-weight="normal">read Q_i</text>
<text x="723" y="400" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1E6091" text-anchor="start" font-weight="normal">once</text>
<line x1="835" y1="448" x2="835" y2="332" stroke="#B8860B" stroke-width="2.5" marker-end="url(#ahB8860B)"/>
<text x="843" y="375" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#B8860B" text-anchor="start" font-weight="normal">loop: read</text>
<text x="843" y="400" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#B8860B" text-anchor="start" font-weight="normal">K_j, V_j</text>
<line x1="985" y1="332" x2="985" y2="446" stroke="#100D12" stroke-width="2.5" marker-end="url(#ah100D12)"/>
<text x="993" y="375" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" text-anchor="start" font-weight="normal">write O_i, L_i</text>
<text x="993" y="400" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" text-anchor="start" font-weight="normal">once</text>
<text x="960" y="695" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" text-anchor="middle" font-weight="normal">S and P never reach HBM. Extra memory: L,</text>
<text x="960" y="723" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" text-anchor="middle" font-weight="bold">one number per row: 32 KiB per head at T = 8,192</text>
</svg>
