<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 700" width="1280" height="700">
<defs><marker id="a100D12" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#100D12"/></marker><marker id="a6A4C93" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6A4C93"/></marker><marker id="aB8860B" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B8860B"/></marker></defs>
<rect x="0" y="0" width="1280" height="700" fill="#FFFFFF"/>
<text x="640.0" y="46" font-family="Helvetica, Arial, sans-serif" font-size="28" fill="#100D12" font-weight="bold" text-anchor="middle">Two error paths for tools/call</text>
<rect x="470" y="80" width="340" height="70" rx="10" fill="none" stroke="#1E6091" stroke-width="3"/>
<text x="640" y="112" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#1E6091" font-weight="bold" text-anchor="middle">tools/call from the host</text>
<text x="640" y="138" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#100D12" font-weight="normal" text-anchor="middle">name + arguments</text>
<line x1="560" y1="152" x2="330" y2="215" stroke="#100D12" stroke-width="2.5" marker-end="url(#a100D12)"/>
<line x1="720" y1="152" x2="950" y2="215" stroke="#100D12" stroke-width="2.5" marker-end="url(#a100D12)"/>
<rect x="40" y="220" width="560" height="300" rx="10" fill="none" stroke="#C81D25" stroke-width="3"/>
<text x="320" y="258" font-family="Helvetica, Arial, sans-serif" font-size="23" fill="#C81D25" font-weight="bold" text-anchor="middle">Protocol error (JSON-RPC error)</text>
<text x="60" y="300" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" font-weight="normal" text-anchor="start">Cause: unknown tool, request does not match</text>
<text x="60" y="328" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" font-weight="normal" text-anchor="start">the CallToolRequest schema, server failure</text>
<text x="60" y="372" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#C81D25" font-weight="normal" text-anchor="start">{"error": {"code": -32602,</text>
<text x="60" y="400" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#C81D25" font-weight="normal" text-anchor="start">  "message": "Unknown tool: serch_orders"}}</text>
<text x="60" y="446" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" font-weight="normal" text-anchor="start">Clients MAY give it to the model.</text>
<text x="60" y="474" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" font-weight="normal" text-anchor="start">Often it stops in client code.</text>
<text x="60" y="502" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" font-weight="normal" text-anchor="start">The model is less likely to recover.</text>
<rect x="680" y="220" width="560" height="300" rx="10" fill="none" stroke="#6A4C93" stroke-width="3"/>
<text x="960" y="258" font-family="Helvetica, Arial, sans-serif" font-size="23" fill="#6A4C93" font-weight="bold" text-anchor="middle">Tool execution error (normal result)</text>
<text x="700" y="300" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" font-weight="normal" text-anchor="start">Cause: invalid argument value, API failure,</text>
<text x="700" y="328" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" font-weight="normal" text-anchor="start">business rule (for example: order shipped)</text>
<text x="700" y="372" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#6A4C93" font-weight="normal" text-anchor="start">{"result": {"isError": true, "content":</text>
<text x="700" y="400" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#6A4C93" font-weight="normal" text-anchor="start">  [{"type": "text", "text": "Invalid ..."}]}}</text>
<text x="700" y="446" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" font-weight="normal" text-anchor="start">Clients SHOULD give it to the model.</text>
<text x="700" y="474" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" font-weight="normal" text-anchor="start">The model reads the message and</text>
<text x="700" y="502" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" font-weight="normal" text-anchor="start">calls again with fixed arguments.</text>
<rect x="760" y="580" width="400" height="70" rx="10" fill="none" stroke="#B8860B" stroke-width="3"/>
<text x="960" y="612" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#B8860B" font-weight="bold" text-anchor="middle">Model</text>
<text x="960" y="638" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#100D12" font-weight="normal" text-anchor="middle">reads "expected CUS-NNNN"</text>
<line x1="960" y1="522" x2="960" y2="576" stroke="#6A4C93" stroke-width="2.5" marker-end="url(#a6A4C93)"/>
<path d="M 1162 615 L 1262 615 L 1262 115 L 814 115" fill="none" stroke="#B8860B" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#aB8860B)"/>
<text x="1040" y="104" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#B8860B" font-weight="normal" text-anchor="middle" font-style="italic">retry with fixed arguments</text>
<text x="320" y="600" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#100D12" font-weight="normal" text-anchor="middle" font-style="italic">Measured: the Python SDK 2.3.0 returns an</text>
<text x="320" y="626" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#100D12" font-weight="normal" text-anchor="middle" font-style="italic">unknown tool as isError: true, not as -32602.</text>
</svg>
