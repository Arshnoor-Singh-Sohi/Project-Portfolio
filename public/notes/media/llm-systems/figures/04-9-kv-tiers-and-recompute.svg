<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 770" width="1280" height="770"><defs><marker id="arr100D12" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#100D12"/></marker><marker id="arr1E6091" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1E6091"/></marker><marker id="arrB8860B" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#B8860B"/></marker><marker id="arr6A4C93" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6A4C93"/></marker><marker id="arr2D6A4F" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2D6A4F"/></marker><marker id="arrC81D25" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#C81D25"/></marker><marker id="arr8A8A8A" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8A8A8A"/></marker></defs><rect x="0" y="0" width="1280" height="770" fill="#FFFFFF"/>
<text x="640.0" y="44" font-family="Helvetica, Arial, sans-serif" font-size="28" fill="#100D12" font-weight="bold" text-anchor="middle">Where reusable KV can live, and what a miss costs</text>
<text x="40" y="100" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#100D12" font-weight="bold" text-anchor="start">Storage tiers for KV blocks</text>
<rect x="40" y="125" width="470" height="62" rx="8" fill="none" fill-opacity="1.0" stroke="#B8860B" stroke-width="3"/>
<text x="275.0" y="163.0" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" font-weight="normal" text-anchor="middle">GPU HBM: H100 80 GB, about 3.35 TB/s</text>
<text x="530" y="163" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#100D12" font-weight="normal" text-anchor="start">hit = no prefill for the cached part</text>
<line x1="275" y1="187" x2="275" y2="217" stroke="#100D12" stroke-width="2" marker-end="url(#arr100D12)"/>
<rect x="40" y="217" width="470" height="62" rx="8" fill="none" fill-opacity="1.0" stroke="#2D6A4F" stroke-width="3"/>
<text x="275.0" y="255.0" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" font-weight="normal" text-anchor="middle">CPU DRAM: hundreds of GB, PCIe Gen5</text>
<text x="530" y="255" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#100D12" font-weight="normal" text-anchor="start">reload over PCIe, about 64 GB/s each way</text>
<line x1="275" y1="279" x2="275" y2="309" stroke="#100D12" stroke-width="2" marker-end="url(#arr100D12)"/>
<rect x="40" y="309" width="470" height="62" rx="8" fill="none" fill-opacity="1.0" stroke="#2D6A4F" stroke-width="3"/>
<text x="275.0" y="347.0" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" font-weight="normal" text-anchor="middle">Local SSD: TBs</text>
<text x="530" y="347" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#100D12" font-weight="normal" text-anchor="start">slower reload, survives restarts if persisted</text>
<line x1="275" y1="371" x2="275" y2="401" stroke="#100D12" stroke-width="2" marker-end="url(#arr100D12)"/>
<rect x="40" y="401" width="470" height="62" rx="8" fill="none" fill-opacity="1.0" stroke="#2D6A4F" stroke-width="3"/>
<text x="275.0" y="439.0" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" font-weight="normal" text-anchor="middle">Remote store (for example via LMCache)</text>
<text x="530" y="439" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#100D12" font-weight="normal" text-anchor="start">shared by many servers, network latency</text>
<text x="40" y="520" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#100D12" font-weight="normal" text-anchor="start">Engines: vLLM --kv-offloading-size (native or LMCache backend), SGLang HiCache, TensorRT-LLM host_cache_size.</text>
<text x="40" y="580" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#100D12" font-weight="bold" text-anchor="start">One 6,000-token prefix of Llama-3.1-8B (750 MiB of KV), one H100, ideal estimates</text>
<text x="40" y="622" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" font-weight="normal" text-anchor="start">GPU cache hit</text>
<rect x="300" y="604" width="4" height="26" rx="3" fill="#2D6A4F" fill-opacity="0.85" stroke="#2D6A4F" stroke-width="2"/>
<text x="316" y="624" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#100D12" font-weight="normal" text-anchor="start">about 0 ms for these tokens</text>
<text x="40" y="660" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" font-weight="normal" text-anchor="start">reload from CPU</text>
<rect x="300" y="642" width="73.80000000000001" height="26" rx="3" fill="#2D6A4F" fill-opacity="0.85" stroke="#2D6A4F" stroke-width="2"/>
<text x="385.8" y="662" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#100D12" font-weight="normal" text-anchor="start">about 12 ms (750 MiB at 64 GB/s)</text>
<text x="40" y="698" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" font-weight="normal" text-anchor="start">recompute (prefill)</text>
<rect x="300" y="680" width="584.4000000000001" height="26" rx="3" fill="#C81D25" fill-opacity="0.85" stroke="#C81D25" stroke-width="2"/>
<text x="896.4000000000001" y="700" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#C81D25" font-weight="normal" text-anchor="start">about 97 ms at peak FLOPs</text>
<text x="40" y="745" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#100D12" font-weight="normal" text-anchor="start" font-style="italic">Real prefill runs below peak FLOPs, so recomputing costs more than this bar shows.</text></svg>
