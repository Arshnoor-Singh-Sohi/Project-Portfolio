<text x="640" y="725" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" text-anchor="middle" font-weight="normal" font-style="italic">The Service sends traffic only to Pods whose readiness probe succeeds.</text>
<text x="640" y="760" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" text-anchor="middle" font-weight="normal" font-style="italic">The scheduler places a Pod only on a node with a free GPU, a matching label and a tolerated taint.</text>
