<text x="640.0" y="46" font-family="Helvetica, Arial, sans-serif" font-size="28" fill="#100D12" font-weight="bold" text-anchor="middle">Prefix-aware routing: the Endpoint Picker scores every replica</text>
<rect x="30" y="90" width="400" height="96" rx="10" fill="#FFFFFF" stroke="#1E6091" stroke-width="3"/>
<text x="48" y="125" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#1E6091" font-weight="normal" text-anchor="start">Request: 4,096-token prompt</text>
<text x="48" y="152" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#1E6091" font-weight="normal" text-anchor="start">= 64 blocks of 64 tokens</text>
