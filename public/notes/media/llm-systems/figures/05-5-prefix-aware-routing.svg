<text x="488" y="125" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#100D12" font-weight="normal" text-anchor="start">score = 3 x (cached blocks / 64)</text>
<text x="488" y="152" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#100D12" font-weight="normal" text-anchor="start">+ 2 x (1 - KV usage) + 2 x queue score</text>
