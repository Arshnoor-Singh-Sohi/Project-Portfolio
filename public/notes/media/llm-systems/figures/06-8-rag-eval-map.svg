<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 760" width="1280" height="760">
<rect x="0" y="0" width="1280" height="760" fill="#FFFFFF"/>
<defs><marker id="ahink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#100D12"/></marker><marker id="ahblue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E6091"/></marker><marker id="ahgold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B8860B"/></marker><marker id="ahpurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6A4C93"/></marker><marker id="ahgreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2D6A4F"/></marker><marker id="ahred" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C81D25"/></marker><marker id="ahgray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A8A8A"/></marker></defs>
<text x="640.0" y="44" font-family="Helvetica, Arial, sans-serif" font-size="28" fill="#100D12" font-weight="bold" text-anchor="middle">What each RAG metric compares</text>
<rect x="40" y="300" width="190" height="90" rx="10" fill="#1E6091" fill-opacity="1.0" stroke="#1E6091" stroke-width="2.5"/>
<text x="135.0" y="352.7" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#FFFFFF" font-weight="normal" text-anchor="middle">Question</text>
<path d="M290,299 A95.0,14 0 0,1 480,299 L480,391 A95.0,14 0 0,1 290,391 Z" fill="#2D6A4F" stroke="#2D6A4F" stroke-width="2"/>
<ellipse cx="385.0" cy="299" rx="95.0" ry="14" fill="#3F8A68" stroke="#2D6A4F" stroke-width="2"/>
<text x="385.0" y="345.0" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#FFFFFF" font-weight="bold" text-anchor="middle">Retriever</text>
<text x="385.0" y="371.0" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#FFFFFF" font-weight="normal" text-anchor="middle">+ index</text>
<rect x="540" y="300" width="190" height="90" rx="10" fill="#6A4C93" fill-opacity="1.0" stroke="#6A4C93" stroke-width="2.5"/>
<text x="635.0" y="339.0" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#FFFFFF" font-weight="normal" text-anchor="middle">Context</text>
<text x="635.0" y="365.0" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#FFFFFF" font-weight="normal" text-anchor="middle">(top k chunks)</text>
<rect x="790" y="300" width="190" height="90" rx="10" fill="#B8860B" fill-opacity="1.0" stroke="#B8860B" stroke-width="2.5"/>
<text x="885.0" y="339.0" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#FFFFFF" font-weight="normal" text-anchor="middle">Generator</text>
<text x="885.0" y="365.0" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#FFFFFF" font-weight="normal" text-anchor="middle">(LLM)</text>
<rect x="1040" y="300" width="200" height="90" rx="10" fill="#FFFFFF" fill-opacity="1.0" stroke="#100D12" stroke-width="2.5"/>
<text x="1140.0" y="352.7" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#100D12" font-weight="normal" text-anchor="middle">Answer</text>
<line x1="230" y1="345" x2="286" y2="345" stroke="#100D12" stroke-width="2.5" marker-end="url(#ahink)"/>
<line x1="480" y1="345" x2="536" y2="345" stroke="#100D12" stroke-width="2.5" marker-end="url(#ahink)"/>
<line x1="730" y1="345" x2="786" y2="345" stroke="#100D12" stroke-width="2.5" marker-end="url(#ahink)"/>
<line x1="980" y1="345" x2="1036" y2="345" stroke="#100D12" stroke-width="2.5" marker-end="url(#ahink)"/>
<rect x="440" y="560" width="390" height="80" rx="10" fill="#FFFFFF" fill-opacity="1.0" stroke="#8A8A8A" stroke-width="2.5" stroke-dasharray="8 6"/>
<text x="635.0" y="594.0" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" font-weight="normal" text-anchor="middle">Labels: relevant documents</text>
<text x="635.0" y="620.0" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" font-weight="normal" text-anchor="middle">with grades (qrels)</text>
<rect x="900" y="560" width="340" height="80" rx="10" fill="#FFFFFF" fill-opacity="1.0" stroke="#8A8A8A" stroke-width="2.5" stroke-dasharray="8 6"/>
<text x="1070.0" y="594.0" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" font-weight="normal" text-anchor="middle">Label: reference answer</text>
<text x="1070.0" y="620.0" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" font-weight="normal" text-anchor="middle">and reference claims</text>
<path d="M135,296 C135,200 635,200 635,296" stroke="#1E6091" stroke-width="3" fill="none"/>
<text x="385.0" y="222" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1E6091" font-weight="bold" text-anchor="middle">context relevance</text>
<path d="M635,296 C635,200 1140,200 1140,296" stroke="#6A4C93" stroke-width="3" fill="none"/>
<text x="887.5" y="222" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#6A4C93" font-weight="bold" text-anchor="middle">faithfulness (groundedness)</text>
<path d="M135,296 C135,90 1140,90 1140,296" stroke="#100D12" stroke-width="3" fill="none"/>
<text x="637.5" y="112" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" font-weight="bold" text-anchor="middle">answer relevance</text>
<text x="640" y="76" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#8A8A8A" font-weight="normal" text-anchor="middle">The three arcs form the RAG triad: no labels needed, only a judge</text>
<line x1="635" y1="392" x2="635" y2="556" stroke="#2D6A4F" stroke-width="3"/>
<text x="622" y="430" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#2D6A4F" font-weight="bold" text-anchor="end">precision@k, recall@k,</text>
<text x="622" y="456" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#2D6A4F" font-weight="bold" text-anchor="end">MRR, AP, nDCG</text>
<line x1="1140" y1="392" x2="1140" y2="556" stroke="#C81D25" stroke-width="3"/>
<text x="1128" y="430" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#C81D25" font-weight="bold" text-anchor="end">correctness:</text>
<text x="1128" y="456" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#C81D25" font-weight="bold" text-anchor="end">EM, F1, judge</text>
<path d="M720,392 L960,556" stroke="#6A4C93" stroke-width="3" fill="none" stroke-dasharray="8 6"/>
<text x="835" y="505" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#6A4C93" font-weight="bold" text-anchor="end">context recall</text>
<rect x="40" y="410" width="330" height="230" rx="10" fill="#FFFFFF" fill-opacity="1.0" stroke="#8A8A8A" stroke-width="2.5" stroke-dasharray="8 6"/>
<text x="205" y="442" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#100D12" font-weight="bold" text-anchor="middle">Isolate the generator</text>
<text x="60" y="478" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#100D12" font-weight="normal" text-anchor="start">Same questions, three contexts:</text>
<text x="60" y="505" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#100D12" font-weight="normal" text-anchor="start">closed-book (none):  29%</text>
<text x="60" y="532" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#100D12" font-weight="normal" text-anchor="start">retrieved chunks:      71%</text>
<text x="60" y="559" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#100D12" font-weight="normal" text-anchor="start">oracle chunks:          88%</text>
<text x="60" y="586" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#100D12" font-weight="normal" text-anchor="start">retrieval loss = 88 - 71</text>
<text x="60" y="613" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#100D12" font-weight="normal" text-anchor="start">generation loss = 100 - 88</text>
<text x="640" y="730" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#8A8A8A" font-weight="normal" text-anchor="middle">Blue: query. Green: retrieval metrics. Purple: context. Gold: generator. Red: correctness against a reference.</text>
</svg>
