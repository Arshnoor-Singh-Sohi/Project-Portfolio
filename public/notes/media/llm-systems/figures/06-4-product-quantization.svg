<text x="30" y="286" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#2D6A4F" font-weight="normal" text-anchor="start">64 codes of 1 byte each (the nearest of 256 centroids) = 64 bytes</text>
<text x="880" y="135" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#100D12" font-weight="normal" text-anchor="start">Compression: 4,096 / 64 = 64×</text>
<text x="880" y="158" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#100D12" font-weight="normal" text-anchor="start">Codebooks: 64 × 256 × 16 × 4 B</text>
<text x="880" y="181" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#100D12" font-weight="normal" text-anchor="start">= 1 MiB, shared by all vectors</text>
<text x="880" y="204" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#100D12" font-weight="normal" text-anchor="start">ADC table per query: 64 × 256</text>
<text x="30" y="340" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#100D12" font-weight="bold" text-anchor="start">Tiny worked example (d = 4, m = 2, k* = 2)</text>
<rect x="30" y="360" width="300" height="56" rx="10" fill="#FFFFFF" stroke="#B8860B" stroke-width="2.5"/>
<text x="180.0" y="395.0" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#B8860B" font-weight="normal" text-anchor="middle">y = [3.5, 4.2 | 0.2, 2.6]</text>
<rect x="30" y="440" width="300" height="56" rx="10" fill="#FFFFFF" stroke="#2D6A4F" stroke-width="2.5"/>
<text x="180.0" y="475.0" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#2D6A4F" font-weight="normal" text-anchor="middle">code(y) = [1, 1]</text>
<line x1="180" y1="418" x2="180" y2="438" stroke="#100D12" stroke-width="2.5" marker-end="url(#arink)"/>
<rect x="30" y="540" width="300" height="56" rx="10" fill="#FFFFFF" stroke="#B8860B" stroke-width="2.5"/>
<text x="180.0" y="575.0" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#B8860B" font-weight="normal" text-anchor="middle">z = [0.3, -0.2 | 1.1, 0.4]</text>
<rect x="30" y="620" width="300" height="56" rx="10" fill="#FFFFFF" stroke="#2D6A4F" stroke-width="2.5"/>
<text x="180.0" y="655.0" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#2D6A4F" font-weight="normal" text-anchor="middle">code(z) = [0, 0]</text>
<line x1="180" y1="598" x2="180" y2="618" stroke="#100D12" stroke-width="2.5" marker-end="url(#arink)"/>
<text x="370" y="385" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#100D12" font-weight="bold" text-anchor="start">Codebook 1 (dims 1-2)</text>
<text x="370" y="415" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#100D12" font-weight="normal" text-anchor="start">c0 = [0, 0]</text>
<text x="500" y="415" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#100D12" font-weight="normal" text-anchor="start">c1 = [4, 4]</text>
<text x="370" y="465" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#100D12" font-weight="bold" text-anchor="start">Codebook 2 (dims 3-4)</text>
<text x="370" y="495" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#100D12" font-weight="normal" text-anchor="start">c0 = [1, 0]</text>
<text x="500" y="495" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#100D12" font-weight="normal" text-anchor="start">c1 = [0, 3]</text>
<rect x="700" y="360" width="300" height="56" rx="10" fill="#FFFFFF" stroke="#1E6091" stroke-width="2.5"/>
<text x="850.0" y="395.0" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1E6091" font-weight="normal" text-anchor="middle">query x = [3, 3 | 0, 2]</text>
<text x="700" y="450" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#100D12" font-weight="normal" text-anchor="start">ADC table T: squared distance from</text>
<text x="700" y="474" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#100D12" font-weight="normal" text-anchor="start">each query half to each centroid</text>
<text x="855" y="504" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#8A8A8A" font-weight="normal" text-anchor="middle">c0</text>
<text x="945" y="504" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#8A8A8A" font-weight="normal" text-anchor="middle">c1</text>
