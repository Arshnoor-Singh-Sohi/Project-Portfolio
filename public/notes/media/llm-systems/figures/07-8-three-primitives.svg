<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 760" width="1280" height="760">
<defs></defs>
<rect x="0" y="0" width="1280" height="760" fill="#FFFFFF"/>
<text x="640.0" y="46" font-family="Helvetica, Arial, sans-serif" font-size="28" fill="#100D12" font-weight="bold" text-anchor="middle">Three server primitives and who decides when to use them</text>
<rect x="30" y="80" width="386" height="610" rx="10" fill="none" stroke="#6A4C93" stroke-width="3"/>
<rect x="30" y="80" width="386" height="52" rx="10" fill="#6A4C93" stroke="#6A4C93" stroke-width="2.5"/>
<text x="223" y="115" font-family="Helvetica, Arial, sans-serif" font-size="25" fill="#FFFFFF" font-weight="bold" text-anchor="middle">Tools</text>
<rect x="88" y="150" width="270" height="34" rx="17.0" fill="#B8860B" stroke="#B8860B" stroke-width="1"/>
<text x="223.0" y="174.0" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#FFFFFF" font-weight="bold" text-anchor="middle">model-controlled</text>
<text x="223" y="220" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" font-weight="normal" text-anchor="middle" font-style="italic">The model decides to call</text>
<text x="50" y="270" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#6A4C93" font-weight="bold" text-anchor="start">Methods</text>
<text x="62" y="304" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" font-weight="normal" text-anchor="start">tools/list</text>
<text x="62" y="336" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" font-weight="normal" text-anchor="start">tools/call</text>
<text x="50" y="440" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#6A4C93" font-weight="bold" text-anchor="start">Example</text>
<text x="62" y="474" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" font-weight="normal" text-anchor="start">search_orders</text>
<text x="62" y="506" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" font-weight="normal" text-anchor="start">cancel_order</text>
<rect x="50" y="600" width="346" height="60" rx="10" fill="none" stroke="#100D12" stroke-width="2" stroke-dasharray="8 6"/>
<text x="223" y="637" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" font-weight="normal" text-anchor="middle">Result goes into the context</text>
<rect x="447" y="80" width="386" height="610" rx="10" fill="none" stroke="#6A4C93" stroke-width="3"/>
<rect x="447" y="80" width="386" height="52" rx="10" fill="#6A4C93" stroke="#6A4C93" stroke-width="2.5"/>
<text x="640" y="115" font-family="Helvetica, Arial, sans-serif" font-size="25" fill="#FFFFFF" font-weight="bold" text-anchor="middle">Resources</text>
<rect x="505" y="150" width="270" height="34" rx="17.0" fill="#1E6091" stroke="#1E6091" stroke-width="1"/>
<text x="640.0" y="174.0" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#FFFFFF" font-weight="bold" text-anchor="middle">application-driven</text>
<text x="640" y="220" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" font-weight="normal" text-anchor="middle" font-style="italic">The host decides what to attach</text>
<text x="467" y="270" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#6A4C93" font-weight="bold" text-anchor="start">Methods</text>
<text x="479" y="304" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" font-weight="normal" text-anchor="start">resources/list</text>
<text x="479" y="336" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" font-weight="normal" text-anchor="start">resources/templates/list</text>
<text x="479" y="368" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" font-weight="normal" text-anchor="start">resources/read</text>
<text x="479" y="400" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" font-weight="normal" text-anchor="start">subscriptions/listen</text>
<text x="467" y="442" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#6A4C93" font-weight="bold" text-anchor="start">Example</text>
<text x="479" y="476" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" font-weight="normal" text-anchor="start">orders://schema</text>
<text x="479" y="508" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" font-weight="normal" text-anchor="start">orders://customers/{id}/summary</text>
<rect x="467" y="600" width="346" height="60" rx="10" fill="none" stroke="#2D6A4F" stroke-width="2"/>
<text x="640" y="637" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" font-weight="normal" text-anchor="middle">Host picks, caches, refreshes</text>
<rect x="864" y="80" width="386" height="610" rx="10" fill="none" stroke="#6A4C93" stroke-width="3"/>
<rect x="864" y="80" width="386" height="52" rx="10" fill="#6A4C93" stroke="#6A4C93" stroke-width="2.5"/>
<text x="1057" y="115" font-family="Helvetica, Arial, sans-serif" font-size="25" fill="#FFFFFF" font-weight="bold" text-anchor="middle">Prompts</text>
<rect x="922" y="150" width="270" height="34" rx="17.0" fill="#1E6091" stroke="#1E6091" stroke-width="1"/>
<text x="1057.0" y="174.0" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#FFFFFF" font-weight="bold" text-anchor="middle">user-controlled</text>
<text x="1057" y="220" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" font-weight="normal" text-anchor="middle" font-style="italic">The user picks, for example /explain</text>
<text x="884" y="270" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#6A4C93" font-weight="bold" text-anchor="start">Methods</text>
<text x="896" y="304" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" font-weight="normal" text-anchor="start">prompts/list</text>
<text x="896" y="336" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" font-weight="normal" text-anchor="start">prompts/get</text>
<text x="896" y="368" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" font-weight="normal" text-anchor="start">completion/complete</text>
<text x="884" y="440" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#6A4C93" font-weight="bold" text-anchor="start">Example</text>
<text x="896" y="474" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" font-weight="normal" text-anchor="start">explain_order(order_id, audience)</text>
<rect x="884" y="600" width="346" height="60" rx="10" fill="none" stroke="#100D12" stroke-width="2" stroke-dasharray="8 6"/>
<text x="1057" y="637" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" font-weight="normal" text-anchor="middle">Messages enter the conversation</text>
<text x="640" y="735" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" font-weight="normal" text-anchor="middle" font-style="italic">The server writes all three. The colored label says who decides when each one is used.</text>
</svg>
