="3" marker-end="url(#aB8860B)" marker-start="url(#sB8860B)"/><text x="1056.0" y="258" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="normal" text-anchor="middle" fill="#B8860B">ITL 40</text><line x1="246.0" y1="232" x2="574.0" y2="232" stroke="#1E6091" stroke-width="3" marker-end="url(#a1E6091)" marker-start="url(#s1E6091)"/><text x="410.0" y="258" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="bold" text-anchor="middle" fill="#1E6091">TTFT 100</text><line x1="240.0" y1="282" x2="1124.0" y2="282" stroke="#100D12" stroke-width="2" stroke-dasharray="7,5" marker-end="url(#a100D12)" marker-start="url(#s100D12)"/><text x="1138.0" y="289" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="bold" text-anchor="start" fill="#100D12">E2E 260</text><text x="240.0" y="325" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#100D12">TPOT = (260 - 100) / (5 - 1) = 40.   Mean ITL = 40.   ITL and TPOT agree.</text><text x="30" y="472" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" text-anchor="start" fill="#100D12">Bundled</text><text x="30" y="500" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="normal" text-anchor="start" fill="#100D12">speculative decoding</text><line x1="240.0" y1="480" x2="1192.0" y2="480" stroke="#100D12" stroke-width="2"/><circle cx="240.0" cy="480" r="8" fill="#1E6091"/><text x="240.0" y="462" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="normal" text-anchor="middle" fill="#1E6091">send</text><rect x="571.0" y="430" width="18" height="22" rx="3" fill="#6A4C93" stroke="#6A4C93" stroke-width="2"/><line x1="580.0" y1="454" x2="580.0" y2="486" stroke="#6A4C93" stroke-width="3"/><text x="580.0" y="510" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="normal" text-anchor="middle" fill="#100D12">100</text><rect x="707.0" y="430" width="18" height="22" rx="3" fill="#6A4C93" stroke="#6A4C93" stroke-width="2"/><line x1="716.0" y1="454" x2="716.0" y2="486" stroke="#6A4C93" stroke-width="3"/><text x="716.0" y="510" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="normal" text-anchor="middle" fill="#100D12">140</text><line x1="586.0" y1="532" x2="710.0" y2="532" stroke="#B8860B" stroke-width="3" marker-end="url(#aB8860B)" marker-start="url(#sB8860B)"/><text x="648.0" y="558" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="normal" text-anchor="middle" fill="#B8860B">ITL 40</text><rect x="843.0" y="430" width="18" height="22" rx="3" fill="#6A4C93" stroke="#6A4C93" stroke-width="2"/><rect x="843.0" y="404" width="18" height="22" rx="3" fill="#6A4C93" stroke="#6A4C93" stroke-width="2"/><rect x="843.0" y="378" width="18" height="22" rx="3" fill="#6A4C93" stroke="#6A4C93" stroke-width="2"/><line x1="852.0" y1="454" x2="852.0" y2="486" stroke="#6A4C93" stroke-width="3"/><text x="852.0" y="510" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="normal" text-anchor="middle" fill="#100D12">180</text><line x1="722.0" y1="532" x2="846.0" y2="532" stroke="#B8860B" stroke-width="3" marker-end="url(#aB8860B)" marker-start="url(#sB8860B)"/><text x="784.0" y="558" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="normal" text-anchor="middle" fill="#B8860B">ITL 40</text><line x1="246.0" y1="532" x2="574.0" y2="532" stroke="#1E6091" stroke-width="3" marker-end="url(#a1E6091)" marker-start="url(#s1E6091)"/><text x="410.0" y="558" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="bold" text-anchor="middle" fill="#1E6091">TTFT 100</text><line x1="240.0" y1="582" x2="852.0" y2="582" stroke="#100D12" stroke-width="2" stroke-dasharray="7,5" marker-end="url(#a100D12)" marker-start="url(#s100D12)"/><text x="866.0" y="589" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="bold" text-anchor="start" fill="#100D12">E2E 180</text><text x="240.0" y="625" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#C81D25">TPOT = (180 - 100) / (5 - 1) = 20.   Mean ITL = 40.   ITL and TPOT disagree.</text><text x="640" y="700" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" text-anchor="middle" fill="#100D12">Times in ms, measured at the client. Purple squares are output tokens. Both requests return 5 tokens.</text></svg>