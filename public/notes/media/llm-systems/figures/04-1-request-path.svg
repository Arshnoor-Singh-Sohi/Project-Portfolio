<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 760" width="1280" height="760"><defs><marker id="a1E6091" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E6091"/></marker><marker id="s1E6091" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E6091"/></marker><marker id="aB8860B" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B8860B"/></marker><marker id="sB8860B" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B8860B"/></marker><marker id="a6A4C93" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6A4C93"/></marker><marker id="s6A4C93" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6A4C93"/></marker><marker id="a2D6A4F" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2D6A4F"/></marker><marker id="s2D6A4F" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2D6A4F"/></marker><marker id="aC81D25" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C81D25"/></marker><marker id="sC81D25" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C81D25"/></marker><marker id="a8A8A8A" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A8A8A"/></marker><marker id="s8A8A8A" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A8A8A"/></marker><marker id="a100D12" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#100D12"/></marker><marker id="s100D12" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#100D12"/></marker></defs><rect x="0" y="0" width="1280" height="760" fill="#FFFFFF"/><text x="640.0" y="44" font-family="Helvetica, Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="middle" fill="#100D12">The path of one chat request through a vLLM server</text><rect x="30" y="120" width="200" height="150" rx="6" fill="none" stroke="#1E6091" stroke-width="3"/><text x="130" y="160" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#1E6091">Client</text><text x="130" y="195" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" text-anchor="middle" fill="#100D12">HTTP POST</text><text x="130" y="222" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" text-anchor="middle" fill="#100D12">/v1/chat/</text><text x="130" y="248" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" text-anchor="middle" fill="#100D12">completions</text><rect x="270" y="120" width="210" height="150" rx="6" fill="none" stroke="#100D12" stroke-width="2"/><text x="375" y="160" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#100D12">Gateway</text><text x="375" y="195" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" text-anchor="middle" fill="#100D12">TLS, API key,</text><text x="375" y="222" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" text-anchor="middle" fill="#100D12">rate limit,</text><text x="375" y="248" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" text-anchor="middle" fill="#100D12">pick a replica</text><rect x="520" y="100" width="330" height="290" rx="6" fill="none" stroke="#6A4C93" stroke-width="3"/><text x="685" y="138" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#6A4C93">API server process</text><text x="540" y="180" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#100D12">1. validate the JSON body</text><text x="540" y="214" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#100D12">2. apply the chat template</text><text x="540" y="248" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#100D12">3. tokenize: text to IDs</text><text x="540" y="282" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#100D12">7. detokenize incrementally</text><text x="540" y="316" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#100D12">8. check stop strings</text><text x="540" y="350" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#100D12">9. send SSE chunks</text><rect x="900" y="100" width="350" height="290" rx="6" fill="none" stroke="#100D12" stroke-width="3"/><text x="1075" y="138" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#100D12">Engine core process</text><text x="920" y="180" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#100D12">4. waiting queue</text><text x="920" y="214" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#100D12">5. scheduler: token budget,</text><text x="945" y="244" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#100D12">admit, preempt</text><rect x="920" y="270" width="310" height="100" rx="6" fill="none" stroke="#2D6A4F" stroke-width="3"/><text x="1075" y="305" font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="bold" text-anchor="middle" fill="#2D6A4F">KV cache manager</text><text x="1075" y="337" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" text-anchor="middle" fill="#2D6A4F">blocks of 16 tokens</text><text x="1075" y="361" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" text-anchor="middle" fill="#2D6A4F">prefix cache lookup</text><rect x="900" y="470" width="350" height="200" rx="6" fill="none" stroke="#B8860B" stroke-width="3"/><text x="1075" y="508" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#B8860B">GPU worker process</text><text x="920" y="548" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#100D12">6. one forward pass:</text><text x="945" y="580" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#100D12">embeddings, 32 layers,</text><text x="945" y="610" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#100D12">LM head, logits,</text><text x="945" y="640" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#100D12">sampler, token IDs</text><line x1="230" y1="175" x2="268" y2="175" stroke="#1E6091" stroke-width="3" marker-end="url(#a1E6091)"/><line x1="480" y1="175" x2="518" y2="175" stroke="#1E6091" stroke-width="3" marker-end="url(#a1E6091)"/><line x1="850" y1="200" x2="898" y2="200" stroke="#100D12" stroke-width="3" marker-end="url(#a100D12)"/><line x1="898" y1="300" x2="852" y2="300" stroke="#100D12" stroke-width="3" marker-end="url(#a100D12)"/><text x="875" y="255" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#100D12">ZMQ</text><line x1="1050" y1="390" x2="1050" y2="468" stroke="#100D12" stroke-width="3" marker-end="url(#a100D12)"/><line x1="1110" y1="468" x2="1110" y2="392" stroke="#100D12" stroke-width="3" marker-end="url(#a100D12)"/><text x="1040" y="435" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" text-anchor="end" fill="#100D12">batch</text><text x="1122" y="435" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#100D12">token IDs</text><polyline points="685,390 685,560 130,560 130,274" fill="none" stroke="#6A4C93" stroke-width="3"/><line x1="130" y1="300" x2="130" y2="274" stroke="#6A4C93" stroke-width="3" marker-end="url(#a6A4C93)"/><text x="410" y="595" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" text-anchor="middle" fill="#6A4C93">SSE stream back through the gateway: data: {...} chunks, then data: [DONE]</text><text x="40" y="690" font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="normal" text-anchor="start" fill="#100D12">Steps 5 to 9 repeat once per generated token until a stop condition fires.</text><text x="40" y="724" font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="normal" text-anchor="start" fill="#100D12">One engine core owns the scheduler and the KV cache. Each GPU has its own worker process.</text></svg>