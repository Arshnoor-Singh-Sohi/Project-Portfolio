<text x="40" y="735" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#100D12" font-weight="normal" text-anchor="start">Each layer computes its own k4 and v4 from its own input,</text>
<text x="40" y="765" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#100D12" font-weight="normal" text-anchor="start">so a decode step writes one new slot in all L layers.</text>
