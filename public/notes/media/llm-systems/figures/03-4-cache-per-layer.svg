<text x="744" y="294" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#100D12" font-weight="normal" text-anchor="start">Toy model: [1, 1, 4, 2]</text>
<text x="744" y="327" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#100D12" font-weight="normal" text-anchor="start">Llama-3.1-8B: [B, 8, T, 128], BF16</text>
<text x="744" y="393" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#100D12" font-weight="bold" text-anchor="start">One token, one layer:</text>
<text x="744" y="426" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#100D12" font-weight="normal" text-anchor="start">2 x 8 x 128 x 2 bytes = 4,096 B</text>
<text x="744" y="459" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#100D12" font-weight="normal" text-anchor="start">One token, 32 layers: 128 KiB</text>
<text x="744" y="525" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#1E6091" font-weight="bold" text-anchor="start">Append = write along T (axis 2)</text>
<text x="744" y="558" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#B8860B" font-weight="normal" text-anchor="start">Keys are stored after RoPE</text>
<text x="744" y="591" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#6A4C93" font-weight="normal" text-anchor="start">Values have no RoPE</text></svg>
