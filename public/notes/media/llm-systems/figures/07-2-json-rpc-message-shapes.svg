<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 740" width="1280" height="740"><defs><marker id="a1E6091" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E6091"/></marker><marker id="s1E6091" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E6091"/></marker><marker id="aB8860B" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B8860B"/></marker><marker id="sB8860B" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B8860B"/></marker><marker id="a6A4C93" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6A4C93"/></marker><marker id="s6A4C93" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6A4C93"/></marker><marker id="a2D6A4F" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2D6A4F"/></marker><marker id="s2D6A4F" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2D6A4F"/></marker><marker id="aC81D25" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C81D25"/></marker><marker id="sC81D25" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C81D25"/></marker><marker id="a8A8A8A" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A8A8A"/></marker><marker id="s8A8A8A" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A8A8A"/></marker><marker id="a100D12" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#100D12"/></marker><marker id="s100D12" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#100D12"/></marker></defs><rect x="0" y="0" width="1280" height="740" fill="#FFFFFF"/>
<text x="640.0" y="44.0" font-family="Helvetica, Arial, sans-serif" font-size="28" font-weight="bold" fill="#100D12" text-anchor="middle">The four JSON-RPC 2.0 message shapes in MCP</text>
<rect x="40" y="90" width="560" height="250" rx="12" fill="#1E6091" fill-opacity="0.07" stroke="#1E6091" stroke-width="2.5"/>
<text x="60" y="126.0" font-family="Helvetica, Arial, sans-serif" font-size="23" font-weight="bold" fill="#1E6091" text-anchor="start">Request (expects one response)</text>
<text x="64" y="164.0" font-family="Menlo, Consolas, 'Courier New', monospace" font-size="19" font-weight="normal" fill="#100D12" text-anchor="start" xml:space="preserve">{"jsonrpc": "2.0",</text>
<text x="64" y="191.0" font-family="Menlo, Consolas, 'Courier New', monospace" font-size="19" font-weight="normal" fill="#100D12" text-anchor="start" xml:space="preserve"> "id": 3,</text>
<text x="64" y="218.0" font-family="Menlo, Consolas, 'Courier New', monospace" font-size="19" font-weight="normal" fill="#100D12" text-anchor="start" xml:space="preserve"> "method": "tools/call",</text>
<text x="64" y="245.0" font-family="Menlo, Consolas, 'Courier New', monospace" font-size="19" font-weight="normal" fill="#100D12" text-anchor="start" xml:space="preserve"> "params": {"name": "count_orders", ...}}</text>
<text x="60" y="322.0" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="normal" fill="#1E6091" text-anchor="start">id: a string or an integer, never null</text>
<rect x="700" y="90" width="540" height="220" rx="12" fill="#6A4C93" fill-opacity="0.07" stroke="#6A4C93" stroke-width="2.5"/>
<text x="720" y="126.0" font-family="Helvetica, Arial, sans-serif" font-size="23" font-weight="bold" fill="#6A4C93" text-anchor="start">Result response</text>
<text x="724" y="164.0" font-family="Menlo, Consolas, 'Courier New', monospace" font-size="19" font-weight="normal" fill="#100D12" text-anchor="start" xml:space="preserve">{"jsonrpc": "2.0",</text>
<text x="724" y="191.0" font-family="Menlo, Consolas, 'Courier New', monospace" font-size="19" font-weight="normal" fill="#100D12" text-anchor="start" xml:space="preserve"> "id": 3,</text>
<text x="724" y="218.0" font-family="Menlo, Consolas, 'Courier New', monospace" font-size="19" font-weight="normal" fill="#100D12" text-anchor="start" xml:space="preserve"> "result": {"resultType": "complete",</text>
<text x="724" y="245.0" font-family="Menlo, Consolas, 'Courier New', monospace" font-size="19" font-weight="normal" fill="#100D12" text-anchor="start" xml:space="preserve">            "content": [...]}}</text>
<text x="720" y="292.0" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="normal" fill="#6A4C93" text-anchor="start">same id as the request</text>
<rect x="700" y="345" width="540" height="250" rx="12" fill="#C81D25" fill-opacity="0.07" stroke="#C81D25" stroke-width="2.5"/>
<text x="720" y="381.0" font-family="Helvetica, Arial, sans-serif" font-size="23" font-weight="bold" fill="#C81D25" text-anchor="start">Error response</text>
<text x="724" y="419.0" font-family="Menlo, Consolas, 'Courier New', monospace" font-size="19" font-weight="normal" fill="#100D12" text-anchor="start" xml:space="preserve">{"jsonrpc": "2.0",</text>
<text x="724" y="446.0" font-family="Menlo, Consolas, 'Courier New', monospace" font-size="19" font-weight="normal" fill="#100D12" text-anchor="start" xml:space="preserve"> "id": 3,</text>
<text x="724" y="473.0" font-family="Menlo, Consolas, 'Courier New', monospace" font-size="19" font-weight="normal" fill="#100D12" text-anchor="start" xml:space="preserve"> "error": {"code": -32601,</text>
<text x="724" y="500.0" font-family="Menlo, Consolas, 'Courier New', monospace" font-size="19" font-weight="normal" fill="#100D12" text-anchor="start" xml:space="preserve">           "message": "Method not found",</text>
<text x="724" y="527.0" font-family="Menlo, Consolas, 'Courier New', monospace" font-size="19" font-weight="normal" fill="#100D12" text-anchor="start" xml:space="preserve">           "data": "tools/call"}}</text>
<text x="720" y="577.0" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="normal" fill="#C81D25" text-anchor="start">integer code, short message, optional data</text>
<rect x="40" y="400" width="560" height="230" rx="12" fill="none" fill-opacity="0.07" stroke="#100D12" stroke-width="2.5" stroke-dasharray="9 6"/>
<text x="60" y="436.0" font-family="Helvetica, Arial, sans-serif" font-size="23" font-weight="bold" fill="#100D12" text-anchor="start">Notification (no id)</text>
<text x="64" y="474.0" font-family="Menlo, Consolas, 'Courier New', monospace" font-size="19" font-weight="normal" fill="#100D12" text-anchor="start" xml:space="preserve">{"jsonrpc": "2.0",</text>
<text x="64" y="501.0" font-family="Menlo, Consolas, 'Courier New', monospace" font-size="19" font-weight="normal" fill="#100D12" text-anchor="start" xml:space="preserve"> "method": "notifications/cancelled",</text>
<text x="64" y="528.0" font-family="Menlo, Consolas, 'Courier New', monospace" font-size="19" font-weight="normal" fill="#100D12" text-anchor="start" xml:space="preserve"> "params": {"requestId": 3}}</text>
<text x="60" y="612.0" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="normal" fill="#100D12" text-anchor="start">the receiver MUST NOT reply</text>
<line x1="602" y1="190" x2="696" y2="190" stroke="#6A4C93" stroke-width="2.5" marker-end="url(#a6A4C93)"/>
<text x="649" y="178.0" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="normal" fill="#100D12" text-anchor="middle">or</text>
<line x1="602" y1="260" x2="696" y2="440" stroke="#C81D25" stroke-width="2.5" marker-end="url(#aC81D25)"/>
<text x="640" y="380.0" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="normal" fill="#100D12" text-anchor="middle">or</text>
<line x1="602" y1="560" x2="628" y2="560" stroke="#8A8A8A" stroke-width="2.5" stroke-dasharray="9 6"/>
<line x1="635" y1="547" x2="661" y2="573" stroke="#C81D25" stroke-width="5"/>
<line x1="635" y1="573" x2="661" y2="547" stroke="#C81D25" stroke-width="5"/>
<text x="648" y="600.0" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="normal" fill="#C81D25" text-anchor="middle">no reply</text>
<text x="640" y="690.0" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" fill="#100D12" text-anchor="middle">A response carries exactly one of result and error, and the id of its request.</text>
<text x="640" y="720.0" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" fill="#100D12" text-anchor="middle">Responses can arrive in any order, so the client matches them by id.</text></svg>
