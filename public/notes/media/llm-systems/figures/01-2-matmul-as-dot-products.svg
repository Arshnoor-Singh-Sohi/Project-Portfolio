<text x="724" y="436" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#1E6091" text-anchor="middle" font-weight="bold">Q: 3 × 2</text>
<text x="724" y="466" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" text-anchor="middle" font-weight="normal">one query per token</text>
<text x="836" y="200" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#100D12" text-anchor="start" font-weight="bold">Entry (cat, col 2):</text>
<text x="836" y="234" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#1E6091" text-anchor="start" font-weight="normal">row cat · column 2</text>
<text x="836" y="268" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#100D12" text-anchor="start" font-weight="normal">= 0·0 + 1·1 + 0·1 + 1·0</text>
<text x="836" y="302" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#1E6091" text-anchor="start" font-weight="bold">= 1</text>
<text x="836" y="360" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#100D12" text-anchor="start" font-weight="bold">Shape rule:</text>
<text x="836" y="394" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#100D12" text-anchor="start" font-weight="normal">(3 × 4)(4 × 2) = (3 × 2)</text>
<text x="836" y="428" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" text-anchor="start" font-weight="normal">the inner sizes (4 and 4)</text>
<text x="836" y="454" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" text-anchor="start" font-weight="normal">must match and disappear</text>
<rect x="60" y="560" width="1160" height="130" fill="#FFFFFF" stroke="#100D12" stroke-width="2" rx="8"/>
<text x="84" y="598" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#100D12" text-anchor="start" font-weight="normal">Cost: 3 × 2 = 6 entries, each a dot product of length 4 (4 multiplications, 3 additions).</text>
<text x="84" y="632" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#100D12" text-anchor="start" font-weight="normal">Exact count: 6 × 7 = 42 operations. The rule 2mkn gives 2 × 3 × 4 × 2 = 48 FLOPs.</text>
<text x="84" y="666" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#100D12" text-anchor="start" font-weight="bold">In general, (m × k)(k × n) needs m·n dot products of length k: about 2mkn FLOPs.</text>
</svg>
