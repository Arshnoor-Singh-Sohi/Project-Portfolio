<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="580" viewBox="0 0 1280 580">
<rect x="0" y="0" width="1280" height="580" fill="#FFFFFF"/>
<defs><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E6091"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B8860B"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6A4C93"/></marker><marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2D6A4F"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C81D25"/></marker><marker id="agy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A8A8A"/></marker><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#100D12"/></marker></defs>
<text x="640.0" y="46" font-family="Helvetica, Arial, sans-serif" font-size="28" fill="#100D12" font-weight="bold" text-anchor="middle">From a GPU price per hour to a price per million tokens</text>
<rect x="30" y="110" width="260" height="110" rx="10" fill="#FFFFFF" stroke="#B8860B" stroke-width="3"/>
<text x="160" y="152" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#100D12" font-weight="bold" text-anchor="middle">8-GPU H100 VM</text>
<text x="160" y="190" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#100D12" font-weight="normal" text-anchor="middle">USD 98.32 per hour</text>
<rect x="350" y="110" width="260" height="110" rx="10" fill="#FFFFFF" stroke="#100D12" stroke-width="3"/>
<text x="480" y="152" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#100D12" font-weight="bold" text-anchor="middle">per second</text>
<text x="480" y="190" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#100D12" font-weight="normal" text-anchor="middle">USD 0.02731</text>
<rect x="670" y="110" width="260" height="110" rx="10" fill="#FFFFFF" stroke="#100D12" stroke-width="3"/>
<text x="800" y="152" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#100D12" font-weight="bold" text-anchor="middle">per token</text>
<text x="800" y="190" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#100D12" font-weight="normal" text-anchor="middle">USD 0.000002731</text>
<rect x="990" y="110" width="260" height="110" rx="10" fill="#FFFFFF" stroke="#1E6091" stroke-width="3"/>
<text x="1120" y="152" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#1E6091" font-weight="bold" text-anchor="middle">per million tokens</text>
<text x="1120" y="190" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#1E6091" font-weight="normal" text-anchor="middle">USD 2.73</text>
<line x1="294" y1="165" x2="346" y2="165" stroke="#100D12" stroke-width="3" marker-end="url(#ak)"/>
<text x="320.0" y="252" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#100D12" font-weight="normal" text-anchor="middle">divide by 3,600 s</text>
<line x1="614" y1="165" x2="666" y2="165" stroke="#100D12" stroke-width="3" marker-end="url(#ak)"/>
<text x="640.0" y="252" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#100D12" font-weight="normal" text-anchor="middle">divide by 10,000 tokens/s</text>
<line x1="934" y1="165" x2="986" y2="165" stroke="#100D12" stroke-width="3" marker-end="url(#ak)"/>
<text x="960.0" y="252" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#100D12" font-weight="normal" text-anchor="middle">multiply by 1,000,000</text>
<text x="640" y="300" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#100D12" font-weight="bold" text-anchor="middle">USD per MTok = USD per hour / (tokens per second x 3,600) x 1,000,000</text>
<text x="30" y="360" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#100D12" font-weight="bold" text-anchor="start">What moves the price per token (Llama-3.1-8B on one H100, bandwidth bound):</text>
<rect x="30" y="385" width="290" height="160" rx="10" fill="#FFFFFF" stroke="#1E6091" stroke-width="2"/>
<text x="46" y="422" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#1E6091" font-weight="bold" text-anchor="start">Batch size</text>
<text x="46" y="462" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#100D12" font-weight="normal" text-anchor="start">B = 1 to 128:</text>
<text x="46" y="486" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#100D12" font-weight="normal" text-anchor="start">41 times cheaper,</text>
<text x="46" y="510" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#100D12" font-weight="normal" text-anchor="start">TPOT 3.1 times longer</text>
<rect x="340" y="385" width="290" height="160" rx="10" fill="#FFFFFF" stroke="#C81D25" stroke-width="2"/>
<text x="356" y="422" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#C81D25" font-weight="bold" text-anchor="start">Context length</text>
<text x="356" y="462" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#100D12" font-weight="normal" text-anchor="start">2,048 to 32,768 tokens:</text>
<text x="356" y="486" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#100D12" font-weight="normal" text-anchor="start">about 10.6 times</text>
<text x="356" y="510" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#100D12" font-weight="normal" text-anchor="start">more per output token</text>
<rect x="650" y="385" width="290" height="160" rx="10" fill="#FFFFFF" stroke="#C81D25" stroke-width="2"/>
<text x="666" y="422" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#C81D25" font-weight="bold" text-anchor="start">Utilization u</text>
<text x="666" y="462" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#100D12" font-weight="normal" text-anchor="start">divide by u:</text>
<text x="666" y="486" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#100D12" font-weight="normal" text-anchor="start">u = 0.442 gives</text>
<text x="666" y="510" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#100D12" font-weight="normal" text-anchor="start">2.26 times the cost</text>
<rect x="960" y="385" width="290" height="160" rx="10" fill="#FFFFFF" stroke="#100D12" stroke-width="2"/>
<text x="976" y="422" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#100D12" font-weight="bold" text-anchor="start">Output vs input</text>
<text x="976" y="462" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#100D12" font-weight="normal" text-anchor="start">an output token uses</text>
<text x="976" y="486" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#100D12" font-weight="normal" text-anchor="start">about 9.5 times the GPU</text>
<text x="976" y="510" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#100D12" font-weight="normal" text-anchor="start">time of an input token</text>
</svg>
