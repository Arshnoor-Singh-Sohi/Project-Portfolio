<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 780" width="1280" height="780" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="A safe layout: the editable agent inside a sandbox, and the evaluator, hidden tests, budget, logs and human review outside it" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>A safe layout: the editable agent inside a sandbox, and the evaluator, hidden tests, budget, logs and human review outside it</title><defs><marker id="ah1E6091" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E6091"/></marker><marker id="ahB8860B" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B8860B"/></marker><marker id="ah6A4C93" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6A4C93"/></marker><marker id="ah2D6A4F" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2D6A4F"/></marker><marker id="ah8A8A8A" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A8A8A"/></marker><marker id="ah2A9D8F" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2A9D8F"/></marker><marker id="ahC81D25" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C81D25"/></marker><marker id="ah100D12" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#100D12"/></marker></defs><rect x="0" y="0" width="1280" height="780" rx="16" fill="#ffffff"/><text x="640.0" y="52" font-size="32" font-weight="700" fill="#100D12" text-anchor="middle">Keep the judge outside the box</text><text x="640.0" y="88" font-size="21" font-weight="400" fill="#444444" text-anchor="middle">The agent may change everything inside the sandbox and nothing outside it.</text><rect x="40" y="130" width="560" height="560" rx="16" fill="#F4F8FB" stroke="#C81D25" stroke-width="3" stroke-dasharray="12 8"/><text x="320.0" y="170" font-size="24" font-weight="700" fill="#C81D25" text-anchor="middle">Sandbox: the editable agent</text><rect x="80" y="210" width="230" height="86" rx="12" fill="#1E6091"/><text x="195.0" y="260.7" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">Agent code</text><rect x="330" y="210" width="230" height="86" rx="12" fill="#1E6091"/><text x="445.0" y="260.7" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">Tools</text><rect x="80" y="320" width="230" height="86" rx="12" fill="#1E6091"/><text x="195.0" y="370.7" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">Prompts</text><rect x="330" y="320" width="230" height="86" rx="12" fill="#2D6A4F"/><text x="445.0" y="370.7" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">Memory files</text><text x="320.0" y="460" font-size="20" font-weight="400" fill="#100D12" text-anchor="middle">No network, limited CPU and memory,</text><text x="320.0" y="488" font-size="20" font-weight="400" fill="#100D12" text-anchor="middle">no secrets, no write access</text><text x="320.0" y="516" font-size="20" font-weight="400" fill="#100D12" text-anchor="middle">to anything outside.</text><rect x="145" y="570" width="350" height="90" rx="12" fill="#1E6091"/><text x="320.0" y="609.0" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">Candidate version</text><text x="320.0" y="635.0" font-size="19" font-weight="400" fill="#ffffff" text-anchor="middle">code and outputs</text><rect x="700" y="130" width="540" height="92" rx="12" fill="#100D12"/><text x="970.0" y="170.0" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">Budget and time limits</text><text x="970.0" y="196.0" font-size="19" font-weight="400" fill="#ffffff" text-anchor="middle">enforced outside the process</text><rect x="700" y="242" width="540" height="92" rx="12" fill="#6A4C93"/><text x="970.0" y="282.0" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">Outer loop and acceptance rule</text><text x="970.0" y="308.0" font-size="19" font-weight="400" fill="#ffffff" text-anchor="middle">decides what is kept</text><rect x="700" y="354" width="540" height="92" rx="12" fill="#2D6A4F"/><text x="970.0" y="394.0" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">Attempt log and lineage</text><text x="970.0" y="420.0" font-size="19" font-weight="400" fill="#ffffff" text-anchor="middle">append-only record</text><rect x="700" y="466" width="540" height="92" rx="12" fill="#5E5E66"/><text x="970.0" y="506.0" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">Human review</text><text x="970.0" y="532.0" font-size="19" font-weight="400" fill="#ffffff" text-anchor="middle">before any deployment</text><rect x="700" y="578" width="540" height="92" rx="12" fill="#B8860B"/><text x="970.0" y="618.0" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">Evaluator and hidden tests</text><text x="970.0" y="644.0" font-size="19" font-weight="400" fill="#ffffff" text-anchor="middle">read-only for the agent</text><line x1="696" y1="176" x2="608" y2="176" stroke="#C81D25" stroke-width="3" marker-end="url(#ahC81D25)"/><rect x="624.92" y="150" width="50.160000000000004" height="26" rx="6" fill="#ffffff"/><text x="650" y="166" font-size="18" font-weight="400" fill="#C81D25" text-anchor="middle">stop</text><line x1="499" y1="624" x2="692" y2="624" stroke="#100D12" stroke-width="3" marker-end="url(#ah100D12)"/><rect x="586.76" y="596" width="126.48" height="26" rx="6" fill="#ffffff"/><text x="650" y="612" font-size="18" font-weight="400" fill="#100D12" text-anchor="middle">outputs only</text><text x="640.0" y="750" font-size="19" font-weight="400" fill="#444444" text-anchor="middle">Example: the DGM keeps its outer loop and scoring code out of the image that the agent edits.</text></svg>
