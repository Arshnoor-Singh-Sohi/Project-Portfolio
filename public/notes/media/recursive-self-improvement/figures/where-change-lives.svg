<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 850" width="1280" height="850" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="Where a change can live, from the weights to the improver, against when it happens, from training time to inside a task" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>Where a change can live, from the weights to the improver, against when it happens, from training time to inside a task</title><defs><marker id="ah1E6091" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E6091"/></marker><marker id="ahB8860B" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B8860B"/></marker><marker id="ah6A4C93" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6A4C93"/></marker><marker id="ah2D6A4F" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2D6A4F"/></marker><marker id="ah8A8A8A" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A8A8A"/></marker><marker id="ah2A9D8F" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2A9D8F"/></marker><marker id="ahC81D25" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C81D25"/></marker><marker id="ah100D12" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#100D12"/></marker></defs><rect x="0" y="0" width="1280" height="850" rx="16" fill="#ffffff"/><text x="640.0" y="52" font-size="32" font-weight="700" fill="#100D12" text-anchor="middle">Where a change lives, and when it happens</text><text x="640.0" y="88" font-size="21" font-weight="400" fill="#444444" text-anchor="middle">Ask two separate questions: where is the change stored, and does it stay?</text><rect x="284" y="125" width="317" height="76" rx="12" fill="#B8860B"/><text x="442.5" y="159" font-size="23" font-weight="700" fill="#ffffff" text-anchor="middle">Training time</text><text x="442.5" y="187" font-size="19" font-weight="400" fill="#ffffff" text-anchor="middle">a separate phase before use</text><rect x="609" y="125" width="317" height="76" rx="12" fill="#B8860B"/><text x="767.5" y="159" font-size="23" font-weight="700" fill="#ffffff" text-anchor="middle">Between tasks</text><text x="767.5" y="187" font-size="19" font-weight="400" fill="#ffffff" text-anchor="middle">kept for the next task</text><rect x="934" y="125" width="317" height="76" rx="12" fill="#B8860B"/><text x="1092.5" y="159" font-size="23" font-weight="700" fill="#ffffff" text-anchor="middle">Inside a task</text><text x="1092.5" y="187" font-size="19" font-weight="400" fill="#ffffff" text-anchor="middle">lives for one episode</text><rect x="30" y="211" width="242" height="128" rx="12" fill="#1E6091"/><text x="151.0" y="283.0" font-size="23" font-weight="700" fill="#ffffff" text-anchor="middle">Weights</text><rect x="284" y="211" width="317" height="128" rx="12" fill="#F7F7F9" stroke="#C8C8D0" stroke-width="1.5"/><text x="442.5" y="269.0" font-size="20" font-weight="400" fill="#100D12" text-anchor="middle">STaR, Self-Rewarding LMs,</text><text x="442.5" y="295.0" font-size="20" font-weight="400" fill="#100D12" text-anchor="middle">AlphaGo Zero</text><rect x="609" y="211" width="317" height="128" rx="12" fill="#F7F7F9" stroke="#C8C8D0" stroke-width="1.5"/><text x="767.5" y="269.0" font-size="20" font-weight="400" fill="#100D12" text-anchor="middle">SEAL: self-edits applied</text><text x="767.5" y="295.0" font-size="20" font-weight="400" fill="#100D12" text-anchor="middle">as weight updates</text><rect x="934" y="211" width="317" height="128" rx="12" fill="#F7F7F9" stroke="#C8C8D0" stroke-width="1.5"/><text x="1092.5" y="269.0" font-size="20" font-weight="400" fill="#100D12" text-anchor="middle">Test-time training,</text><text x="1092.5" y="295.0" font-size="20" font-weight="400" fill="#100D12" text-anchor="middle">then discarded</text><rect x="30" y="347" width="242" height="128" rx="12" fill="#2D6A4F"/><text x="151.0" y="405.0" font-size="23" font-weight="700" fill="#ffffff" text-anchor="middle">Memory and</text><text x="151.0" y="435.0" font-size="23" font-weight="700" fill="#ffffff" text-anchor="middle">context</text><rect x="284" y="347" width="317" height="128" rx="12" fill="#F7F7F9" stroke="#C8C8D0" stroke-width="1.5"/><text x="442.5" y="405.0" font-size="20" font-weight="400" fill="#100D12" text-anchor="middle">DSPy compiles</text><text x="442.5" y="431.0" font-size="20" font-weight="400" fill="#100D12" text-anchor="middle">demonstrations before use</text><rect x="609" y="347" width="317" height="128" rx="12" fill="#F7F7F9" stroke="#C8C8D0" stroke-width="1.5"/><text x="767.5" y="405.0" font-size="20" font-weight="400" fill="#100D12" text-anchor="middle">ExpeL rules,</text><text x="767.5" y="431.0" font-size="20" font-weight="400" fill="#100D12" text-anchor="middle">Reflexion notes</text><rect x="934" y="347" width="317" height="128" rx="12" fill="#F7F7F9" stroke="#C8C8D0" stroke-width="1.5"/><text x="1092.5" y="418.0" font-size="20" font-weight="400" fill="#100D12" text-anchor="middle">Self-Refine, CRITIC</text><rect x="30" y="483" width="242" height="128" rx="12" fill="#3A7CA5"/><text x="151.0" y="555.0" font-size="23" font-weight="700" fill="#ffffff" text-anchor="middle">Code and tools</text><rect x="284" y="483" width="317" height="128" rx="12" fill="#F7F7F9" stroke="#C8C8D0" stroke-width="1.5"/><text x="442.5" y="541.0" font-size="20" font-weight="400" fill="#100D12" text-anchor="middle">ADAS designs agents</text><text x="442.5" y="567.0" font-size="20" font-weight="400" fill="#100D12" text-anchor="middle">in a search phase</text><rect x="609" y="483" width="317" height="128" rx="12" fill="#F7F7F9" stroke="#C8C8D0" stroke-width="1.5"/><text x="767.5" y="541.0" font-size="20" font-weight="400" fill="#100D12" text-anchor="middle">Voyager skills,</text><text x="767.5" y="567.0" font-size="20" font-weight="400" fill="#100D12" text-anchor="middle">SICA, the DGM</text><rect x="934" y="483" width="317" height="128" rx="12" fill="#F7F7F9" stroke="#C8C8D0" stroke-width="1.5"/><text x="1092.5" y="541.0" font-size="20" font-weight="400" fill="#100D12" text-anchor="middle">Live-SWE-agent edits</text><text x="1092.5" y="567.0" font-size="20" font-weight="400" fill="#100D12" text-anchor="middle">its scaffold mid-task</text><rect x="30" y="619" width="242" height="128" rx="12" fill="#6A4C93"/><text x="151.0" y="691.0" font-size="23" font-weight="700" fill="#ffffff" text-anchor="middle">The improver</text><rect x="284" y="619" width="317" height="128" rx="12" fill="#F7F7F9" stroke="#C8C8D0" stroke-width="1.5"/><text x="442.5" y="677.0" font-size="20" font-weight="400" fill="#100D12" text-anchor="middle">Self-Rewarding&#x27;s judge,</text><text x="442.5" y="703.0" font-size="20" font-weight="400" fill="#100D12" text-anchor="middle">inside the weights</text><rect x="609" y="619" width="317" height="128" rx="12" fill="#F7F7F9" stroke="#C8C8D0" stroke-width="1.5"/><text x="767.5" y="677.0" font-size="20" font-weight="400" fill="#100D12" text-anchor="middle">STOP, Promptbreeder&#x27;s</text><text x="767.5" y="703.0" font-size="20" font-weight="400" fill="#100D12" text-anchor="middle">mutation-prompts</text><rect x="934" y="619" width="317" height="128" rx="12" fill="#F7F7F9" stroke="#C8C8D0" stroke-width="1.5"/><text x="1092.5" y="677.0" font-size="20" font-weight="400" fill="#100D12" text-anchor="middle">Gödel Agent rewrites</text><text x="1092.5" y="703.0" font-size="20" font-weight="400" fill="#100D12" text-anchor="middle">its own loop as it runs</text><text x="640.0" y="779" font-size="20" font-weight="400" fill="#C81D25" text-anchor="middle">Location is not persistence: test-time training changes the weights for one task, then discards the change.</text><text x="640.0" y="811" font-size="19" font-weight="400" fill="#444444" text-anchor="middle">Examples from Part 2, Lesson 3. The improver row holds systems whose improvement process itself changes.</text></svg>
