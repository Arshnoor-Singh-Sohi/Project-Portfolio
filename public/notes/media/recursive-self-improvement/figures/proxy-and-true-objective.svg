<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 700" width="1280" height="700" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="The measured score overlaps only partly with the real objective, and an optimizer pushes into the region where they differ" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>The measured score overlaps only partly with the real objective, and an optimizer pushes into the region where they differ</title><defs><marker id="ah1E6091" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E6091"/></marker><marker id="ahB8860B" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B8860B"/></marker><marker id="ah6A4C93" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6A4C93"/></marker><marker id="ah2D6A4F" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2D6A4F"/></marker><marker id="ah8A8A8A" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A8A8A"/></marker><marker id="ah2A9D8F" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2A9D8F"/></marker><marker id="ahC81D25" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C81D25"/></marker><marker id="ah100D12" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#100D12"/></marker></defs><rect x="0" y="0" width="1280" height="700" rx="16" fill="#ffffff"/><text x="640.0" y="52" font-size="32" font-weight="700" fill="#100D12" text-anchor="middle">The score is a proxy for what we want</text><text x="640.0" y="88" font-size="21" font-weight="400" fill="#444444" text-anchor="middle">Optimization raises the score. Only part of that rise is real.</text><ellipse cx="640" cy="390" rx="300" ry="200" fill="#B8860B" fill-opacity="0.16" stroke="#B8860B" stroke-width="4"/><ellipse cx="900" cy="390" rx="300" ry="200" fill="#8A8A8A" fill-opacity="0.16" stroke="#8A8A8A" stroke-width="4"/><text x="520" y="175" font-size="22" font-weight="700" fill="#B8860B" text-anchor="middle">What the score measures (proxy)</text><text x="1020" y="175" font-size="22" font-weight="700" fill="#5E5E66" text-anchor="middle">What we really want</text><text x="500" y="320" font-size="21" font-weight="700" fill="#C81D25" text-anchor="middle">The gap:</text><text x="500" y="348" font-size="21" font-weight="700" fill="#C81D25" text-anchor="middle">the score rises,</text><text x="500" y="376" font-size="21" font-weight="700" fill="#C81D25" text-anchor="middle">the goal does not</text><text x="500" y="426" font-size="19" font-weight="400" fill="#C81D25" text-anchor="middle">special-casing tests</text><text x="500" y="453" font-size="19" font-weight="400" fill="#C81D25" text-anchor="middle">editing the timer</text><text x="500" y="480" font-size="19" font-weight="400" fill="#C81D25" text-anchor="middle">removing markers</text><text x="770" y="368" font-size="21" font-weight="700" fill="#2A9D8F" text-anchor="middle">Real gains:</text><text x="770" y="396" font-size="21" font-weight="700" fill="#2A9D8F" text-anchor="middle">score and goal</text><text x="770" y="424" font-size="21" font-weight="700" fill="#2A9D8F" text-anchor="middle">agree</text><text x="1050" y="368" font-size="20" font-weight="400" fill="#5E5E66" text-anchor="middle">Real value</text><text x="1050" y="396" font-size="20" font-weight="400" fill="#5E5E66" text-anchor="middle">the score misses</text><rect x="40" y="330" width="200" height="110" rx="12" fill="#6A4C93"/><text x="140.0" y="379.0" font-size="23" font-weight="700" fill="#ffffff" text-anchor="middle">Optimizer</text><text x="140.0" y="405.0" font-size="19" font-weight="400" fill="#ffffff" text-anchor="middle">sees only</text><text x="140.0" y="430.0" font-size="19" font-weight="400" fill="#ffffff" text-anchor="middle">the score</text><path d="M242,360 C300,330 360,320 420,330" fill="none" stroke="#C81D25" stroke-width="4" marker-end="url(#ahC81D25)"/><path d="M242,420 C360,570 640,570 740,440" fill="none" stroke="#2A9D8F" stroke-width="4" marker-end="url(#ah2A9D8F)"/><text x="640.0" y="640" font-size="21" font-weight="400" fill="#100D12" text-anchor="middle">A stronger optimizer searches more widely, so it also finds more of the gap.</text></svg>
