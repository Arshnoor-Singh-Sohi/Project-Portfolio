<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 900" width="1280" height="900" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="The ladder of self-improvement from Level 0, repeat a task, to Level 6, build a successor autonomously" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>The ladder of self-improvement from Level 0, repeat a task, to Level 6, build a successor autonomously</title><defs><marker id="ah1E6091" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E6091"/></marker><marker id="ahB8860B" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B8860B"/></marker><marker id="ah6A4C93" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6A4C93"/></marker><marker id="ah2D6A4F" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2D6A4F"/></marker><marker id="ah8A8A8A" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A8A8A"/></marker><marker id="ah2A9D8F" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2A9D8F"/></marker><marker id="ahC81D25" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C81D25"/></marker><marker id="ah100D12" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#100D12"/></marker></defs><rect x="0" y="0" width="1280" height="900" rx="16" fill="#ffffff"/><text x="640.0" y="52" font-size="32" font-weight="700" fill="#100D12" text-anchor="middle">The ladder of self-improvement</text><text x="640.0" y="88" font-size="21" font-weight="400" fill="#444444" text-anchor="middle">Each level adds one property. Real systems can span several levels.</text><rect x="268" y="125" width="972" height="92" rx="12" fill="#ffffff" stroke="#6A4C93" stroke-width="3" stroke-dasharray="10 7"/><text x="292" y="163" font-size="25" font-weight="700" fill="#6A4C93" text-anchor="start">Level 6  ·  Build a successor autonomously</text><text x="292" y="197" font-size="20" font-weight="400" fill="#6A4C93" text-anchor="start">Changes: a new model, with no human in the loop.</text><text x="1216" y="197" font-size="19" font-weight="400" fill="#6A4C93" text-anchor="end" font-style="italic">Not demonstrated (Oct 2026)</text><rect x="230" y="227" width="1010" height="92" rx="12" fill="#6A4C93"/><text x="254" y="265" font-size="25" font-weight="700" fill="#ffffff" text-anchor="start">Level 5  ·  Improve the improver</text><text x="254" y="299" font-size="20" font-weight="400" fill="#ffffff" text-anchor="start">Changes: the improver, which makes the next change.</text><text x="1216" y="299" font-size="19" font-weight="400" fill="#ffffff" text-anchor="end" font-style="italic">STOP: 3-SAT 21.2% to 75.1%</text><rect x="192" y="329" width="1048" height="92" rx="12" fill="#164A70"/><text x="216" y="367" font-size="25" font-weight="700" fill="#ffffff" text-anchor="start">Level 4  ·  Learn in the weights</text><text x="216" y="401" font-size="20" font-weight="400" fill="#ffffff" text-anchor="start">Changes: the model weights. The weights persist.</text><text x="1216" y="401" font-size="19" font-weight="400" fill="#ffffff" text-anchor="end" font-style="italic">STaR: 36.6% to 72.5%</text><rect x="154" y="431" width="1086" height="92" rx="12" fill="#1E6091"/><text x="178" y="469" font-size="25" font-weight="700" fill="#ffffff" text-anchor="start">Level 3  ·  Change its own implementation</text><text x="178" y="503" font-size="20" font-weight="400" fill="#ffffff" text-anchor="start">Changes: the scaffold code. The code persists.</text><text x="1216" y="503" font-size="19" font-weight="400" fill="#ffffff" text-anchor="end" font-style="italic">SICA: 17% to 53% on 50 tasks</text><rect x="116" y="533" width="1124" height="92" rx="12" fill="#2D6A4F"/><text x="140" y="571" font-size="25" font-weight="700" fill="#ffffff" text-anchor="start">Level 2  ·  Update a strategy or memory</text><text x="140" y="605" font-size="20" font-weight="400" fill="#ffffff" text-anchor="start">Changes: memory, rules, skills. Stored files persist.</text><text x="1216" y="605" font-size="19" font-weight="400" fill="#ffffff" text-anchor="end" font-style="italic">ExpeL: ALFWorld 40.0% to 59.0%</text><rect x="78" y="635" width="1162" height="92" rx="12" fill="#3A7CA5"/><text x="102" y="673" font-size="25" font-weight="700" fill="#ffffff" text-anchor="start">Level 1  ·  Reflect inside one task</text><text x="102" y="707" font-size="20" font-weight="400" fill="#ffffff" text-anchor="start">Changes: the output. Nothing persists.</text><text x="1216" y="707" font-size="19" font-weight="400" fill="#ffffff" text-anchor="end" font-style="italic">Self-Refine: 44.0 to 67.0 on constrained generation</text><rect x="40" y="737" width="1200" height="92" rx="12" fill="#8A8A8A"/><text x="64" y="775" font-size="25" font-weight="700" fill="#ffffff" text-anchor="start">Level 0  ·  Repeat or resample</text><text x="64" y="809" font-size="20" font-weight="400" fill="#ffffff" text-anchor="start">Changes: which answer is shown. Nothing persists.</text><text x="1216" y="809" font-size="19" font-weight="400" fill="#ffffff" text-anchor="end" font-style="italic">Self-consistency: GSM8K 56.5% to 74.4%</text><text x="640.0" y="865" font-size="20" font-weight="400" fill="#444444" text-anchor="middle">Levels 3 and 4 differ in where the change lives, not only in strength.</text><text x="640.0" y="895" font-size="19" font-weight="400" fill="#444444" text-anchor="middle">Our interpretation, built from the literature. Example numbers come from the papers named in Part 2, Lesson 2.</text></svg>
