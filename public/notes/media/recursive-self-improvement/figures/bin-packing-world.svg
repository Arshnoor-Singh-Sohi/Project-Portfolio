<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="Online bin packing: items arrive one at a time, a priority function scores each open bin, and the item goes into the best bin that has room" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>Online bin packing: items arrive one at a time, a priority function scores each open bin, and the item goes into the best bin that has room</title><defs><marker id="ah1E6091" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E6091"/></marker><marker id="ahB8860B" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B8860B"/></marker><marker id="ah6A4C93" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6A4C93"/></marker><marker id="ah2D6A4F" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2D6A4F"/></marker><marker id="ah8A8A8A" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A8A8A"/></marker><marker id="ah2A9D8F" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2A9D8F"/></marker><marker id="ahC81D25" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C81D25"/></marker><marker id="ah100D12" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#100D12"/></marker></defs><rect x="0" y="0" width="1280" height="800" rx="16" fill="#ffffff"/><text x="640.0" y="52" font-size="32" font-weight="700" fill="#100D12" text-anchor="middle">Online bin packing</text><text x="640.0" y="88" font-size="21" font-weight="400" fill="#444444" text-anchor="middle">Items arrive one at a time. A priority function picks the bin.</text><text x="150" y="140" font-size="21" font-weight="700" fill="#8A8A8A" text-anchor="middle">Items still to come</text><rect x="60" y="160" width="58" height="58" rx="12" fill="#8A8A8A"/><text x="89" y="197" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">30</text><rect x="126" y="160" width="58" height="58" rx="12" fill="#8A8A8A"/><text x="155" y="197" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">70</text><rect x="192" y="160" width="58" height="58" rx="12" fill="#8A8A8A"/><text x="221" y="197" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">20</text><rect x="60" y="270" width="190" height="92" rx="12" fill="#5E5E66"/><text x="155.0" y="310.0" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">Next item</text><text x="155.0" y="336.0" font-size="19" font-weight="400" fill="#ffffff" text-anchor="middle">size 45</text><rect x="380" y="280.0" width="120" height="360.0" rx="4" fill="#ffffff" stroke="#100D12" stroke-width="3"/><rect x="383" y="424.0" width="114" height="213.0" fill="#1E6091"/><text x="440" y="540.0" font-size="19" font-weight="700" fill="#ffffff" text-anchor="middle">used 60</text><text x="440" y="410.0" font-size="19" font-weight="700" fill="#100D12" text-anchor="middle">free 40</text><text x="440" y="674" font-size="21" font-weight="700" fill="#100D12" text-anchor="middle">bin 1</text><text x="440" y="704" font-size="19" font-weight="700" fill="#C81D25" text-anchor="middle">no room: skipped</text><rect x="580" y="280.0" width="120" height="360.0" rx="4" fill="#ffffff" stroke="#100D12" stroke-width="3"/><rect x="583" y="532.0" width="114" height="105.0" fill="#1E6091"/><text x="640" y="594.0" font-size="19" font-weight="700" fill="#ffffff" text-anchor="middle">used 30</text><text x="640" y="266.0" font-size="19" font-weight="700" fill="#100D12" text-anchor="middle">free 70</text><text x="640" y="674" font-size="21" font-weight="700" fill="#100D12" text-anchor="middle">bin 2</text><text x="640" y="704" font-size="19" font-weight="700" fill="#2A9D8F" text-anchor="middle">room: priority -25</text><rect x="583" y="370.0" width="114" height="162.0" fill="#2A9D8F" fill-opacity="0.35" stroke="#2A9D8F" stroke-width="3" stroke-dasharray="8 6"/><text x="640" y="446.79999999999995" font-size="19" font-weight="700" fill="#2A9D8F" text-anchor="middle">item 45</text><text x="640" y="470.79999999999995" font-size="19" font-weight="700" fill="#2A9D8F" text-anchor="middle">goes here</text><rect x="780" y="280.0" width="120" height="360.0" rx="4" fill="#ffffff" stroke="#100D12" stroke-width="3"/><rect x="783" y="334.0" width="114" height="303.0" fill="#1E6091"/><text x="840" y="495.0" font-size="19" font-weight="700" fill="#ffffff" text-anchor="middle">used 85</text><text x="840" y="320.0" font-size="19" font-weight="700" fill="#100D12" text-anchor="middle">free 15</text><text x="840" y="674" font-size="21" font-weight="700" fill="#100D12" text-anchor="middle">bin 3</text><text x="840" y="704" font-size="19" font-weight="700" fill="#C81D25" text-anchor="middle">no room: skipped</text><text x="155" y="400" font-size="19" font-weight="400" fill="#444444" text-anchor="middle">capacity 100 per bin</text><path d="M252,300 C360,215 560,215 632,362" fill="none" stroke="#2A9D8F" stroke-width="4" marker-end="url(#ah2A9D8F)"/><rect x="1000" y="150" width="250" height="150" rx="12" fill="#6A4C93"/><text x="1125.0" y="219.0" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">Priority function</text><text x="1125.0" y="245.0" font-size="19" font-weight="400" fill="#ffffff" text-anchor="middle">priority(item, space)</text><text x="1125.0" y="270.0" font-size="19" font-weight="400" fill="#ffffff" text-anchor="middle">best fit: -(space - item)</text><text x="1125.0" y="295.0" font-size="19" font-weight="400" fill="#ffffff" text-anchor="middle">highest wins</text><rect x="1000" y="340" width="250" height="180" rx="12" fill="#B8860B"/><text x="1125.0" y="424.0" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">Score of a packing</text><text x="1125.0" y="450.0" font-size="19" font-weight="400" fill="#ffffff" text-anchor="middle">L1 = ceil(sum / 100)</text><text x="1125.0" y="475.0" font-size="19" font-weight="400" fill="#ffffff" text-anchor="middle">excess = (bins - L1) / L1</text><text x="1125.0" y="500.0" font-size="19" font-weight="400" fill="#ffffff" text-anchor="middle">lower is better</text><text x="640.0" y="768" font-size="20" font-weight="400" fill="#444444" text-anchor="middle">If no open bin has room, the agent opens a new bin. It can never move an item later.</text></svg>
