<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 660" width="1280" height="660" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="Three loops: an agent loop, an improvement loop with a fixed improver, and an RSI loop in which the improver changes itself" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>Three loops: an agent loop, an improvement loop with a fixed improver, and an RSI loop in which the improver changes itself</title><defs><marker id="ah1E6091" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E6091"/></marker><marker id="ahB8860B" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B8860B"/></marker><marker id="ah6A4C93" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6A4C93"/></marker><marker id="ah2D6A4F" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2D6A4F"/></marker><marker id="ah8A8A8A" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A8A8A"/></marker><marker id="ah2A9D8F" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2A9D8F"/></marker><marker id="ahC81D25" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C81D25"/></marker><marker id="ah100D12" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#100D12"/></marker></defs><rect x="0" y="0" width="1280" height="660" rx="16" fill="#ffffff"/><text x="640.0" y="52" font-size="32" font-weight="700" fill="#100D12" text-anchor="middle">Three loops: who changes what</text><text x="640.0" y="88" font-size="21" font-weight="400" fill="#444444" text-anchor="middle">Only in the third loop does the improver itself change.</text><rect x="20" y="115" width="400" height="525" rx="14" fill="#F7F7F9" stroke="#D0D0D8" stroke-width="1.5"/><text x="220" y="158" font-size="25" font-weight="700" fill="#100D12" text-anchor="middle">(a) Agent loop</text><rect x="440" y="115" width="400" height="525" rx="14" fill="#F7F7F9" stroke="#D0D0D8" stroke-width="1.5"/><text x="640" y="158" font-size="25" font-weight="700" fill="#100D12" text-anchor="middle">(b) Improvement loop</text><rect x="860" y="115" width="400" height="525" rx="14" fill="#F7F7F9" stroke="#D0D0D8" stroke-width="1.5"/><text x="1060" y="158" font-size="25" font-weight="700" fill="#100D12" text-anchor="middle">(c) RSI loop</text><rect x="120" y="205" width="200" height="74" rx="12" fill="#1E6091"/><text x="220.0" y="249.7" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">Agent</text><rect x="95" y="410" width="250" height="74" rx="12" fill="#8A8A8A"/><text x="220.0" y="441.0" font-size="21" font-weight="700" fill="#ffffff" text-anchor="middle">Environment</text><text x="220.0" y="467.0" font-size="19" font-weight="400" fill="#ffffff" text-anchor="middle">and the task</text><line x1="170" y1="281" x2="170" y2="406" stroke="#100D12" stroke-width="3" marker-end="url(#ah100D12)"/><line x1="270" y1="408" x2="270" y2="283" stroke="#100D12" stroke-width="3" marker-end="url(#ah100D12)"/><rect x="133.79" y="333" width="72.42" height="27" rx="6" fill="#ffffff"/><text x="170" y="350" font-size="19" font-weight="400" fill="#100D12" text-anchor="middle">action</text><rect x="208.615" y="313" width="122.77000000000001" height="27" rx="6" fill="#ffffff"/><text x="270" y="330" font-size="19" font-weight="400" fill="#100D12" text-anchor="middle">observation</text><text x="220" y="560" font-size="20" font-weight="400" fill="#100D12" text-anchor="middle">Solves one task.</text><text x="220" y="586" font-size="20" font-weight="400" fill="#100D12" text-anchor="middle">Nothing about the</text><text x="220" y="612" font-size="20" font-weight="400" fill="#100D12" text-anchor="middle">agent changes.</text><rect x="540" y="190" width="200" height="70" rx="12" fill="#6A4C93"/><text x="640.0" y="232.7" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">Improver</text><rect x="485" y="296" width="310" height="126" rx="12" fill="none" stroke="#C81D25" stroke-width="2" stroke-dasharray="9 6"/><text x="785" y="318" font-size="18" font-weight="400" fill="#C81D25" text-anchor="end">system boundary</text><rect x="540" y="334" width="200" height="70" rx="12" fill="#1E6091"/><text x="640.0" y="376.7" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">Agent</text><rect x="540" y="456" width="200" height="70" rx="12" fill="#B8860B"/><text x="640.0" y="498.7" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">Evaluator</text><line x1="590" y1="262" x2="590" y2="330" stroke="#6A4C93" stroke-width="3" marker-end="url(#ah6A4C93)"/><rect x="499.79" y="267" width="72.42" height="27" rx="6" fill="#ffffff"/><text x="536" y="284" font-size="19" font-weight="400" fill="#6A4C93" text-anchor="middle">change</text><line x1="640" y1="406" x2="640" y2="452" stroke="#100D12" stroke-width="3" marker-end="url(#ah100D12)"/><path d="M742,491 C832,491 832,225 744,225" fill="none" stroke="#B8860B" stroke-width="3" marker-end="url(#ahB8860B)"/><rect x="774.825" y="453" width="62.35" height="27" rx="6" fill="#ffffff"/><text x="806" y="470" font-size="19" font-weight="400" fill="#B8860B" text-anchor="middle">score</text><text x="640" y="573" font-size="20" font-weight="400" fill="#100D12" text-anchor="middle">The agent changes.</text><text x="640" y="599" font-size="20" font-weight="400" fill="#100D12" text-anchor="middle">The improver stays the same.</text><rect x="900" y="178" width="320" height="244" rx="12" fill="none" stroke="#C81D25" stroke-width="2" stroke-dasharray="9 6"/><text x="1060" y="202" font-size="18" font-weight="400" fill="#C81D25" text-anchor="middle">system boundary</text><rect x="960" y="214" width="200" height="70" rx="12" fill="#6A4C93"/><text x="1060.0" y="256.7" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">Improver</text><path d="M1160,236 C1210,216 1210,272 1162,262" fill="none" stroke="#6A4C93" stroke-width="3" marker-end="url(#ah6A4C93)"/><rect x="1055.51" y="301" width="152.98000000000002" height="27" rx="6" fill="#ffffff"/><text x="1132" y="318" font-size="19" font-weight="400" fill="#6A4C93" text-anchor="middle">changes itself</text><rect x="960" y="334" width="200" height="70" rx="12" fill="#1E6091"/><text x="1060.0" y="376.7" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">Agent</text><line x1="1010" y1="286" x2="1010" y2="330" stroke="#6A4C93" stroke-width="3" marker-end="url(#ah6A4C93)"/><rect x="960" y="460" width="200" height="70" rx="12" fill="#B8860B"/><text x="1060.0" y="502.7" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">Evaluator</text><line x1="1060" y1="406" x2="1060" y2="456" stroke="#100D12" stroke-width="3" marker-end="url(#ah100D12)"/><path d="M960,495 C880,495 880,249 958,249" fill="none" stroke="#B8860B" stroke-width="3" marker-end="url(#ahB8860B)"/><rect x="874.825" y="453" width="62.35" height="27" rx="6" fill="#ffffff"/><text x="906" y="470" font-size="19" font-weight="400" fill="#B8860B" text-anchor="middle">score</text><text x="1060" y="573" font-size="20" font-weight="400" fill="#100D12" text-anchor="middle">The improver changes too.</text><text x="1060" y="599" font-size="20" font-weight="400" fill="#100D12" text-anchor="middle">The new improver makes</text><text x="1060" y="625" font-size="20" font-weight="400" fill="#100D12" text-anchor="middle">the next change.</text></svg>
