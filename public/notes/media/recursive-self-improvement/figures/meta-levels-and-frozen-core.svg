<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 850" width="1280" height="850" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="Object level, meta level and meta-meta level as stacked layers, with the frozen core that no level may change" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>Object level, meta level and meta-meta level as stacked layers, with the frozen core that no level may change</title><defs><marker id="ah1E6091" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E6091"/></marker><marker id="ahB8860B" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B8860B"/></marker><marker id="ah6A4C93" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6A4C93"/></marker><marker id="ah2D6A4F" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2D6A4F"/></marker><marker id="ah8A8A8A" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A8A8A"/></marker><marker id="ah2A9D8F" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2A9D8F"/></marker><marker id="ahC81D25" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C81D25"/></marker><marker id="ah100D12" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#100D12"/></marker></defs><rect x="0" y="0" width="1280" height="850" rx="16" fill="#ffffff"/><text x="640.0" y="52" font-size="32" font-weight="700" fill="#100D12" text-anchor="middle">Meta-levels and the frozen core</text><text x="640.0" y="88" font-size="21" font-weight="400" fill="#444444" text-anchor="middle">Every real system stops the regress somewhere and keeps a core that no level may change.</text><rect x="40" y="130" width="700" height="86" rx="12" fill="#8E74B4"/><text x="68" y="168" font-size="24" font-weight="700" fill="#ffffff" text-anchor="start">Meta-meta level</text><text x="68" y="200" font-size="20" font-weight="400" fill="#ffffff" text-anchor="start">improves the improver</text><line x1="670" y1="218" x2="670" y2="242" stroke="#100D12" stroke-width="3" marker-end="url(#ah100D12)"/><text x="656" y="238" font-size="18" font-weight="400" fill="#100D12" text-anchor="end">changes</text><rect x="40" y="246" width="700" height="86" rx="12" fill="#6A4C93"/><text x="68" y="284" font-size="24" font-weight="700" fill="#ffffff" text-anchor="start">Meta level</text><text x="68" y="316" font-size="20" font-weight="400" fill="#ffffff" text-anchor="start">improves the agent</text><line x1="670" y1="334" x2="670" y2="358" stroke="#100D12" stroke-width="3" marker-end="url(#ah100D12)"/><text x="656" y="354" font-size="18" font-weight="400" fill="#100D12" text-anchor="end">changes</text><rect x="40" y="362" width="700" height="86" rx="12" fill="#1E6091"/><text x="68" y="400" font-size="24" font-weight="700" fill="#ffffff" text-anchor="start">Object level</text><text x="68" y="432" font-size="20" font-weight="400" fill="#ffffff" text-anchor="start">the agent solves tasks</text><line x1="670" y1="450" x2="670" y2="474" stroke="#100D12" stroke-width="3" marker-end="url(#ah100D12)"/><text x="656" y="470" font-size="18" font-weight="400" fill="#100D12" text-anchor="end">acts on</text><rect x="40" y="478" width="700" height="86" rx="12" fill="#8A8A8A"/><text x="68" y="516" font-size="24" font-weight="700" fill="#ffffff" text-anchor="start">Tasks and environment</text><text x="68" y="548" font-size="20" font-weight="400" fill="#ffffff" text-anchor="start">what the agent acts on</text><rect x="40" y="600" width="700" height="200" rx="14" fill="#F1F1F4" stroke="#100D12" stroke-width="3.5"/><text x="390.0" y="638" font-size="24" font-weight="700" fill="#100D12" text-anchor="middle">Frozen core: no level may change it</text><rect x="64" y="662" width="316" height="52" rx="10" fill="#ffffff" stroke="#B8860B" stroke-width="3"/><text x="222" y="695" font-size="19" font-weight="700" fill="#B8860B" text-anchor="middle">Evaluator and objective</text><rect x="400" y="662" width="316" height="52" rx="10" fill="#ffffff" stroke="#1E6091" stroke-width="3"/><text x="558" y="695" font-size="19" font-weight="700" fill="#1E6091" text-anchor="middle">Base model weights</text><rect x="64" y="726" width="316" height="52" rx="10" fill="#ffffff" stroke="#6A4C93" stroke-width="3"/><text x="222" y="759" font-size="19" font-weight="700" fill="#6A4C93" text-anchor="middle">Outer loop and acceptance rule</text><rect x="400" y="726" width="316" height="52" rx="10" fill="#ffffff" stroke="#C81D25" stroke-width="3"/><text x="558" y="759" font-size="19" font-weight="700" fill="#C81D25" text-anchor="middle">Sandbox and budget</text><text x="780" y="160" font-size="24" font-weight="700" fill="#100D12" text-anchor="start">Three ways to stop the regress</text><rect x="780" y="200" width="460" height="168" rx="12" fill="#F7F7F9" stroke="#6A4C93" stroke-width="3"/><text x="800" y="238" font-size="22" font-weight="700" fill="#6A4C93" text-anchor="start">1. Fix a top level</text><text x="800" y="274" font-size="19" font-weight="400" fill="#100D12" text-anchor="start">The meta agent is a fixed program.</text><text x="800" y="301" font-size="19" font-weight="400" fill="#100D12" text-anchor="start">Examples: ADAS, Promptbreeder&#x27;s</text><text x="800" y="328" font-size="19" font-weight="400" fill="#100D12" text-anchor="start">hyper-mutation prompt.</text><rect x="780" y="386" width="460" height="168" rx="12" fill="#F7F7F9" stroke="#1E6091" stroke-width="3"/><text x="800" y="424" font-size="22" font-weight="700" fill="#1E6091" text-anchor="start">2. Fold the levels into one</text><text x="800" y="460" font-size="19" font-weight="400" fill="#100D12" text-anchor="start">The agent&#x27;s code is also the improver.</text><text x="800" y="487" font-size="19" font-weight="400" fill="#100D12" text-anchor="start">Examples: STOP, the DGM, SICA,</text><text x="800" y="514" font-size="19" font-weight="400" fill="#100D12" text-anchor="start">Gödel Agent. Each keeps an outer loop.</text><rect x="780" y="572" width="460" height="168" rx="12" fill="#F7F7F9" stroke="#B8860B" stroke-width="3"/><text x="800" y="610" font-size="22" font-weight="700" fill="#B8860B" text-anchor="start">3. Prove before rewriting</text><text x="800" y="646" font-size="19" font-weight="400" fill="#100D12" text-anchor="start">Rewrite only after a proof that the</text><text x="800" y="673" font-size="19" font-weight="400" fill="#100D12" text-anchor="start">rewrite helps. Example: the Gödel</text><text x="800" y="700" font-size="19" font-weight="400" fill="#100D12" text-anchor="start">machine (theory only).</text></svg>
