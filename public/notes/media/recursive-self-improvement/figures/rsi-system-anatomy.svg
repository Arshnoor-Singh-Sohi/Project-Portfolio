<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 820" width="1280" height="820" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="The components of a self-improving system and the data that moves between them" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>The components of a self-improving system and the data that moves between them</title><defs><marker id="ah1E6091" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E6091"/></marker><marker id="ahB8860B" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B8860B"/></marker><marker id="ah6A4C93" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6A4C93"/></marker><marker id="ah2D6A4F" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2D6A4F"/></marker><marker id="ah8A8A8A" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A8A8A"/></marker><marker id="ah2A9D8F" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2A9D8F"/></marker><marker id="ahC81D25" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C81D25"/></marker><marker id="ah100D12" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#100D12"/></marker></defs><rect x="0" y="0" width="1280" height="820" rx="16" fill="#ffffff"/><text x="640.0" y="52" font-size="32" font-weight="700" fill="#100D12" text-anchor="middle">The components of a self-improving system</text><text x="640.0" y="88" font-size="21" font-weight="400" fill="#444444" text-anchor="middle">One iteration moves clockwise, from the archive back to the archive.</text><rect x="40" y="150" width="230" height="96" rx="12" fill="#2D6A4F"/><text x="155.0" y="192.0" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">Archive</text><text x="155.0" y="218.0" font-size="19" font-weight="400" fill="#ffffff" text-anchor="middle">kept versions, scores</text><rect x="370" y="150" width="230" height="96" rx="12" fill="#1E6091"/><text x="485.0" y="192.0" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">Parent version</text><text x="485.0" y="218.0" font-size="19" font-weight="400" fill="#ffffff" text-anchor="middle">chosen from archive</text><rect x="700" y="150" width="230" height="96" rx="12" fill="#6A4C93"/><text x="815.0" y="192.0" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">Proposer</text><text x="815.0" y="218.0" font-size="19" font-weight="400" fill="#ffffff" text-anchor="middle">makes one change</text><rect x="1010" y="150" width="230" height="96" rx="12" fill="#1E6091"/><text x="1125.0" y="192.0" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">Candidate</text><text x="1125.0" y="218.0" font-size="19" font-weight="400" fill="#ffffff" text-anchor="middle">parent plus change</text><rect x="700" y="380" width="230" height="96" rx="12" fill="#8A8A8A"/><text x="815.0" y="422.0" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">Tasks</text><text x="815.0" y="448.0" font-size="19" font-weight="400" fill="#ffffff" text-anchor="middle">and the objective</text><rect x="1010" y="380" width="230" height="96" rx="12" fill="#B8860B"/><text x="1125.0" y="422.0" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">Evaluator</text><text x="1125.0" y="448.0" font-size="19" font-weight="400" fill="#ffffff" text-anchor="middle">runs the tests</text><rect x="1010" y="600" width="230" height="96" rx="12" fill="#B8860B"/><text x="1125.0" y="642.0" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">Acceptance rule</text><text x="1125.0" y="668.0" font-size="19" font-weight="400" fill="#ffffff" text-anchor="middle">keep or reject?</text><rect x="370" y="600" width="230" height="96" rx="12" fill="#2D6A4F"/><text x="485.0" y="642.0" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">Attempt log</text><text x="485.0" y="668.0" font-size="19" font-weight="400" fill="#ffffff" text-anchor="middle">every decision</text><line x1="274" y1="212" x2="364" y2="212" stroke="#100D12" stroke-width="3" marker-end="url(#ah100D12)"/><text x="320.0" y="198" font-size="18" font-weight="400" fill="#100D12" text-anchor="middle">select</text><line x1="604" y1="212" x2="694" y2="212" stroke="#100D12" stroke-width="3" marker-end="url(#ah100D12)"/><text x="650.0" y="198" font-size="18" font-weight="400" fill="#100D12" text-anchor="middle">its code</text><line x1="934" y1="212" x2="1004" y2="212" stroke="#6A4C93" stroke-width="3" marker-end="url(#ah6A4C93)"/><text x="970.0" y="198" font-size="18" font-weight="400" fill="#6A4C93" text-anchor="middle">change</text><line x1="1125.0" y1="250" x2="1125.0" y2="374" stroke="#100D12" stroke-width="3" marker-end="url(#ah100D12)"/><text x="1139.0" y="319.0" font-size="18" font-weight="400" fill="#100D12" text-anchor="start">run it</text><line x1="934" y1="428" x2="1004" y2="428" stroke="#8A8A8A" stroke-width="3" marker-end="url(#ah8A8A8A)"/><line x1="1125.0" y1="480" x2="1125.0" y2="594" stroke="#B8860B" stroke-width="3" marker-end="url(#ahB8860B)"/><text x="1139.0" y="516" font-size="18" font-weight="400" fill="#B8860B" text-anchor="start">feedback:</text><text x="1139.0" y="540" font-size="18" font-weight="400" fill="#B8860B" text-anchor="start">scores, tests</text><path d="M1050,596 L1050,548 L155.0,548 L155.0,252" fill="none" stroke="#2A9D8F" stroke-width="3.5" marker-end="url(#ah2A9D8F)"/><rect x="405.59000000000003" y="537" width="273.82" height="27" rx="6" fill="#ffffff"/><text x="542.5" y="554" font-size="19" font-weight="400" fill="#2A9D8F" text-anchor="middle">accept: add to the archive</text><line x1="1006" y1="660" x2="606" y2="660" stroke="#100D12" stroke-width="3" marker-end="url(#ah100D12)"/><text x="805.0" y="692" font-size="18" font-weight="400" fill="#100D12" text-anchor="middle">record every decision, accepted or rejected</text><text x="805.0" y="650" font-size="18" font-weight="700" fill="#C81D25" text-anchor="middle">reject: record only</text><path d="M540,596 L540,310 L815.0,310 L815.0,252" fill="none" stroke="#2D6A4F" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#ah2D6A4F)"/><text x="520" y="378" font-size="18" font-weight="400" fill="#2D6A4F" text-anchor="end">the log guides</text><text x="520" y="402" font-size="18" font-weight="400" fill="#2D6A4F" text-anchor="end">the proposer</text><text x="640.0" y="792" font-size="18" font-weight="400" fill="#444444" text-anchor="middle">The best version in the archive is the updated system. Validation means: the evaluator runs on held-out tasks.</text></svg>
