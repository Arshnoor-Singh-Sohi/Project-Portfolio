<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 736" width="1280" height="736" role="img" aria-label="Seven limits of the PagedAttention design, each linked by an arrow to the later work that addresses it"><title>Limits of PagedAttention and the later work</title><defs><marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#100D12"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E6091"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C81D25"/></marker><marker id="a-gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B8860B"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2D6A4F"/></marker><marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6A4C93"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A8A8A"/></marker></defs><rect x="0" y="0" width="1280" height="736" fill="#FFFFFF"/><text x="640" y="46" font-family="Helvetica, Arial, sans-serif" font-size="28" fill="#100D12" font-weight="bold" text-anchor="middle">What the paper left open, and what came after</text><text x="270" y="80" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#C81D25" font-weight="bold" text-anchor="middle">Limit of the paper</text><text x="940" y="80" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#2D6A4F" font-weight="bold" text-anchor="middle">Later work</text><rect x="30" y="96" width="480" height="72" rx="10" fill="#FBE9EA" stroke="#C81D25" stroke-width="2"/><text x="270" y="126" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#100D12" font-weight="normal" text-anchor="middle">Paged kernel 20–26% slower,</text><text x="270" y="152" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#100D12" font-weight="normal" text-anchor="middle">rewritten for each kernel (§7.1)</text><line x1="512" y1="132" x2="618" y2="132" stroke="#100D12" stroke-width="2.5" marker-end="url(#a-ink)"/><rect x="625" y="96" width="630" height="72" rx="10" fill="#EAF3EE" stroke="#2D6A4F" stroke-width="2"/><text x="940" y="126" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#100D12" font-weight="normal" text-anchor="middle">FlashAttention 2.5 and FlashInfer read block tables.</text><text x="940" y="152" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#100D12" font-weight="normal" text-anchor="middle">vAttention: paging by the CUDA driver.</text><rect x="30" y="184" width="480" height="72" rx="10" fill="#FBE9EA" stroke="#C81D25" stroke-width="2"/><text x="270" y="214" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#100D12" font-weight="normal" text-anchor="middle">Reuse only for prefixes that</text><text x="270" y="240" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#100D12" font-weight="normal" text-anchor="middle">the provider defines (§4.4)</text><line x1="512" y1="220" x2="618" y2="220" stroke="#100D12" stroke-width="2.5" marker-end="url(#a-ink)"/><rect x="625" y="184" width="630" height="72" rx="10" fill="#EAF3EE" stroke="#2D6A4F" stroke-width="2"/><text x="940" y="214" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#100D12" font-weight="normal" text-anchor="middle">Automatic prefix caching with block hashes (vLLM).</text><text x="940" y="240" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#100D12" font-weight="normal" text-anchor="middle">RadixAttention (SGLang).</text><rect x="30" y="272" width="480" height="72" rx="10" fill="#FBE9EA" stroke="#C81D25" stroke-width="2"/><text x="270" y="302" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#100D12" font-weight="normal" text-anchor="middle">KV cache dropped between</text><text x="270" y="328" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#100D12" font-weight="normal" text-anchor="middle">chat rounds (§6.5)</text><line x1="512" y1="308" x2="618" y2="308" stroke="#100D12" stroke-width="2.5" marker-end="url(#a-ink)"/><rect x="625" y="272" width="630" height="72" rx="10" fill="#EAF3EE" stroke="#2D6A4F" stroke-width="2"/><text x="940" y="302" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#100D12" font-weight="normal" text-anchor="middle">Prefix caching keeps it on the GPU.</text><text x="940" y="328" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#100D12" font-weight="normal" text-anchor="middle">CachedAttention and LMCache keep it outside.</text><rect x="30" y="360" width="480" height="72" rx="10" fill="#FBE9EA" stroke="#C81D25" stroke-width="2"/><text x="270" y="390" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#100D12" font-weight="normal" text-anchor="middle">Whole prompt in one step,</text><text x="270" y="416" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#100D12" font-weight="normal" text-anchor="middle">decodes wait (§2.2)</text><line x1="512" y1="396" x2="618" y2="396" stroke="#100D12" stroke-width="2.5" marker-end="url(#a-ink)"/><rect x="625" y="360" width="630" height="72" rx="10" fill="#EAF3EE" stroke="#2D6A4F" stroke-width="2"/><text x="940" y="390" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#100D12" font-weight="normal" text-anchor="middle">Chunked prefill: SARATHI, Sarathi-Serve, vLLM V1.</text><text x="940" y="416" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#100D12" font-weight="normal" text-anchor="middle">Disaggregation: Splitwise, DistServe, Mooncake.</text><rect x="30" y="448" width="480" height="72" rx="10" fill="#FBE9EA" stroke="#C81D25" stroke-width="2"/><text x="270" y="478" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#100D12" font-weight="normal" text-anchor="middle">GPU memory is the only home</text><text x="270" y="504" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#100D12" font-weight="normal" text-anchor="middle">of the KV cache (§4.5)</text><line x1="512" y1="484" x2="618" y2="484" stroke="#100D12" stroke-width="2.5" marker-end="url(#a-ink)"/><rect x="625" y="448" width="630" height="72" rx="10" fill="#EAF3EE" stroke="#2D6A4F" stroke-width="2"/><text x="940" y="478" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#100D12" font-weight="normal" text-anchor="middle">Offloading tiers: vLLM OffloadingConnector,</text><text x="940" y="504" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#100D12" font-weight="normal" text-anchor="middle">LMCache, the Mooncake store.</text><rect x="30" y="536" width="480" height="72" rx="10" fill="#FBE9EA" stroke="#C81D25" stroke-width="2"/><text x="270" y="566" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#100D12" font-weight="normal" text-anchor="middle">One block shape for</text><text x="270" y="592" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#100D12" font-weight="normal" text-anchor="middle">every layer</text><line x1="512" y1="572" x2="618" y2="572" stroke="#100D12" stroke-width="2.5" marker-end="url(#a-ink)"/><rect x="625" y="536" width="630" height="72" rx="10" fill="#EAF3EE" stroke="#2D6A4F" stroke-width="2"/><text x="940" y="566" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#100D12" font-weight="normal" text-anchor="middle">Hybrid KV cache manager (vLLM).</text><text x="940" y="592" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#100D12" font-weight="normal" text-anchor="middle">Jenga: an allocator for mixed layer types.</text><rect x="30" y="624" width="480" height="72" rx="10" fill="#FBE9EA" stroke="#C81D25" stroke-width="2"/><text x="270" y="654" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#100D12" font-weight="normal" text-anchor="middle">First-come-first-serve</text><text x="270" y="680" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#100D12" font-weight="normal" text-anchor="middle">only (§4.5)</text><line x1="512" y1="660" x2="618" y2="660" stroke="#100D12" stroke-width="2.5" marker-end="url(#a-ink)"/><rect x="625" y="624" width="630" height="72" rx="10" fill="#EAF3EE" stroke="#2D6A4F" stroke-width="2"/><text x="940" y="654" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#100D12" font-weight="normal" text-anchor="middle">Goodput-aware designs (DistServe).</text><text x="940" y="680" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#100D12" font-weight="normal" text-anchor="middle">A priority policy in vLLM's scheduler.</text></svg>
