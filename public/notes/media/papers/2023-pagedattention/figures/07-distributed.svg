<text x="640.0" y="46" font-family="Helvetica, Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="middle" fill="#100D12">One block manager, many GPU workers (§4.6)</text>
<text x="640" y="82" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" text-anchor="middle" fill="#100D12">Example: OPT-175B (96 heads, 96 layers) with tensor parallelism on 8 GPUs, 12 heads per GPU.</text>
<rect x="330" y="110" width="620" height="150" rx="10" fill="#E1ECF4" stroke="#1E6091" stroke-width="2"/>
<text x="640" y="145" font-family="Helvetica, Arial, sans-serif" font-size="23" font-weight="bold" text-anchor="middle" fill="#100D12">Centralized scheduler</text>
<text x="640" y="177" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" text-anchor="middle" fill="#100D12">one KV cache manager, one block table per sequence</text>
