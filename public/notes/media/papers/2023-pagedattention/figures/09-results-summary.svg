<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 760" width="1280" height="760" role="img" aria-label="Horizontal bars on a logarithmic axis of the speedups stated in the text of the paper: 1.3x, 1.7 to 2.7x, 2.7 to 8x, up to 22x, 2.3x, 1.67x, 3.58x and 2x, with the attention kernel 20 to 26 percent slower"><title>The speedups that the paper states</title><defs><marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#100D12"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E6091"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C81D25"/></marker><marker id="a-gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B8860B"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2D6A4F"/></marker><marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6A4C93"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A8A8A"/></marker></defs><rect x="0" y="0" width="1280" height="760" fill="#FFFFFF"/><text x="640" y="46" font-family="Helvetica, Arial, sans-serif" font-size="28" fill="#100D12" font-weight="bold" text-anchor="middle">The speedups that the paper states (vLLM ÷ baseline)</text><text x="640" y="80" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" font-weight="normal" text-anchor="middle">Request rate at the same latency, or throughput. Logarithmic axis.</text><line x1="520.0" y1="114" x2="520.0" y2="626" stroke="#8A8A8A" stroke-width="1" stroke-dasharray="4 6"/><text x="520.0" y="654" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#100D12" font-weight="normal" text-anchor="middle">1×</text><line x1="654.504731079734" y1="114" x2="654.504731079734" y2="626" stroke="#8A8A8A" stroke-width="1" stroke-dasharray="4 6"/><text x="654.504731079734" y="654" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#100D12" font-weight="normal" text-anchor="middle">2×</text><line x1="789.0094621594682" y1="114" x2="789.0094621594682" y2="626" stroke="#8A8A8A" stroke-width="1" stroke-dasharray="4 6"/><text x="789.0094621594682" y="654" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#100D12" font-weight="normal" text-anchor="middle">4×</text><line x1="923.5141932392022" y1="114" x2="923.5141932392022" y2="626" stroke="#8A8A8A" stroke-width="1" stroke-dasharray="4 6"/><text x="923.5141932392022" y="654" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#100D12" font-weight="normal" text-anchor="middle">8×</text><line x1="1058.0189243189363" y1="114" x2="1058.0189243189363" y2="626" stroke="#8A8A8A" stroke-width="1" stroke-dasharray="4 6"/><text x="1058.0189243189363" y="654" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#100D12" font-weight="normal" text-anchor="middle">16×</text><line x1="520" y1="626" x2="1180" y2="626" stroke="#100D12" stroke-width="2"/><text x="504" y="160" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#100D12" font-weight="normal" text-anchor="end">Basic, OPT-13B Alpaca, vs Orca (Oracle)</text><rect x="520.0" y="138" width="50.911604096296514" height="30" rx="0" fill="#6A4C93" stroke="#6A4C93" stroke-width="2"/><rect x="578.9116040962965" y="140" width="134.5" height="28" rx="0" fill="#FFFFFF" stroke="none" stroke-width="0"/><text x="582.9116040962965" y="160" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#100D12" font-weight="bold" text-anchor="start">1.3× (§6.3)</text><text x="504" y="222" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#100D12" font-weight="normal" text-anchor="end">Basic, ShareGPT, vs Orca (Oracle)</text><line x1="520.0" y1="215" x2="622.9680451917446" y2="215" stroke="#8A8A8A" stroke-width="3" stroke-dasharray="6 5"/><rect x="622.9680451917446" y="200" width="89.77177453210322" height="30" rx="0" fill="#6A4C93" stroke="#6A4C93" stroke-width="2"/><rect x="720.7398197238479" y="202" width="180.5" height="28" rx="0" fill="#FFFFFF" stroke="none" stroke-width="0"/><text x="724.7398197238479" y="222" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#100D12" font-weight="bold" text-anchor="start">1.7–2.7× (§6.2)</text><text x="504" y="284" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#100D12" font-weight="normal" text-anchor="end">Basic, ShareGPT, vs Orca (Max)</text><line x1="520.0" y1="277" x2="712.7398197238479" y2="277" stroke="#8A8A8A" stroke-width="3" stroke-dasharray="6 5"/><rect x="712.7398197238479" y="262" width="210.77437351535434" height="30" rx="0" fill="#6A4C93" stroke="#6A4C93" stroke-width="2"/><rect x="931.5141932392022" y="264" width="157.5" height="28" rx="0" fill="#FFFFFF" stroke="none" stroke-width="0"/><text x="935.5141932392022" y="284" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#100D12" font-weight="bold" text-anchor="start">2.7–8× (§6.2)</text><text x="504" y="346" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#100D12" font-weight="normal" text-anchor="end">Basic, ShareGPT, vs FasterTransformer</text><rect x="520.0" y="324" width="599.814650633273" height="30" rx="0" fill="none" stroke="#6A4C93" stroke-width="2.5" stroke-dasharray="8 5"/><text x="1107.814650633273" y="346" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#100D12" font-weight="bold" text-anchor="end">up to 22× (§6.2)</text><text x="504" y="408" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#100D12" font-weight="normal" text-anchor="end">Beam width 6, Alpaca, vs Orca (Oracle)</text><rect x="520.0" y="386" width="161.62543935292638" height="30" rx="0" fill="#6A4C93" stroke="#6A4C93" stroke-width="2"/><rect x="689.6254393529264" y="388" width="134.5" height="28" rx="0" fill="#FFFFFF" stroke="none" stroke-width="0"/><text x="693.6254393529264" y="408" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#100D12" font-weight="bold" text-anchor="start">2.3× (§6.3)</text><text x="504" y="470" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#100D12" font-weight="normal" text-anchor="end">Shared prefix 80 tokens, vs Orca (Oracle)</text><rect x="520.0" y="448" width="99.51307009342452" height="30" rx="0" fill="#6A4C93" stroke="#6A4C93" stroke-width="2"/><rect x="627.5130700934245" y="450" width="146.0" height="28" rx="0" fill="#FFFFFF" stroke="none" stroke-width="0"/><text x="631.5130700934245" y="470" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#100D12" font-weight="bold" text-anchor="start">1.67× (§6.4)</text><text x="504" y="532" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#100D12" font-weight="normal" text-anchor="end">Shared prefix 341 tokens, vs Orca (Oracle)</text><rect x="520.0" y="510" width="247.483269512858" height="30" rx="0" fill="#6A4C93" stroke="#6A4C93" stroke-width="2"/><rect x="775.483269512858" y="512" width="146.0" height="28" rx="0" fill="#FFFFFF" stroke="none" stroke-width="0"/><text x="779.483269512858" y="532" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#100D12" font-weight="bold" text-anchor="start">3.58× (§6.4)</text><text x="504" y="594" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#100D12" font-weight="normal" text-anchor="end">Chatbot, vs all three Orca variants</text><rect x="520.0" y="572" width="134.50473107973403" height="30" rx="0" fill="#6A4C93" stroke="#6A4C93" stroke-width="2"/><rect x="662.504731079734" y="574" width="111.5" height="28" rx="0" fill="#FFFFFF" stroke="none" stroke-width="0"/><text x="666.504731079734" y="594" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#100D12" font-weight="bold" text-anchor="start">2× (§6.5)</text><rect x="70" y="670" width="1140" height="64" rx="10" fill="#FBE9EA" stroke="#C81D25" stroke-width="2"/><text x="640" y="700" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#C81D25" font-weight="bold" text-anchor="middle">The cost side (§7.1): the paged attention kernel is 20–26% slower than FasterTransformer's.</text><text x="640" y="724" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#100D12" font-weight="normal" text-anchor="middle">Only the attention operator pays it. The larger batch pays for it many times over.</text></svg>
