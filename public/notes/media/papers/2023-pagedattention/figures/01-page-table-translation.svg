<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 760" width="1280" height="760" font-family="Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="1280" height="760" fill="#ffffff"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#100D12"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2D6A4F"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E6091"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C81D25"/></marker></defs>
<text x="640.0" y="44" font-size="28" fill="#100D12" font-weight="bold" text-anchor="middle">Address translation with a page table (16-byte pages)</text>
<text x="60" y="110" font-size="22" fill="#100D12" font-weight="bold" text-anchor="start">1. Virtual address 45</text>
<rect x="60" y="130" width="120" height="64" rx="6" fill="#DCE8F2" stroke="#1E6091" stroke-width="2"/>
<text x="120" y="172" font-size="28" fill="#1E6091" font-weight="bold" text-anchor="middle" font-family="Menlo, Consolas, monospace">10</text>
<rect x="180" y="130" width="200" height="64" rx="6" fill="#ffffff" stroke="#100D12" stroke-width="2"/>
<text x="280" y="172" font-size="28" fill="#100D12" font-weight="bold" text-anchor="middle" font-family="Menlo, Consolas, monospace">1101</text>
<text x="120" y="226" font-size="21" fill="#1E6091" font-weight="bold" text-anchor="middle">VPN = 2</text>
<text x="280" y="226" font-size="21" fill="#100D12" font-weight="bold" text-anchor="middle">offset = 13</text>
<text x="36" y="470" font-size="20" fill="#100D12" font-weight="normal" text-anchor="start">VPN = floor(45 / 16) = 2</text>
<text x="36" y="498" font-size="20" fill="#100D12" font-weight="normal" text-anchor="start">offset = 45 mod 16 = 13</text>
<text x="470" y="110" font-size="22" fill="#100D12" font-weight="bold" text-anchor="start">2. Page table of the process</text>
<rect x="470" y="130" width="300" height="44" rx="6" fill="#E6E6E6" stroke="#100D12" stroke-width="2"/>
<text x="545" y="160" font-size="20" fill="#100D12" font-weight="bold" text-anchor="middle">VPN</text>
<text x="695" y="160" font-size="20" fill="#100D12" font-weight="bold" text-anchor="middle">frame (PFN)</text>
<rect x="470" y="174" width="300" height="46" rx="6" fill="#ffffff" stroke="#100D12" stroke-width="2"/>
<text x="545" y="205" font-size="21" fill="#100D12" font-weight="normal" text-anchor="middle">0</text>
<text x="695" y="205" font-size="21" fill="#100D12" font-weight="normal" text-anchor="middle">3</text>
<rect x="470" y="220" width="300" height="46" rx="6" fill="#ffffff" stroke="#100D12" stroke-width="2"/>
<text x="545" y="251" font-size="21" fill="#100D12" font-weight="normal" text-anchor="middle">1</text>
<text x="695" y="251" font-size="21" fill="#100D12" font-weight="normal" text-anchor="middle">7</text>
<rect x="470" y="266" width="300" height="46" rx="6" fill="#D8EAE1" stroke="#2D6A4F" stroke-width="3"/>
<text x="545" y="297" font-size="21" fill="#2D6A4F" font-weight="bold" text-anchor="middle">2</text>
<text x="695" y="297" font-size="21" fill="#2D6A4F" font-weight="bold" text-anchor="middle">5</text>
<rect x="470" y="312" width="300" height="46" rx="6" fill="#ffffff" stroke="#8A8A8A" stroke-width="2" stroke-dasharray="8,6"/>
<text x="545" y="343" font-size="21" fill="#8A8A8A" font-weight="normal" text-anchor="middle">3</text>
<text x="695" y="343" font-size="21" fill="#8A8A8A" font-weight="normal" text-anchor="middle">not valid</text>
<line x1="620" y1="130" x2="620" y2="358" stroke="#100D12" stroke-width="1"/>
<path d="M120,240 C120,330 380,289 464,289" stroke="#1E6091" stroke-width="3" fill="none" marker-end="url(#ahb)"/>
<text x="930" y="110" font-size="22" fill="#100D12" font-weight="bold" text-anchor="start">3. Physical memory: 8 frames</text>
<rect x="930" y="130" width="300" height="52" rx="6" fill="#ffffff" stroke="#8A8A8A" stroke-width="2"/>
<text x="950" y="163" font-size="20" fill="#8A8A8A" font-weight="normal" text-anchor="start">frame 0</text>
<rect x="930" y="182" width="300" height="52" rx="6" fill="#ffffff" stroke="#8A8A8A" stroke-width="2"/>
<text x="950" y="215" font-size="20" fill="#8A8A8A" font-weight="normal" text-anchor="start">frame 1</text>
<rect x="930" y="234" width="300" height="52" rx="6" fill="#ffffff" stroke="#8A8A8A" stroke-width="2"/>
<text x="950" y="267" font-size="20" fill="#8A8A8A" font-weight="normal" text-anchor="start">frame 2</text>
<rect x="930" y="286" width="300" height="52" rx="6" fill="#ffffff" stroke="#8A8A8A" stroke-width="2"/>
<text x="950" y="319" font-size="20" fill="#8A8A8A" font-weight="normal" text-anchor="start">frame 3</text>
<rect x="930" y="338" width="300" height="52" rx="6" fill="#ffffff" stroke="#8A8A8A" stroke-width="2"/>
<text x="950" y="371" font-size="20" fill="#8A8A8A" font-weight="normal" text-anchor="start">frame 4</text>
<rect x="930" y="390" width="300" height="52" rx="6" fill="#D8EAE1" stroke="#2D6A4F" stroke-width="3"/>
<text x="950" y="423" font-size="20" fill="#2D6A4F" font-weight="bold" text-anchor="start">frame 5: bytes 80 to 95</text>
<rect x="930" y="442" width="300" height="52" rx="6" fill="#ffffff" stroke="#8A8A8A" stroke-width="2"/>
<text x="950" y="475" font-size="20" fill="#8A8A8A" font-weight="normal" text-anchor="start">frame 6</text>
<rect x="930" y="494" width="300" height="52" rx="6" fill="#ffffff" stroke="#8A8A8A" stroke-width="2"/>
<text x="950" y="527" font-size="20" fill="#8A8A8A" font-weight="normal" text-anchor="start">frame 7</text>
<path d="M770,289 C850,289 850,416 924,416" stroke="#2D6A4F" stroke-width="3" fill="none" marker-end="url(#ahg)"/>
<text x="60" y="560" font-size="22" fill="#100D12" font-weight="bold" text-anchor="start">4. Physical address</text>
<rect x="60" y="580" width="120" height="64" rx="6" fill="#D8EAE1" stroke="#2D6A4F" stroke-width="2"/>
<text x="120" y="622" font-size="28" fill="#2D6A4F" font-weight="bold" text-anchor="middle" font-family="Menlo, Consolas, monospace">101</text>
<rect x="180" y="580" width="200" height="64" rx="6" fill="#ffffff" stroke="#100D12" stroke-width="2"/>
<text x="280" y="622" font-size="28" fill="#100D12" font-weight="bold" text-anchor="middle" font-family="Menlo, Consolas, monospace">1101</text>
<text x="120" y="676" font-size="21" fill="#2D6A4F" font-weight="bold" text-anchor="middle">frame = 5</text>
<text x="280" y="676" font-size="21" fill="#100D12" font-weight="bold" text-anchor="middle">offset = 13</text>
<text x="420" y="622" font-size="26" fill="#100D12" font-weight="bold" text-anchor="start">= 5 × 16 + 13 = 93</text>
<line x1="280" y1="232" x2="280" y2="574" stroke="#100D12" stroke-width="2" marker-end="url(#ah)" stroke-dasharray="8,6"/>
<text x="296" y="380" font-size="19" fill="#100D12" font-weight="normal" text-anchor="start">the offset</text>
<text x="296" y="404" font-size="19" fill="#100D12" font-weight="normal" text-anchor="start">does not change</text>
<text x="60" y="730" font-size="20" fill="#100D12" font-weight="normal" text-anchor="start">Same rule in PagedAttention: logical block = floor(t / B), offset = t mod B, physical block = block_table[logical block]</text>
</svg>