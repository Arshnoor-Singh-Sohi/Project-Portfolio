 Arial, sans-serif" font-size="20" fill="#100D12" font-weight="bold" text-anchor="middle">C</text><text x="694.0" y="302" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#100D12" font-weight="bold" text-anchor="middle">block 5</text><rect x="640" y="312" width="108" height="160" rx="0" fill="#FFFFFF" stroke="#100D12" stroke-width="2.5"/><rect x="646" y="317" width="96" height="30" rx="0" fill="#2D6A4F" stroke="#2D6A4F" stroke-width="1"/><text x="694.0" y="339" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#FFFFFF" font-weight="bold" text-anchor="middle">p5</text><rect x="646" y="357" width="96" height="30" rx="0" fill="#2D6A4F" stroke="#2D6A4F" stroke-width="1"/><text x="694.0" y="379" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#FFFFFF" font-weight="bold" text-anchor="middle">p6</text><rect x="646" y="397" width="96" height="30" rx="0" fill="#2D6A4F" stroke="#2D6A4F" stroke-width="1"/><text x="694.0" y="419" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#FFFFFF" font-weight="bold" text-anchor="middle">p7</text><rect x="646" y="437" width="96" height="30" rx="0" fill="#1E6091" stroke="#1E6091" stroke-width="1"/><text x="694.0" y="459" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#FFFFFF" font-weight="bold" text-anchor="middle">A1</text><text x="694.0" y="500" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" font-weight="bold" text-anchor="middle">A</text><text x="814.0" y="302" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#100D12" font-weight="normal" text-anchor="middle">block 6</text><rect x="760" y="312" width="108" height="160" rx="0" fill="none" stroke="#8A8A8A" stroke-width="2" stroke-dasharray="7 5"/><text x="814.0" y="398" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#8A8A8A" font-weight="normal" text-anchor="middle">free</text><text x="934.0" y="302" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#100D12" font-weight="bold" text-anchor="middle">block 7</text><rect x="880" y="312" width="108" height="160" rx="0" fill="#FFFFFF" stroke="#100D12" stroke-width="2.5"/><rect x="886" y="317" width="96" height="30" rx="0" fill="#2D6A4F" stroke="#2D6A4F" stroke-width="1"/><text x="934.0" y="339" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#FFFFFF" font-weight="bold" text-anchor="middle">p1</text><rect x="886" y="357" width="96" height="30" rx="0" fill="#2D6A4F" stroke="#2D6A4F" stroke-width="1"/><text x="934.0" y="379" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#FFFFFF" font-weight="bold" text-anchor="middle">p2</text><rect x="886" y="397" width="96" height="30" rx="0" fill="#2D6A4F" stroke="#2D6A4F" stroke-width="1"/><text x="934.0" y="419" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#FFFFFF" font-weight="bold" text-anchor="middle">p3</text><rect x="886" y="437" width="96" height="30" rx="0" fill="#2D6A4F" stroke="#2D6A4F" stroke-width="1"/><text x="934.0" y="459" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#FFFFFF" font-weight="bold" text-anchor="middle">p4</text><text x="934.0" y="500" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" font-weight="bold" text-anchor="middle">A, B</text><text x="1054.0" y="302" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#100D12" font-weight="normal" text-anchor="middle">block 8</text><rect x="1000" y="312" width="108" height="160" rx="0" fill="none" stroke="#8A8A8A" stroke-width="2" stroke-dasharray="7 5"/><text x="1054.0" y="398" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#8A8A8A" font-weight="normal" text-anchor="middle">free</text><text x="1174.0" y="302" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#100D12" font-weight="normal" text-anchor="middle">block 9</text><rect x="1120" y="312" width="108" height="160" rx="0" fill="none" stroke="#8A8A8A" stroke-width="2" stroke-dasharray="7 5"/><text x="1174.0" y="398" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#8A8A8A" font-weight="normal" text-anchor="middle">free</text><path d="M334.0,516 C334.0,572 694.0,572 694.0,522" stroke="#C81D25" stroke-width="2.5" fill="none" marker-end="url(#a-red)"/><text x="514.0" y="584" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#C81D25" font-weight="normal" text-anchor="middle">E4: A's first write hit a shared, partial block: copy it to block 5, then write</text><rect x="40" y="640" width="1200" height="96" rx="10" fill="#EEF4F8" stroke="#1E6091" stroke-width="2"/><text x="60" y="674" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1E6091" font-weight="bold" text-anchor="start">E3: paged attention for A reads blocks 7 then 5 through its block table:</text><text x="60" y="708" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" font-weight="normal" text-anchor="start">scores block by block, one softmax over all 8 positions, weighted sum of V. It equals dense attention.</text></svg>
