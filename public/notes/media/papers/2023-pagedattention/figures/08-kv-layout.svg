<text x="680" y="436" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="normal" text-anchor="start" fill="#100D12">One row = one dimension of 16 tokens, side by side.</text>
<text x="680" y="462" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="normal" text-anchor="start" fill="#100D12">A thread reads 8 neighboring tokens of one row</text>
<text x="680" y="488" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="normal" text-anchor="start" fill="#100D12">(16 bytes) and multiplies them by 8 softmax weights.</text>
<rect x="30" y="565" width="1220" height="230" rx="10" fill="white" stroke="#2D6A4F" stroke-width="2"/>
<text x="50" y="600" font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="bold" text-anchor="start" fill="#2D6A4F">Where the KV of one new token goes (kernel "reshape_and_cache"):</text>
<text x="50" y="634" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#100D12">slot = physical_block × B + offset   (the scheduler builds slot_mapping from the block tables)</text>
<text x="50" y="668" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#100D12">block = slot // B,   offset = slot % B,   for head h and element e of the head:</text>
<text x="50" y="702" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#100D12">key index   = (((block × H_kv + h) × (d_h / x) + e // x) × B + offset) × x + e % x</text>
<text x="50" y="736" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#100D12">value index = ((block × H_kv + h) × d_h + e) × B + offset</text>
<text x="50" y="770" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="normal" text-anchor="start" fill="#100D12">Each layer has its own key tensor and value tensor. The same block number is used in every layer.</text>
</svg>
