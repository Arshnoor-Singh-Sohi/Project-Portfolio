<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 900" width="1280" height="900" role="img" aria-label="PagedAttention at a glance: the waste of contiguous KV allocation, the idea of KV blocks and block tables, the three mechanisms, the measured result and the later work">
<title>PagedAttention: the paper at a glance</title>
<defs><marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#100D12"/></marker></defs>
<rect x="0" y="0" width="1280" height="900" fill="#FFFFFF"/>
<text x="640.0" y="46" font-family="Helvetica, Arial, sans-serif" font-size="30" fill="#100D12" font-weight="bold" text-anchor="middle">PagedAttention (SOSP 2023): the paper at a glance</text>
<rect x="25" y="78" width="390" height="392" rx="12" fill="#FFFFFF" stroke="#C81D25" stroke-width="2.5"/>
<text x="42" y="108" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#C81D25" font-weight="bold" text-anchor="start">The problem: contiguous chunks</text>
<text x="42" y="135" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" font-weight="normal" text-anchor="start">Before vLLM, each request reserved</text>
<text x="42" y="160" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" font-weight="normal" text-anchor="start">one contiguous chunk of KV memory</text>
<text x="42" y="185" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" font-weight="normal" text-anchor="start">for its maximum length (2048 tokens).</text>
<rect x="42" y="208" width="72.6" height="34" fill="#2D6A4F"/>
<rect x="114.6" y="208" width="283.4" height="34" fill="#C81D25" fill-opacity="0.18" stroke="#C81D25" stroke-width="2"/>
<rect x="42" y="208" width="356" height="34" fill="none" stroke="#100D12" stroke-width="1.5"/>
<text x="78.312" y="232" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#FFFFFF" font-weight="bold" text-anchor="middle">20.4%</text>
<text x="256.312" y="232" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#C81D25" font-weight="bold" text-anchor="middle">79.6% wasted</text>
<text x="42" y="266" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#100D12" font-weight="normal" text-anchor="start">Orca (Max), Figure 2 of the paper</text>
<text x="42" y="302" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" font-weight="normal" text-anchor="start">Only 20.4% to 38.2% of KV memory</text>
<text x="42" y="327" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" font-weight="normal" text-anchor="start">holds token states, so about 60% to</text>
<text x="42" y="352" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" font-weight="normal" text-anchor="start">80% is wasted: reservation, internal</text>
<text x="42" y="377" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" font-weight="normal" text-anchor="start">and external fragmentation.</text>
<text x="42" y="402" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" font-weight="bold" text-anchor="start">OPT-13B: 800 KiB of KV per token.</text>
<rect x="445" y="78" width="390" height="392" rx="12" fill="#FFFFFF" stroke="#2D6A4F" stroke-width="2.5"/>
<text x="462" y="108" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#2D6A4F" font-weight="bold" text-anchor="start">The idea: paging for the KV cache</text>
<text x="462" y="135" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" font-weight="normal" text-anchor="start">Fixed-size KV blocks of B tokens</text>
<text x="462" y="160" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" font-weight="normal" text-anchor="start">(B = 16 by default), anywhere in a pool.</text>
<text x="462" y="185" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" font-weight="normal" text-anchor="start">A block table per request maps logical</text>
<text x="462" y="210" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" font-weight="normal" text-anchor="start">blocks to physical blocks.</text>
<text x="462" y="260" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#100D12" font-weight="bold" text-anchor="start">Logical</text>
<text x="462" y="322" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#100D12" font-weight="bold" text-anchor="start">Table</text>
<rect x="575" y="237" width="44" height="32" rx="4" fill="#FFFFFF" stroke="#100D12" stroke-width="2"/>
<text x="597" y="260" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#100D12" font-weight="normal" text-anchor="middle">0</text>
<rect x="575" y="299" width="44" height="32" rx="4" fill="#FFFFFF" stroke="#2D6A4F" stroke-width="2"/>
<text x="597" y="322" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#2D6A4F" font-weight="bold" text-anchor="middle">7</text>
<line x1="597" y1="271" x2="597" y2="296" stroke="#100D12" stroke-width="3" marker-end="url(#a-ink)"/>
<rect x="635" y="237" width="44" height="32" rx="4" fill="#FFFFFF" stroke="#100D12" stroke-width="2"/>
<text x="657" y="260" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#100D12" font-weight="normal" text-anchor="middle">1</text>
<rect x="635" y="299" width="44" height="32" rx="4" fill="#FFFFFF" stroke="#2D6A4F" stroke-width="2"/>
<text x="657" y="322" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#2D6A4F" font-weight="bold" text-anchor="middle">1</text>
<line x1="657" y1="271" x2="657" y2="296" stroke="#100D12" stroke-width="3" marker-end="url(#a-ink)"/>
<rect x="695" y="237" width="44" height="32" rx="4" fill="#FFFFFF" stroke="#100D12" stroke-width="2"/>
<text x="717" y="260" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#100D12" font-weight="normal" text-anchor="middle">2</text>
<rect x="695" y="299" width="44" height="32" rx="4" fill="#FFFFFF" stroke="#2D6A4F" stroke-width="2"/>
<text x="717" y="322" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#2D6A4F" font-weight="bold" text-anchor="middle">3</text>
<line x1="717" y1="271" x2="717" y2="296" stroke="#100D12" stroke-width="3" marker-end="url(#a-ink)"/>
<text x="462" y="361" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#100D12" font-weight="bold" text-anchor="start">Physical pool:</text>
<rect x="462" y="369" width="34" height="32" rx="4" fill="#FFFFFF" stroke="#8A8A8A" stroke-width="2" stroke-dasharray="5 4"/>
<text x="479" y="392" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#8A8A8A" font-weight="normal" text-anchor="middle">0</text>
<rect x="502" y="369" width="34" height="32" rx="4" fill="#2D6A4F" stroke="#2D6A4F" stroke-width="2"/>
<text x="519" y="392" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#FFFFFF" font-weight="bold" text-anchor="middle">1</text>
<rect x="542" y="369" width="34" height="32" rx="4" fill="#FFFFFF" stroke="#8A8A8A" stroke-width="2" stroke-dasharray="5 4"/>
<text x="559" y="392" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#8A8A8A" font-weight="normal" text-anchor="middle">2</text>
<rect x="582" y="369" width="34" height="32" rx="4" fill="#2D6A4F" stroke="#2D6A4F" stroke-width="2"/>
<text x="599" y="392" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#FFFFFF" font-weight="bold" text-anchor="middle">3</text>
<rect x="622" y="369" width="34" height="32" rx="4" fill="#FFFFFF" stroke="#8A8A8A" stroke-width="2" stroke-dasharray="5 4"/>
<text x="639" y="392" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#8A8A8A" font-weight="normal" text-anchor="middle">4</text>
<rect x="662" y="369" width="34" height="32" rx="4" fill="#FFFFFF" stroke="#8A8A8A" stroke-width="2" stroke-dasharray="5 4"/>
<text x="679" y="392" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#8A8A8A" font-weight="normal" text-anchor="middle">5</text>
<rect x="702" y="369" width="34" height="32" rx="4" fill="#FFFFFF" stroke="#8A8A8A" stroke-width="2" stroke-dasharray="5 4"/>
<text x="719" y="392" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#8A8A8A" font-weight="normal" text-anchor="middle">6</text>
<rect x="742" y="369" width="34" height="32" rx="4" fill="#2D6A4F" stroke="#2D6A4F" stroke-width="2"/>
<text x="759" y="392" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#FFFFFF" font-weight="bold" text-anchor="middle">7</text>
<rect x="782" y="369" width="34" height="32" rx="4" fill="#FFFFFF" stroke="#8A8A8A" stroke-width="2" stroke-dasharray="5 4"/>
<text x="799" y="392" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#8A8A8A" font-weight="normal" text-anchor="middle">8</text>
<text x="462" y="429" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" font-weight="normal" text-anchor="start">Like OS paging: blocks = pages,</text>
<text x="462" y="454" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" font-weight="normal" text-anchor="start">tokens = bytes, requests = processes.</text>
<rect x="865" y="78" width="390" height="392" rx="12" fill="#FFFFFF" stroke="#100D12" stroke-width="2.5"/>
<text x="882" y="108" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" font-weight="bold" text-anchor="start">The mechanisms (§4)</text>
<text x="882" y="140" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#2D6A4F" font-weight="bold" text-anchor="start">1. Allocation on demand</text>
<text x="882" y="165" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" font-weight="normal" text-anchor="start">A new block only when the last block</text>
<text x="882" y="190" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" font-weight="normal" text-anchor="start">is full. Waste: under one block.</text>
<text x="882" y="227" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#6A4C93" font-weight="bold" text-anchor="start">2. Sharing</text>
<text x="882" y="252" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" font-weight="normal" text-anchor="start">Reference counts and copy-on-write.</text>
<text x="882" y="277" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" font-weight="normal" text-anchor="start">Samples and beams share blocks.</text>
<text x="882" y="314" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#C81D25" font-weight="bold" text-anchor="start">3. Preemption</text>
<text x="882" y="339" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" font-weight="normal" text-anchor="start">No free block: evict all blocks of the</text>
<text x="882" y="364" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" font-weight="normal" text-anchor="start">latest request (FCFS). Swap them to</text>
<text x="882" y="389" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" font-weight="normal" text-anchor="start">CPU memory, or recompute them later.</text>
<line x1="417" y1="268" x2="442" y2="268" stroke="#100D12" stroke-width="3" marker-end="url(#a-ink)"/>
<line x1="837" y1="268" x2="862" y2="268" stroke="#100D12" stroke-width="3" marker-end="url(#a-ink)"/>
<rect x="25" y="500" width="600" height="315" rx="12" fill="#FFFFFF" stroke="#1E6091" stroke-width="2.5"/>
<text x="42" y="530" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1E6091" font-weight="bold" text-anchor="start">The result (§6, §7)</text>
<text x="42" y="557" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1E6091" font-weight="bold" text-anchor="start">2-4× throughput at the same latency,</text>
<text x="42" y="582" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" font-weight="normal" text-anchor="start">against FasterTransformer and Orca.</text>
<text x="42" y="607" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" font-weight="normal" text-anchor="start">96.3% of KV memory holds token states,</text>
<text x="42" y="632" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" font-weight="normal" text-anchor="start">so the waste is under 4%. The attention</text>
<text x="42" y="657" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" font-weight="normal" text-anchor="start">kernel is 20-26% slower, but only attention.</text>
<text x="42" y="688" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#100D12" font-weight="bold" text-anchor="start">Batched requests, OPT-13B, ShareGPT:</text>
<text x="42" y="723" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#100D12" font-weight="normal" text-anchor="start">Orca (Max)</text>
<rect x="185" y="706" width="69.0" height="24" fill="#C81D25"/>
<text x="262.0335305719921" y="725" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#C81D25" font-weight="bold" text-anchor="start">7.00</text>
<text x="42" y="755" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#100D12" font-weight="normal" text-anchor="start">Orca (Oracle)</text>
<rect x="185" y="738" width="134.3" height="24" fill="#B8860B"/>
<text x="327.3195266272189" y="757" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#B8860B" font-weight="bold" text-anchor="start">13.62</text>
<text x="42" y="787" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#100D12" font-weight="normal" text-anchor="start">vLLM</text>
<rect x="185" y="770" width="300.0" height="24" fill="#1E6091"/>
<text x="493.0" y="789" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1E6091" font-weight="bold" text-anchor="start">30.42</text>
<rect x="655" y="500" width="600" height="315" rx="12" fill="#FFFFFF" stroke="#6A4C93" stroke-width="2.5"/>
<text x="672" y="530" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#6A4C93" font-weight="bold" text-anchor="start">What came after (page 10)</text>
<text x="672" y="562" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#6A4C93" font-weight="bold" text-anchor="start">Dec 2023</text>
<text x="785" y="562" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" font-weight="bold" text-anchor="start">RadixAttention (SGLang)</text>
<text x="785" y="586" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" font-weight="normal" text-anchor="start">a radix tree of prefixes for KV reuse</text>
<text x="672" y="612" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#6A4C93" font-weight="bold" text-anchor="start">Mar 2024</text>
<text x="785" y="612" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" font-weight="bold" text-anchor="start">Automatic prefix caching</text>
<text x="785" y="636" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" font-weight="normal" text-anchor="start">vLLM 0.4.0, chained block hashes</text>
<text x="672" y="662" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#6A4C93" font-weight="bold" text-anchor="start">May 2024</text>
<text x="785" y="662" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" font-weight="bold" text-anchor="start">vAttention</text>
<text x="785" y="686" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" font-weight="normal" text-anchor="start">paging by the CUDA driver</text>
<text x="672" y="712" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#6A4C93" font-weight="bold" text-anchor="start">Jan 2025</text>
<text x="785" y="712" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" font-weight="bold" text-anchor="start">vLLM V1 engine</text>
<text x="785" y="736" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" font-weight="normal" text-anchor="start">prefix caching on by default</text>
<text x="672" y="770" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" font-weight="normal" text-anchor="start">vLLM 0.31.0 (2026): the block size is still 16,</text>
<text x="672" y="795" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" font-weight="normal" text-anchor="start">and preemption recomputes by default.</text>
<line x1="985" y1="472" x2="585" y2="497" stroke="#100D12" stroke-width="3" marker-end="url(#a-ink)"/>
<line x1="627" y1="650" x2="652" y2="650" stroke="#100D12" stroke-width="3" marker-end="url(#a-ink)"/>
<rect x="25" y="835" width="1230" height="50" rx="12" fill="#F7F5F0" stroke="#100D12" stroke-width="2.5"/>
<text x="640" y="867" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" font-weight="bold" text-anchor="middle">Main idea: page the KV cache. Less waste, larger batches, 2-4× throughput. Attention stays exact.</text>
</svg>