<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-label="The paper at a glance: the question, the open-model study, the two mechanisms on the star graph, the catalyst, the temperature verdict and the engineering lessons"><title>Why reasoning models loop: the paper at a glance</title><defs><marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#100D12"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E6091"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C81D25"/></marker><marker id="a-gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B8860B"/></marker></defs><rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/><text x="640" y="44" font-family="Helvetica, Arial, sans-serif" font-size="30" fill="#100D12" font-weight="bold" text-anchor="middle">Why reasoning models loop: the paper at a glance</text><rect x="25" y="75" width="330" height="175" rx="12" fill="#F7F5F0" stroke="#100D12" stroke-width="2.5"/><text x="42" y="105" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" font-weight="bold" text-anchor="start">The question</text><text x="42" y="130" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" font-weight="normal" text-anchor="start">Why do reasoning models repeat</text><text x="42" y="155" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" font-weight="normal" text-anchor="start">text until the budget ends, mostly</text><text x="42" y="180" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" font-weight="normal" text-anchor="start">at low temperature?</text><text x="42" y="205" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" font-weight="normal" text-anchor="start">Is temperature a cure,</text><text x="42" y="230" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" font-weight="normal" text-anchor="start">or only a stopgap?</text><rect x="25" y="275" width="330" height="320" rx="12" fill="#FFFFFF" stroke="#1E6091" stroke-width="2.5"/><text x="42" y="305" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1E6091" font-weight="bold" text-anchor="start">Part 1: 13 open models, AIME</text><text x="42" y="330" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" font-weight="normal" text-anchor="start">Greedy looping fraction:</text><text x="42" y="355" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" font-weight="normal" text-anchor="start">every reasoning model loops,</text><text x="42" y="380" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1E6091" font-weight="normal" text-anchor="start">from 0.04 (QwQ-32B)</text><text x="42" y="405" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#C81D25" font-weight="normal" text-anchor="start">to 0.76 (Distill Qwen 1.5B).</text><text x="42" y="440" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" font-weight="normal" text-anchor="start">Student OpenThinker3-1.5B:</text><text x="42" y="465" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#C81D25" font-weight="normal" text-anchor="start">0.30, against 0.04 for its</text><text x="42" y="490" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1E6091" font-weight="normal" text-anchor="start">teacher QwQ-32B.</text><text x="42" y="525" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" font-weight="normal" text-anchor="start">In a family, larger models</text><text x="42" y="550" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" font-weight="normal" text-anchor="start">loop less. Hard problems</text><text x="42" y="575" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" font-weight="normal" text-anchor="start">loop more.</text><rect x="390" y="75" width="510" height="160" rx="12" fill="#FFFFFF" stroke="#C81D25" stroke-width="2.5"/><text x="407" y="105" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#C81D25" font-weight="bold" text-anchor="start">Why 1: risk aversion (hard action)</text><text x="407" y="130" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" font-weight="normal" text-anchor="start">The student cannot tell the correct child from</text><text x="407" y="155" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" font-weight="normal" text-anchor="start">n look-alikes, so it gives each one (1 − p)/n.</text><text x="407" y="180" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#C81D25" font-weight="normal" text-anchor="start">0.7 / 5 = 0.14 is below the reset 0.3:</text><text x="407" y="205" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" font-weight="normal" text-anchor="start">greedy decoding picks the reset every time.</text><rect x="390" y="255" width="510" height="160" rx="12" fill="#FFFFFF" stroke="#C81D25" stroke-width="2.5"/><text x="407" y="285" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#C81D25" font-weight="bold" text-anchor="start">Why 2: temporally correlated errors</text><text x="407" y="310" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" font-weight="normal" text-anchor="start">No hard action: each child should get 0.2.</text><text x="407" y="335" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" font-weight="normal" text-anchor="start">The student learns about 0.2 ± 0.05. Its top-1 child</text><text x="407" y="360" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#C81D25" font-weight="normal" text-anchor="start">is the same in 96.7% of consecutive visits.</text><text x="407" y="385" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" font-weight="normal" text-anchor="start">Greedy decoding takes the same spoke again.</text><rect x="390" y="435" width="510" height="160" rx="12" fill="#FFFFFF" stroke="#B8860B" stroke-width="2.5"/><text x="407" y="465" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#B8860B" font-weight="bold" text-anchor="start">The catalyst: confidence grows in a loop</text><text x="407" y="490" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" font-weight="normal" text-anchor="start">In real traces the top-1 probability rises</text><text x="407" y="515" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" font-weight="normal" text-anchor="start">toward 1 after a loop begins. Looping traces</text><text x="407" y="540" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" font-weight="normal" text-anchor="start">in 0.001 of the training data make the model</text><text x="407" y="565" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" font-weight="normal" text-anchor="start">almost sure to continue a loop.</text><text x="645" y="622" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" font-weight="bold" text-anchor="middle">Part 2: a star-graph task with a known teacher</text><rect x="935" y="75" width="320" height="300" rx="12" fill="#FFFFFF" stroke="#B8860B" stroke-width="2.5"/><text x="952" y="105" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#B8860B" font-weight="bold" text-anchor="start">Temperature: a stopgap</text><text x="952" y="130" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" font-weight="normal" text-anchor="start">Sampling breaks the loop,</text><text x="952" y="155" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" font-weight="normal" text-anchor="start">but it keeps the order of the</text><text x="952" y="180" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" font-weight="normal" text-anchor="start">learned probabilities.</text><text x="952" y="215" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" font-weight="normal" text-anchor="start">Length at T = 1:</text><text x="952" y="240" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#C81D25" font-weight="normal" text-anchor="start">learned 105.5</text><text x="952" y="265" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#6A4C93" font-weight="normal" text-anchor="start">perfect learner 24.8</text><text x="952" y="290" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" font-weight="normal" text-anchor="start">ratio about 4.25 (Why 1)</text><text x="952" y="325" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" font-weight="normal" text-anchor="start">44.7 against 27.7:</text><text x="952" y="350" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" font-weight="normal" text-anchor="start">about 1.6 (Why 2)</text><rect x="935" y="395" width="320" height="200" rx="12" fill="#FFFFFF" stroke="#1E6091" stroke-width="2.5"/><text x="952" y="425" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1E6091" font-weight="bold" text-anchor="start">For engineers</text><text x="952" y="450" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" font-weight="normal" text-anchor="start">Never decode at temperature 0.</text><text x="952" y="475" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" font-weight="normal" text-anchor="start">Detect loops: n-gram repeats.</text><text x="952" y="500" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" font-weight="normal" text-anchor="start">A loop costs the full budget.</text><text x="952" y="525" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" font-weight="normal" text-anchor="start">Authors suggest: hints,</text><text x="952" y="550" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" font-weight="normal" text-anchor="start">curricula, better traces.</text><line x1="355" y1="165" x2="385" y2="155" stroke="#100D12" stroke-width="3" marker-end="url(#a-ink)"/><line x1="355" y1="440" x2="385" y2="340" stroke="#100D12" stroke-width="3" marker-end="url(#a-ink)"/><line x1="900" y1="155" x2="930" y2="190" stroke="#100D12" stroke-width="3" marker-end="url(#a-ink)"/><line x1="900" y1="515" x2="930" y2="495" stroke="#100D12" stroke-width="3" marker-end="url(#a-ink)"/><rect x="25" y="640" width="1230" height="60" rx="12" fill="#F7F5F0" stroke="#100D12" stroke-width="2"/><text x="640" y="678" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" font-weight="bold" text-anchor="middle">Main claim: errors in learning are a key cause of looping. Temperature hides them. The authors suggest fixes at training time.</text></svg>