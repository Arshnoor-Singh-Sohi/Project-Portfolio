<text x="640" y="98" font-size="20" fill="#100D12" font-weight="bold" text-anchor="middle">rank 0 receives each request</text>
<text x="640" y="122" font-size="20" fill="#100D12" font-weight="normal" text-anchor="middle">and broadcasts it to all TP ranks</text>
