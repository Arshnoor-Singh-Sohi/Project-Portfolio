<rect x="750" y="485" width="7.4399999999999995" height="48" rx="4" fill="#F6EBD0" stroke="#B8860B" stroke-width="2"/>
<text x="770" y="516" font-size="20" fill="#100D12" font-weight="normal" text-anchor="start">input 1,002</text>
