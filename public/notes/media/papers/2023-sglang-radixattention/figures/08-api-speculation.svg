<text x="597.0" y="586" font-size="19" fill="#6A4C93" font-weight="bold" text-anchor="middle">\nJob: 3</text>
<rect x="656" y="555" width="95" height="48" rx="4" fill="#ffffff" stroke="#100D12" stroke-width="2"/>
<text x="703.5" y="586" font-size="19" fill="#100D12" font-weight="bold" text-anchor="middle">job: 3</text>
<rect x="755" y="555" width="300" height="48" rx="4" fill="#F1F1F1" stroke="#8A8A8A" stroke-width="2" stroke-dasharray="8,5"/>
<text x="905.0" y="586" font-size="19" fill="#8A8A8A" font-weight="bold" text-anchor="middle">extra, up to 64 in all</text>
<text x="130" y="635" font-size="20" fill="#100D12" font-weight="normal" text-anchor="start">Purple: the template's constant text, which the interpreter checks. Ink: the values it keeps.</text>
<text x="40" y="695" font-size="21" fill="#100D12" font-weight="bold" text-anchor="start">Total: 1 call, input 1,002 tokens (3,028 / 1,002: about 3.02 times fewer), output at most 64 tokens.</text>
<text x="40" y="727" font-size="20" fill="#100D12" font-weight="normal" text-anchor="start">Break-even: saved 2,026 input tokens against at most 52 extra output tokens, so an output price below about 38.96 x input.</text>
<text x="40" y="759" font-size="19" fill="#8A8A8A" font-weight="normal" text-anchor="start">Token counts are choices of these notes. Bars are not to scale.</text>
