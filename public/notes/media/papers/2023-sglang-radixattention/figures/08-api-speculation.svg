<text x="1059" y="316" font-size="20" fill="#100D12" font-weight="normal" text-anchor="start">output 3</text>
<text x="40" y="385" font-size="21" fill="#100D12" font-weight="bold" text-anchor="start">Total: 3 calls, input 1,002 + 1,009 + 1,017 = 3,028 tokens, output 12 tokens.</text>
<text x="40" y="455" font-size="22" fill="#100D12" font-weight="bold" text-anchor="start">With speculation: one call, the model writes past the first stop string</text>
<text x="40" y="517" font-size="20" fill="#100D12" font-weight="bold" text-anchor="start">call 1</text>
<rect x="130" y="485" width="620.0" height="48" rx="4" fill="#F6EBD0" stroke="#B8860B" stroke-width="2"/>
