<rect x="130" y="285" width="620.0" height="48" rx="4" fill="#F8DEDF" stroke="#C81D25" stroke-width="2" stroke-dasharray="8,5"/>
<text x="440.0" y="316" font-size="20" fill="#C81D25" font-weight="bold" text-anchor="middle">context 1,000, billed again</text>
<rect x="750.0" y="285" width="63.239999999999995" height="48" rx="4" fill="#F6EBD0" stroke="#B8860B" stroke-width="2"/>
<text x="825.24" y="316" font-size="20" fill="#100D12" font-weight="normal" text-anchor="start">input 1,017</text>
