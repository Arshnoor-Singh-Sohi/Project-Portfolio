<text x="640.0" y="44" font-size="28" fill="#100D12" font-weight="bold" text-anchor="middle">API speculative execution: one call instead of three</text>
<text x="40" y="95" font-size="22" fill="#100D12" font-weight="bold" text-anchor="start">Without speculation: one API call per gen, each resends the context</text>
<text x="40" y="157" font-size="20" fill="#100D12" font-weight="bold" text-anchor="start">call 1</text>
