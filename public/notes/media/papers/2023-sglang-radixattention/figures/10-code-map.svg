<rect x="0" y="0" width="1280" height="960" fill="#FFFFFF"/>
<text x="640.0" y="44" font-family="Helvetica, Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="middle" fill="#100D12">From the paper to the code of SGLang 0.5.22</text>
