<text x="640.0" y="46" font-family="Helvetica, Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="middle" fill="#100D12">Order decides hits: FCFS against longest-shared-prefix-first</text>
<text x="640" y="82" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="normal" text-anchor="middle" fill="#100D12">Pool of 150 slots. P and Q are 100-token prefixes. Each request: prefix + 10 new prompt tokens + 10 output tokens.</text>
