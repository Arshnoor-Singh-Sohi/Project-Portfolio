<text x="40" y="300" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#100D12">Every request recomputes its prefix: 660 prompt tokens computed.</text>
<text x="40" y="540" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#100D12">Each prefix is computed once: 260 prompt tokens computed. This is the lower bound.</text>
<rect x="120" y="600" width="40" height="30" rx="4" fill="#1E6091" fill-opacity="1" stroke="#1E6091" stroke-width="2"/>
<text x="172" y="622" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#100D12">prefix reused (hit)</text>
<rect x="450" y="600" width="40" height="30" rx="4" fill="#B8860B" fill-opacity="1" stroke="#B8860B" stroke-width="2"/>
<text x="502" y="622" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#100D12">computed now (prefill)</text>
<text x="780" y="622" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#C81D25">red text: a prefix evicted before the request runs</text>
<text x="640" y="662" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" text-anchor="middle" fill="#100D12">Small gold box: the 10 new prompt tokens of each request, always computed.</text>
<text x="640" y="692" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" text-anchor="middle" fill="#100D12">FCFS needs a pool of 240 slots to keep both prefixes. LPM reaches the bound with 150.</text>
