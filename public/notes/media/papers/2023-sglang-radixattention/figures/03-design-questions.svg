<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 680" width="1280" height="680">
<defs><marker id="ah2D6A4F" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2D6A4F"/></marker><marker id="ah1E6091" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E6091"/></marker><marker id="ahB8860B" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B8860B"/></marker><marker id="ahC81D25" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C81D25"/></marker><marker id="ah8A8A8A" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A8A8A"/></marker><marker id="ah6A4C93" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6A4C93"/></marker><marker id="ah100D12" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#100D12"/></marker></defs>
<rect x="0.0" y="0.0" width="1280.0" height="680.0" rx="0" fill="white" stroke="none" stroke-width="2"/>
<text x="640.0" y="44.0" font-family="Helvetica, Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="middle" fill="#100D12">Automatic KV reuse across calls: five design questions</text>
<text x="640.0" y="78.0" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" text-anchor="middle" fill="#100D12">“neither free nor trivial, as it requires additional storage and more complex memory management” (paper)</text>
<rect x="240.0" y="102.0" width="800.0" height="76.0" rx="10" fill="#FFFFFF" stroke="#100D12" stroke-width="2"/>
<text x="640.0" y="134.0" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" fill="#100D12">Keep the KV cache of finished calls and reuse it</text>
<text x="640.0" y="162.0" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" fill="#100D12">automatically in later calls that share a prefix</text>
<path d="M640,178 L640,206 L144.0,206 L144.0,226" fill="none" stroke="#100D12" stroke-width="2" marker-end="url(#ah100D12)"/>
<rect x="28.0" y="230.0" width="232.0" height="236.0" rx="8" fill="#E3F0E9" stroke="#2D6A4F" stroke-width="2"/>
<text x="144.0" y="264.0" font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="bold" text-anchor="middle" fill="#100D12">1. Where is it</text>
<text x="144.0" y="291.0" font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="bold" text-anchor="middle" fill="#100D12">stored?</text>
<text x="144.0" y="350.0" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="normal" text-anchor="middle" fill="#100D12">one GPU pool, shared</text>
<text x="144.0" y="377.0" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="normal" text-anchor="middle" fill="#100D12">with running requests</text>
<text x="144.0" y="446.0" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#100D12">→ pages 04, 05</text>
<path d="M640,178 L640,206 L392.0,206 L392.0,226" fill="none" stroke="#100D12" stroke-width="2" marker-end="url(#ah100D12)"/>
<rect x="276.0" y="230.0" width="232.0" height="236.0" rx="8" fill="#E1ECF4" stroke="#1E6091" stroke-width="2"/>
<text x="392.0" y="264.0" font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="bold" text-anchor="middle" fill="#100D12">2. How is the</text>
<text x="392.0" y="291.0" font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="bold" text-anchor="middle" fill="#100D12">match found?</text>
<text x="392.0" y="350.0" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="normal" text-anchor="middle" fill="#100D12">radix tree on the CPU,</text>
<text x="392.0" y="377.0" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="normal" text-anchor="middle" fill="#100D12">longest prefix, any length</text>
<text x="392.0" y="446.0" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#100D12">→ pages 01, 04</text>
<path d="M640,178 L640,206 L640.0,206 L640.0,226" fill="none" stroke="#100D12" stroke-width="2" marker-end="url(#ah100D12)"/>
<rect x="524.0" y="230.0" width="232.0" height="236.0" rx="8" fill="#F8DDDF" stroke="#C81D25" stroke-width="2" stroke-dasharray="8 6"/>
<text x="640.0" y="264.0" font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="bold" text-anchor="middle" fill="#C81D25">3. What is</text>
<text x="640.0" y="291.0" font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="bold" text-anchor="middle" fill="#C81D25">evicted?</text>
<text x="640.0" y="350.0" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="normal" text-anchor="middle" fill="#100D12">LRU leaves first,</text>
<text x="640.0" y="377.0" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="normal" text-anchor="middle" fill="#100D12">never a node in use</text>
<text x="640.0" y="446.0" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#100D12">→ page 05</text>
<path d="M640,178 L640,206 L888.0,206 L888.0,226" fill="none" stroke="#100D12" stroke-width="2" marker-end="url(#ah100D12)"/>
<rect x="772.0" y="230.0" width="232.0" height="236.0" rx="8" fill="#FFFFFF" stroke="#100D12" stroke-width="2"/>
<text x="888.0" y="264.0" font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="bold" text-anchor="middle" fill="#100D12">4. In what order</text>
<text x="888.0" y="291.0" font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="bold" text-anchor="middle" fill="#100D12">do requests run?</text>
<text x="888.0" y="350.0" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="normal" text-anchor="middle" fill="#100D12">longest shared prefix</text>
<text x="888.0" y="377.0" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="normal" text-anchor="middle" fill="#100D12">first, close to DFS</text>
<text x="888.0" y="446.0" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#100D12">→ page 06</text>
<path d="M640,178 L640,206 L1136.0,206 L1136.0,226" fill="none" stroke="#100D12" stroke-width="2" marker-end="url(#ah100D12)"/>
<rect x="1020.0" y="230.0" width="232.0" height="236.0" rx="8" fill="#ECE6F3" stroke="#6A4C93" stroke-width="2"/>
<text x="1136.0" y="264.0" font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="bold" text-anchor="middle" fill="#100D12">5. How can the</text>
<text x="1136.0" y="291.0" font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="bold" text-anchor="middle" fill="#100D12">program help?</text>
<text x="1136.0" y="350.0" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="normal" text-anchor="middle" fill="#100D12">frontend hints, routing</text>
<text x="1136.0" y="377.0" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="normal" text-anchor="middle" fill="#100D12">across GPUs</text>
<text x="1136.0" y="446.0" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#100D12">→ page 07</text>
<text x="640.0" y="516.0" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" fill="#100D12">Requirements that every answer must keep</text>
<rect x="199.2" y="545.0" width="142.7" height="44.0" rx="22" fill="white" stroke="#100D12" stroke-width="1.5"/>
<text x="270.5" y="574.0" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="normal" text-anchor="middle" fill="#100D12">exact reuse</text>
<rect x="359.9" y="545.0" width="202.0" height="44.0" rx="22" fill="white" stroke="#100D12" stroke-width="1.5"/>
<text x="460.9" y="574.0" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="normal" text-anchor="middle" fill="#100D12">any prefix length</text>
<rect x="579.8" y="545.0" width="221.7" height="44.0" rx="22" fill="white" stroke="#100D12" stroke-width="1.5"/>
<text x="690.7" y="574.0" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="normal" text-anchor="middle" fill="#100D12">multi-level sharing</text>
<rect x="819.6" y="545.0" width="261.2" height="44.0" rx="22" fill="white" stroke="#100D12" stroke-width="1.5"/>
<text x="950.2" y="574.0" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="normal" text-anchor="middle" fill="#100D12">no manual configuration</text>
<rect x="195.6" y="610.0" width="310.6" height="44.0" rx="22" fill="white" stroke="#100D12" stroke-width="1.5"/>
<text x="350.9" y="639.0" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="normal" text-anchor="middle" fill="#100D12">negligible cost without hits</text>
<rect x="524.2" y="610.0" width="330.4" height="44.0" rx="22" fill="white" stroke="#100D12" stroke-width="1.5"/>
<text x="689.4" y="639.0" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="normal" text-anchor="middle" fill="#100D12">continuous batching and paging</text>
<rect x="872.6" y="610.0" width="211.8" height="44.0" rx="22" fill="white" stroke="#100D12" stroke-width="1.5"/>
<text x="978.5" y="639.0" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="normal" text-anchor="middle" fill="#100D12">tensor parallelism</text>
</svg>
