<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 900" width="1280" height="900" font-family="Helvetica, Arial, sans-serif"><defs><marker id="ar" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#100D12"/></marker></defs><rect width="1280" height="900" fill="#FFFFFF"/><text x="640" y="46" font-size="30" fill="#100D12" font-weight="bold" text-anchor="middle">SGLang and RadixAttention (2023) at a glance</text><rect x="30" y="80" width="590" height="300" rx="12" fill="#FFFFFF" stroke="#C81D25" stroke-width="2.5"/><text x="50" y="116" font-size="24" fill="#C81D25" font-weight="bold" text-anchor="start">The problem</text><text x="50" y="152" font-size="20" fill="#100D12" font-weight="normal" text-anchor="start">LM programs call the model many times,</text><text x="50" y="180" font-size="20" fill="#100D12" font-weight="normal" text-anchor="start">and the calls share long prefixes:</text><circle cx="62" cy="208" r="5" fill="#1E6091"/><text x="76" y="214" font-size="20" fill="#100D12" font-weight="normal" text-anchor="start">few-shot examples</text><circle cx="62" cy="236" r="5" fill="#1E6091"/><text x="76" y="242" font-size="20" fill="#100D12" font-weight="normal" text-anchor="start">chat history</text><circle cx="62" cy="264" r="5" fill="#1E6091"/><text x="76" y="270" font-size="20" fill="#100D12" font-weight="normal" text-anchor="start">self-consistency samples</text><circle cx="62" cy="292" r="5" fill="#1E6091"/><text x="76" y="298" font-size="20" fill="#100D12" font-weight="normal" text-anchor="start">tree-of-thought branches</text><circle cx="62" cy="320" r="5" fill="#1E6091"/><text x="76" y="326" font-size="20" fill="#100D12" font-weight="normal" text-anchor="start">agent templates</text><text x="330" y="214" font-size="20" fill="#C81D25" font-weight="normal" text-anchor="start">Engines discarded the KV</text><text x="330" y="242" font-size="20" fill="#C81D25" font-weight="normal" text-anchor="start">cache after each request.</text><text x="330" y="284" font-size="20" fill="#C81D25" font-weight="normal" text-anchor="start">So every call computed</text><text x="330" y="312" font-size="20" fill="#C81D25" font-weight="normal" text-anchor="start">the shared prefix again.</text><rect x="660" y="80" width="590" height="305" rx="12" fill="#FFFFFF" stroke="#2D6A4F" stroke-width="2.5"/><text x="680" y="116" font-size="24" fill="#2D6A4F" font-weight="bold" text-anchor="start">The idea: a radix tree of KV caches</text><rect x="690" y="175" width="70" height="36" rx="8" fill="#FFFFFF" stroke="#100D12" stroke-width="2.5"/><text x="725.0" y="200" font-size="19" fill="#100D12" font-weight="bold" text-anchor="middle">root</text><rect x="800" y="175" width="120" height="36" rx="8" fill="#FFFFFF" stroke="#1E6091" stroke-width="2.5"/><text x="860.0" y="200" font-size="19" fill="#1E6091" font-weight="bold" text-anchor="middle">SYS (8)</text><rect x="960" y="145" width="120" height="36" rx="8" fill="#FFFFFF" stroke="#2D6A4F" stroke-width="2.5"/><text x="1020.0" y="170" font-size="19" fill="#2D6A4F" font-weight="bold" text-anchor="middle">C1.1 (8)</text><rect x="960" y="205" width="120" height="36" rx="8" fill="#FFFFFF" stroke="#B8860B" stroke-width="2.5"/><text x="1020.0" y="230" font-size="19" fill="#B8860B" font-weight="bold" text-anchor="middle">C2.1 (8)</text><rect x="800" y="238" width="120" height="36" rx="8" fill="#FFFFFF" stroke="#2D6A4F" stroke-width="2.5"/><text x="860.0" y="263" font-size="19" fill="#2D6A4F" font-weight="bold" text-anchor="middle">FS (12)</text><line x1="760" y1="193" x2="800" y2="193" stroke="#100D12" stroke-width="2"/><line x1="760" y1="193" x2="800" y2="256" stroke="#100D12" stroke-width="2"/><line x1="920" y1="193" x2="960" y2="163" stroke="#100D12" stroke-width="2"/><line x1="920" y1="193" x2="960" y2="223" stroke="#100D12" stroke-width="2"/><text x="680" y="310" font-size="20" fill="#100D12" font-weight="normal" text-anchor="start">CPU: nodes hold token runs and slot numbers.</text><text x="680" y="338" font-size="20" fill="#100D12" font-weight="normal" text-anchor="start">GPU: one KV pool, one token per page,</text><text x="680" y="366" font-size="20" fill="#100D12" font-weight="normal" text-anchor="start">shared by cached tokens and running requests.</text><rect x="1100" y="160" width="11" height="13" fill="#2D6A4F" opacity="0.9"/><rect x="1113" y="160" width="11" height="13" fill="#2D6A4F" opacity="0.9"/><rect x="1126" y="160" width="11" height="13" fill="#2D6A4F" opacity="0.9"/><rect x="1139" y="160" width="11" height="13" fill="#2D6A4F" opacity="0.9"/><rect x="1152" y="160" width="11" height="13" fill="#2D6A4F" opacity="0.9"/><rect x="1165" y="160" width="11" height="13" fill="#2D6A4F" opacity="0.9"/><rect x="1178" y="160" width="11" height="13" fill="#2D6A4F" opacity="0.9"/><rect x="1191" y="160" width="11" height="13" fill="#2D6A4F" opacity="0.9"/><rect x="1204" y="160" width="11" height="13" fill="#2D6A4F" opacity="0.9"/><rect x="1217" y="160" width="11" height="13" fill="#2D6A4F" opacity="0.9"/><rect x="1100" y="176" width="11" height="13" fill="#2D6A4F" opacity="0.9"/><rect x="1113" y="176" width="11" height="13" fill="#2D6A4F" opacity="0.9"/><rect x="1126" y="176" width="11" height="13" fill="#B8860B" opacity="0.9"/><rect x="1139" y="176" width="11" height="13" fill="#B8860B" opacity="0.9"/><rect x="1152" y="176" width="11" height="13" fill="#B8860B" opacity="0.9"/><rect x="1165" y="176" width="11" height="13" fill="#8A8A8A" opacity="0.35"/><rect x="1178" y="176" width="11" height="13" fill="#8A8A8A" opacity="0.35"/><rect x="1191" y="176" width="11" height="13" fill="#8A8A8A" opacity="0.35"/><rect x="1204" y="176" width="11" height="13" fill="#8A8A8A" opacity="0.35"/><rect x="1217" y="176" width="11" height="13" fill="#8A8A8A" opacity="0.35"/><text x="1165" y="214" font-size="19" fill="#100D12" font-weight="normal" text-anchor="middle">KV pool</text><rect x="30" y="405" width="1220" height="245" rx="12" fill="#FFFFFF" stroke="#6A4C93" stroke-width="2.5"/><text x="50" y="440" font-size="24" fill="#6A4C93" font-weight="bold" text-anchor="start">The mechanisms</text><rect x="50" y="458" width="225" height="175" rx="10" fill="#FFFFFF" stroke="#1E6091" stroke-width="2"/><text x="62" y="490" font-size="20" fill="#1E6091" font-weight="bold" text-anchor="start">Match and split</text><text x="62" y="524" font-size="19" fill="#100D12" font-weight="normal" text-anchor="start">walk to the longest</text><text x="62" y="551" font-size="19" fill="#100D12" font-weight="normal" text-anchor="start">cached prefix, split</text><text x="62" y="578" font-size="19" fill="#100D12" font-weight="normal" text-anchor="start">a node when the match</text><text x="62" y="605" font-size="19" fill="#100D12" font-weight="normal" text-anchor="start">ends inside an edge</text><rect x="290" y="458" width="225" height="175" rx="10" fill="#FFFFFF" stroke="#C81D25" stroke-width="2"/><text x="302" y="490" font-size="20" fill="#C81D25" font-weight="bold" text-anchor="start">LRU leaf eviction</text><text x="302" y="524" font-size="19" fill="#100D12" font-weight="normal" text-anchor="start">evict the least</text><text x="302" y="551" font-size="19" fill="#100D12" font-weight="normal" text-anchor="start">recently used leaf,</text><text x="302" y="578" font-size="19" fill="#100D12" font-weight="normal" text-anchor="start">so every cached</text><text x="302" y="605" font-size="19" fill="#100D12" font-weight="normal" text-anchor="start">prefix stays whole</text><rect x="530" y="458" width="225" height="175" rx="10" fill="#FFFFFF" stroke="#100D12" stroke-width="2"/><text x="542" y="490" font-size="20" fill="#100D12" font-weight="bold" text-anchor="start">Reference counts</text><text x="542" y="524" font-size="19" fill="#100D12" font-weight="normal" text-anchor="start">a running request</text><text x="542" y="551" font-size="19" fill="#100D12" font-weight="normal" text-anchor="start">locks its whole path,</text><text x="542" y="578" font-size="19" fill="#100D12" font-weight="normal" text-anchor="start">locked nodes are</text><text x="542" y="605" font-size="19" fill="#100D12" font-weight="normal" text-anchor="start">never evicted</text><rect x="770" y="458" width="225" height="175" rx="10" fill="#FFFFFF" stroke="#B8860B" stroke-width="2"/><text x="782" y="490" font-size="20" fill="#B8860B" font-weight="bold" text-anchor="start">Cache-aware order</text><text x="782" y="524" font-size="19" fill="#100D12" font-weight="normal" text-anchor="start">longest shared prefix</text><text x="782" y="551" font-size="19" fill="#100D12" font-weight="normal" text-anchor="start">first is a DFS order:</text><text x="782" y="578" font-size="19" fill="#100D12" font-weight="normal" text-anchor="start">optimal hit rate</text><text x="782" y="605" font-size="19" fill="#100D12" font-weight="normal" text-anchor="start">(Theorem 3.1)</text><rect x="1010" y="458" width="225" height="175" rx="10" fill="#FFFFFF" stroke="#6A4C93" stroke-width="2"/><text x="1022" y="490" font-size="20" fill="#6A4C93" font-weight="bold" text-anchor="start">Hint and router</text><text x="1022" y="524" font-size="19" fill="#100D12" font-weight="normal" text-anchor="start">fork sends the prefix</text><text x="1022" y="551" font-size="19" fill="#100D12" font-weight="normal" text-anchor="start">first, a router keeps</text><text x="1022" y="578" font-size="19" fill="#100D12" font-weight="normal" text-anchor="start">a meta-tree of</text><text x="1022" y="605" font-size="19" fill="#100D12" font-weight="normal" text-anchor="start">the workers</text><rect x="30" y="675" width="590" height="200" rx="12" fill="#FFFFFF" stroke="#1E6091" stroke-width="2.5"/><text x="50" y="711" font-size="24" fill="#1E6091" font-weight="bold" text-anchor="start">The result (paper, §6)</text><text x="50" y="747" font-size="20" fill="#100D12" font-weight="normal" text-anchor="start">Up to 6.4x throughput, up to 3.7x lower latency</text><text x="50" y="774" font-size="20" fill="#100D12" font-weight="normal" text-anchor="start">Hit rates 50% to 99%, about 96% of the optimal</text><text x="50" y="801" font-size="20" fill="#100D12" font-weight="normal" text-anchor="start">Overhead with no reuse: 0.2 s of 74.3 s (&lt; 0.3%)</text><text x="50" y="828" font-size="20" fill="#100D12" font-weight="normal" text-anchor="start">Chatbot Arena: hit rate 52.4% and 74.1%,</text><text x="50" y="855" font-size="20" fill="#100D12" font-weight="normal" text-anchor="start">and 1.7x lower first-token latency (Vicuna-33B)</text><rect x="660" y="675" width="590" height="200" rx="12" fill="#FFFFFF" stroke="#8A8A8A" stroke-width="2.5" stroke-dasharray="8 6"/><text x="680" y="711" font-size="24" fill="#100D12" font-weight="bold" text-anchor="start">What came after</text><text x="680" y="747" font-size="20" fill="#100D12" font-weight="normal" text-anchor="start">2024-03 vLLM automatic prefix caching (block hashes)</text><text x="680" y="774" font-size="20" fill="#100D12" font-weight="normal" text-anchor="start">2024-12 SGLang cache-aware router (approximate trees)</text><text x="680" y="801" font-size="20" fill="#100D12" font-weight="normal" text-anchor="start">HiCache tiers, Preble, Marconi, Hydragen, T-LRU</text><text x="680" y="828" font-size="20" fill="#100D12" font-weight="normal" text-anchor="start">SGLang 0.5.22: UnifiedRadixCache with a Rust core,</text><text x="680" y="855" font-size="20" fill="#100D12" font-weight="normal" text-anchor="start">defaults FCFS scheduling and LRU eviction</text></svg>