<text x="195" y="582" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#FFFFFF">2</text>
<text x="195" y="625" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#100D12">r3</text>
<circle cx="320" cy="445" r="20" fill="#100D12" stroke="#100D12" stroke-width="2"/>
<text x="320" y="452" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#FFFFFF">3</text>
<text x="320" y="495" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#100D12">r4</text>
<circle cx="540" cy="320" r="20" fill="#100D12" stroke="#100D12" stroke-width="2"/>
<text x="540" y="327" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#FFFFFF">4</text>
<text x="540" y="370" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#100D12">r2</text>
<text x="350" y="680" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" text-anchor="middle" fill="#100D12">Requests: r1 = S+T+a (32), r2 = U+b (17),</text>
<text x="350" y="707" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" text-anchor="middle" fill="#100D12">r3 = S+T+c (32), r4 = S+d (22). Edge sum 53.</text>
<text x="950" y="110" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" fill="#100D12">All 24 orders, one request at a time</text>
<text x="660" y="160" font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="bold" text-anchor="start" fill="#100D12">pool 32 = longest request</text>
<text x="680" y="202" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#100D12">8 DFS orders</text>
<text x="910" y="202" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#100D12">53 computed, hit 50/103 ≈ 48.5%</text>
<text x="680" y="244" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#100D12">16 other orders</text>
<text x="910" y="244" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#100D12">63 to 83 computed</text>
<text x="680" y="286" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#100D12">FCFS r1 r2 r3 r4</text>
<text x="910" y="286" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#100D12">83 computed, hit 20/103 ≈ 19.4%</text>
<text x="680" y="328" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#100D12">LPM order</text>
<text x="910" y="328" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#100D12">r1 r3 r4 r2: a DFS order, 53</text>
<text x="660" y="412" font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="bold" text-anchor="start" fill="#100D12">cache 31 &lt; longest request</text>
<text x="660" y="454" font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="bold" text-anchor="start" fill="#100D12">(the cache keeps only finished KV)</text>
<text x="680" y="496" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#100D12">best order</text>
<text x="910" y="496" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#100D12">63 computed: bound 53 is missed</text>
<text x="680" y="538" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#100D12">DFS orders</text>
<text x="910" y="538" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#100D12">63 or 103 (no hit at all)</text>
<rect x="640" y="130" width="610" height="450" rx="8" fill="none" fill-opacity="1" stroke="#BBBBBB" stroke-width="1.5"/>
<text x="950" y="625" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" text-anchor="middle" fill="#100D12">Black circles: the DFS visit order of the requests.</text>
<text x="950" y="655" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" text-anchor="middle" fill="#100D12">Each subtree is finished before the next one starts,</text>
<text x="950" y="685" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" text-anchor="middle" fill="#100D12">so every edge is computed exactly once.</text>
