<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 760" width="1280" height="760">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#100D12"/></marker></defs>
<rect x="0" y="0" width="1280" height="760" rx="8" fill="#FFFFFF" fill-opacity="1" stroke="none" stroke-width="2"/>
<text x="640.0" y="46" font-family="Helvetica, Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="middle" fill="#100D12">DFS order on the request tree of a four-request batch</text>
<circle cx="350" cy="135" r="26" fill="#FFFFFF" stroke="#100D12" stroke-width="2"/>
