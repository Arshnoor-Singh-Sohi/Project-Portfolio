<text x="540" y="264.0" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="normal" text-anchor="middle" fill="#FFFFFF">17 tokens</text>
<rect x="75.0" y="339.0" width="110" height="62" rx="8" fill="#2D6A4F" fill-opacity="1" stroke="#2D6A4F" stroke-width="2"/>
<text x="130" y="364.0" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#FFFFFF">T</text>
<text x="130" y="389.0" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="normal" text-anchor="middle" fill="#FFFFFF">10 tokens</text>
<rect x="270.0" y="339.0" width="100" height="62" rx="8" fill="#2D6A4F" fill-opacity="1" stroke="#2D6A4F" stroke-width="2"/>
<text x="320" y="364.0" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#FFFFFF">d</text>
<text x="320" y="389.0" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="normal" text-anchor="middle" fill="#FFFFFF">2 tokens</text>
<rect x="30.0" y="469.0" width="90" height="62" rx="8" fill="#2D6A4F" fill-opacity="1" stroke="#2D6A4F" stroke-width="2"/>
<text x="75" y="494.0" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#FFFFFF">a</text>
<text x="75" y="519.0" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="normal" text-anchor="middle" fill="#FFFFFF">2</text>
<rect x="150.0" y="469.0" width="90" height="62" rx="8" fill="#2D6A4F" fill-opacity="1" stroke="#2D6A4F" stroke-width="2"/>
<text x="195" y="494.0" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#FFFFFF">c</text>
<text x="195" y="519.0" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="normal" text-anchor="middle" fill="#FFFFFF">2</text>
<circle cx="75" cy="575" r="20" fill="#100D12" stroke="#100D12" stroke-width="2"/>
<text x="75" y="582" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#FFFFFF">1</text>
<text x="75" y="625" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#100D12">r1</text>
