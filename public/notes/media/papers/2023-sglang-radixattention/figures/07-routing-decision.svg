<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 820" width="1280" height="820" font-family="Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="1280" height="820" fill="#ffffff"/>
<defs><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#100D12"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2D6A4F"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E6091"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B8860B"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C81D25"/></marker><marker id="ay" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A8A8A"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6A4C93"/></marker></defs>
<text x="640.0" y="44" font-size="28" fill="#100D12" font-weight="bold" text-anchor="middle">SGLang Model Gateway cache_aware: cache affinity or shortest queue?</text>
<rect x="60" y="80" width="420" height="60" rx="8" fill="#ECE6F3" stroke="#6A4C93" stroke-width="2"/>
<text x="270" y="117" font-size="20" fill="#6A4C93" font-weight="bold" text-anchor="middle">request text + worker loads</text>
<line x1="270" y1="142" x2="270" y2="172" stroke="#100D12" stroke-width="2" marker-end="url(#ak)"/>
<polygon points="270,175.0 500.0,260 270,345.0 40.0,260" fill="#ECE6F3" stroke="#6A4C93" stroke-width="2"/>
<text x="270" y="238" font-size="21" fill="#6A4C93" font-weight="bold" text-anchor="middle">imbalanced?</text>
<text x="270" y="266" font-size="20" fill="#100D12" font-weight="normal" text-anchor="middle">max - min &gt; 64</text>
<text x="270" y="292" font-size="20" fill="#100D12" font-weight="normal" text-anchor="middle">AND max &gt; 1.5 x min</text>
<line x1="500" y1="260" x2="560" y2="260" stroke="#100D12" stroke-width="2" marker-end="url(#ak)"/>
<text x="520" y="250" font-size="19" fill="#100D12" font-weight="bold" text-anchor="middle">yes</text>
<rect x="562" y="225" width="190" height="70" rx="8" fill="#F6EBD0" stroke="#B8860B" stroke-width="2"/>
<text x="657" y="255" font-size="20" fill="#B8860B" font-weight="bold" text-anchor="middle">shortest</text>
<text x="657" y="281" font-size="20" fill="#B8860B" font-weight="bold" text-anchor="middle">queue</text>
<line x1="270" y1="347" x2="270" y2="382" stroke="#100D12" stroke-width="2" marker-end="url(#ak)"/>
<text x="290" y="372" font-size="19" fill="#100D12" font-weight="bold" text-anchor="start">no</text>
<polygon points="270,385.0 500.0,460 270,535.0 40.0,460" fill="#ECE6F3" stroke="#6A4C93" stroke-width="2"/>
<text x="270" y="450" font-size="21" fill="#6A4C93" font-weight="bold" text-anchor="middle">best match rate &gt; 0.3?</text>
<text x="270" y="478" font-size="19" fill="#100D12" font-weight="normal" text-anchor="middle">(matched chars / all chars)</text>
<line x1="500" y1="460" x2="560" y2="460" stroke="#100D12" stroke-width="2" marker-end="url(#ak)"/>
<text x="520" y="450" font-size="19" fill="#100D12" font-weight="bold" text-anchor="middle">yes</text>
<rect x="562" y="420" width="190" height="80" rx="8" fill="#DCE8F2" stroke="#1E6091" stroke-width="2"/>
<text x="657" y="452" font-size="20" fill="#1E6091" font-weight="bold" text-anchor="middle">highest match</text>
<text x="657" y="478" font-size="19" fill="#1E6091" font-weight="normal" text-anchor="middle">(cache affinity)</text>
<line x1="270" y1="537" x2="270" y2="572" stroke="#100D12" stroke-width="2" marker-end="url(#ak)"/>
<text x="290" y="562" font-size="19" fill="#100D12" font-weight="bold" text-anchor="start">no</text>
<rect x="110" y="575" width="320" height="80" rx="8" fill="#F6EBD0" stroke="#B8860B" stroke-width="2"/>
<text x="270" y="607" font-size="20" fill="#B8860B" font-weight="bold" text-anchor="middle">lowest load</text>
<text x="270" y="633" font-size="19" fill="#B8860B" font-weight="normal" text-anchor="middle">(code on main, 2026-10-19)</text>
<text x="60" y="700" font-size="20" fill="#100D12" font-weight="normal" text-anchor="start">Current defaults: 64, 1.5 and 0.3.</text>
<text x="60" y="728" font-size="20" fill="#100D12" font-weight="normal" text-anchor="start">Older docs page: 32, 1.0001 and 0.5.</text>
<text x="790" y="95" font-size="20" fill="#100D12" font-weight="bold" text-anchor="start">Two workers, 1,000 characters, W0 holds 800</text>
<text x="790" y="135" font-size="19" fill="#100D12" font-weight="bold" text-anchor="start">loads W0, W1</text>
<text x="940" y="135" font-size="19" fill="#100D12" font-weight="bold" text-anchor="start">match</text>
<text x="1035" y="135" font-size="19" fill="#100D12" font-weight="bold" text-anchor="start">current</text>
<text x="1145" y="135" font-size="19" fill="#100D12" font-weight="bold" text-anchor="start">older</text>
<line x1="790" y1="147" x2="1240" y2="147" stroke="#100D12" stroke-width="1"/>
<text x="790" y="181" font-size="20" fill="#100D12" font-weight="normal" text-anchor="start">40, 10</text>
<text x="940" y="181" font-size="20" fill="#100D12" font-weight="normal" text-anchor="start">0.8</text>
<text x="1035" y="181" font-size="20" fill="#1E6091" font-weight="bold" text-anchor="start">W0</text>
<text x="1145" y="181" font-size="20" fill="#1E6091" font-weight="bold" text-anchor="start">W0</text>
<text x="790" y="221" font-size="20" fill="#100D12" font-weight="normal" text-anchor="start">90, 10</text>
<text x="940" y="221" font-size="20" fill="#100D12" font-weight="normal" text-anchor="start">0.8</text>
<text x="1035" y="221" font-size="20" fill="#B8860B" font-weight="bold" text-anchor="start">W1</text>
<text x="1145" y="221" font-size="20" fill="#B8860B" font-weight="bold" text-anchor="start">W1</text>
<text x="790" y="261" font-size="20" fill="#100D12" font-weight="normal" text-anchor="start">210, 140</text>
<text x="940" y="261" font-size="20" fill="#100D12" font-weight="normal" text-anchor="start">0.8</text>
<text x="1035" y="261" font-size="20" fill="#1E6091" font-weight="bold" text-anchor="start">W0</text>
<text x="1145" y="261" font-size="20" fill="#B8860B" font-weight="bold" text-anchor="start">W1</text>
<text x="790" y="301" font-size="20" fill="#100D12" font-weight="normal" text-anchor="start">40, 10</text>
<text x="940" y="301" font-size="20" fill="#100D12" font-weight="normal" text-anchor="start">0.2</text>
<text x="1035" y="301" font-size="20" fill="#B8860B" font-weight="bold" text-anchor="start">W1</text>
<text x="1145" y="301" font-size="20" fill="#B8860B" font-weight="bold" text-anchor="start">W1</text>
<text x="790" y="341" font-size="20" fill="#100D12" font-weight="normal" text-anchor="start">50, 10</text>
<text x="940" y="341" font-size="20" fill="#100D12" font-weight="normal" text-anchor="start">0.8</text>
<text x="1035" y="341" font-size="20" fill="#1E6091" font-weight="bold" text-anchor="start">W0</text>
<text x="1145" y="341" font-size="20" fill="#B8860B" font-weight="bold" text-anchor="start">W1</text>
<text x="790" y="395" font-size="19" fill="#1E6091" font-weight="normal" text-anchor="start">W0 (blue) = the cache holder.</text>
<text x="790" y="423" font-size="19" fill="#B8860B" font-weight="normal" text-anchor="start">W1 (gold) = the other worker.</text>
<text x="790" y="451" font-size="19" fill="#100D12" font-weight="normal" text-anchor="start">"older": older thresholds, same code.</text>
<rect x="790" y="480" width="450" height="190" rx="8" fill="#ffffff" stroke="#100D12" stroke-width="2"/>
<text x="810" y="512" font-size="21" fill="#100D12" font-weight="bold" text-anchor="start">Switch point, W1 at load 10</text>
<text x="810" y="548" font-size="20" fill="#100D12" font-weight="normal" text-anchor="start">current: 75 - 10 = 65 &gt; 64</text>
<text x="810" y="576" font-size="20" fill="#100D12" font-weight="normal" text-anchor="start">and 75 &gt; 15, so W0 loses at 75</text>
<text x="810" y="612" font-size="20" fill="#100D12" font-weight="normal" text-anchor="start">older: 43 - 10 = 33 &gt; 32</text>
<text x="810" y="640" font-size="20" fill="#100D12" font-weight="normal" text-anchor="start">and 43 &gt; 10.001, so W0 loses at 43</text>
<text x="640" y="785" font-size="19" fill="#100D12" font-weight="normal" text-anchor="middle">Both imbalance conditions must hold. Loads 210 and 140: gap 70 &gt; 64, but 210 &gt; 210 is false, so W0 keeps the request.</text>
</svg>
