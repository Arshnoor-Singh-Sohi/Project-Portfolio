<text x="60" y="684" font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="bold" text-anchor="start" fill="#100D12">L3: distributed storage, the only tier shared across instances</text>
<text x="60" y="716" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="normal" text-anchor="start" fill="#100D12">Backends named in the docs: Mooncake, DeepSeek 3FS, NIXL, AIBrix KVCache, HiCacheFile.</text>
<text x="60" y="748" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="normal" text-anchor="start" fill="#100D12">LMCache is an alternative integration.</text>
<text x="40" y="820" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="normal" text-anchor="start" fill="#100D12">Write policy (--hicache-write-policy): write_through (default), write_through_selective, write_back.</text>
<text x="40" y="852" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="normal" text-anchor="start" fill="#100D12">Prefetch stop policy (--hicache-storage-prefetch-policy): timeout (default), best_effort, wait_complete.</text>
<text x="40" y="884" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="normal" text-anchor="start" fill="#100D12">Host size: --hicache-ratio (2.0 in cache mode) or --hicache-size in GB. Enable: --enable-hierarchical-cache.</text>
</svg>
