<text x="150.0" y="210.0" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" text-anchor="end" font-weight="normal">steps 1 to 8:</text>
<text x="150.0" y="236.0" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" text-anchor="end" font-weight="normal">one full turn,</text>
<text x="150.0" y="262.0" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" text-anchor="end" font-weight="normal">back to 0</text>
