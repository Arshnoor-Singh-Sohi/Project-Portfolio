<text x="430.0" y="716.0" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#B8860B" text-anchor="start" font-weight="bold">end: 4</text>
<rect x="826" y="120" width="420" height="290" fill="#FFFFFF" stroke="#100D12" stroke-width="2" rx="8"/>
<text x="850.0" y="158.0" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#100D12" text-anchor="start" font-weight="bold">Division with remainder</text>
<text x="850.0" y="200.0" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#100D12" text-anchor="start" font-weight="bold">12 = 1 × 8 + 4</text>
<text x="850.0" y="240.0" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" text-anchor="start" font-weight="normal">quotient 1 = full turns (ignored)</text>
<text x="850.0" y="276.0" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#B8860B" text-anchor="start" font-weight="bold">remainder 4 = the position</text>
<text x="850.0" y="320.0" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" text-anchor="start" font-weight="normal">Python:  12 % 8  gives 4</text>
<text x="850.0" y="354.0" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" text-anchor="start" font-weight="normal">Python:  −1 % 8  gives 7</text>
<text x="850.0" y="388.0" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#8A8A8A" text-anchor="start" font-weight="normal">(one step back from 0 is 7)</text>
<rect x="826" y="440" width="420" height="150" fill="#FFFFFF" stroke="#100D12" stroke-width="2" rx="8"/>
<text x="850.0" y="478.0" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" text-anchor="start" font-weight="normal">Grey labels: each position in</text>
<text x="850.0" y="508.0" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" text-anchor="start" font-weight="normal">3-bit binary, for example 6 = 110.</text>
<text x="850.0" y="548.0" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" text-anchor="start" font-weight="bold">8 positions need log₂ 8 = 3 bits.</text>
