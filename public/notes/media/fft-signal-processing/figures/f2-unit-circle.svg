<text x="637.2" y="625.2" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#100D12" text-anchor="start" font-weight="bold">315° = 7π/4</text>
<text x="637.2" y="651.2" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#100D12" text-anchor="start" font-weight="normal">(0.71, −0.71)</text>
<rect x="880" y="110" width="390" height="300" fill="#FFFFFF" stroke="#100D12" stroke-width="2" rx="8"/>
<text x="905.0" y="148.0" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#100D12" text-anchor="start" font-weight="bold">Signs in each quarter</text>
