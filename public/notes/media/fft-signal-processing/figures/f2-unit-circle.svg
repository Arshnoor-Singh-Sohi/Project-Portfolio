<text x="905.0" y="392.0" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#100D12" text-anchor="start" font-weight="normal">Positive θ turns counter-clockwise.</text>
<rect x="880" y="440" width="390" height="240" fill="#FFFFFF" stroke="#100D12" stroke-width="2" rx="8"/>
<text x="905.0" y="478.0" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#100D12" text-anchor="start" font-weight="bold">Rules</text>
<text x="905.0" y="516.0" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" text-anchor="start" font-weight="normal">point at angle θ = (cos θ, sin θ)</text>
<text x="905.0" y="552.0" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" text-anchor="start" font-weight="normal">cos²θ + sin²θ = 1</text>
<text x="905.0" y="588.0" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" text-anchor="start" font-weight="normal">one turn = 360° = 2π radians</text>
<text x="905.0" y="624.0" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" text-anchor="start" font-weight="normal">0.71 is √2/2 ≈ 0.7071, rounded</text>
<text x="905.0" y="660.0" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" text-anchor="start" font-weight="normal">to two decimals.</text>
