<text x="175.0" y="728.0" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#1E6091" text-anchor="start" font-weight="bold">= 0.50 + 0i = cos 60°</text>
<text x="30.0" y="762.0" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" text-anchor="start" font-weight="normal">The imaginary parts cancel. The real parts add.</text>
