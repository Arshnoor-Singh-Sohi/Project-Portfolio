<text x="905.0" y="196.0" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" text-anchor="start" font-weight="normal">W<tspan font-size="17" baseline-shift="sub">8</tspan><tspan font-size="17" baseline-shift="super" dx="-10">8</tspan> = 1: eight steps = one turn</text>
<text x="905.0" y="240.0" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" text-anchor="start" font-weight="normal">W<tspan font-size="17" baseline-shift="sub">8</tspan><tspan font-size="17" baseline-shift="super" dx="-10">9</tspan> = W<tspan font-size="17" baseline-shift="sub">8</tspan><tspan font-size="17" baseline-shift="super" dx="-10">1</tspan><tspan dx="6">: </tspan>the powers repeat</text>
<text x="905.0" y="284.0" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" text-anchor="start" font-weight="normal">W<tspan font-size="17" baseline-shift="sub">8</tspan><tspan font-size="17" baseline-shift="super" dx="-10">2</tspan> = W<tspan font-size="17" baseline-shift="sub">4</tspan> = −i</text>
<text x="905.0" y="328.0" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" text-anchor="start" font-weight="normal">W<tspan font-size="17" baseline-shift="sub">8</tspan><tspan font-size="17" baseline-shift="super" dx="-10">k+4</tspan> = −W<tspan font-size="17" baseline-shift="sub">8</tspan><tspan font-size="17" baseline-shift="super" dx="-10">k</tspan><tspan dx="6">: </tspan>half a turn</text>
<text x="905.0" y="372.0" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" text-anchor="start" font-weight="normal">the sum of all 8 points = 0</text>
<text x="905.0" y="422.0" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#8A8A8A" text-anchor="start" font-weight="normal">0.71 is √2/2 ≈ 0.7071, rounded.</text>
<text x="905.0" y="452.0" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#8A8A8A" text-anchor="start" font-weight="normal">The course turns clockwise (−).</text>
