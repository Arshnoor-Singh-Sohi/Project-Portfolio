<text x="380.0" y="398.0" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#B8860B" text-anchor="middle" font-weight="bold"><tspan dy="0" font-size="22">W</tspan><tspan dy="6" font-size="19">8</tspan><tspan dy="-15" font-size="19">1</tspan><tspan dy="9" font-size="22"> = 0.71 − 0.71i</tspan></text>
<text x="382.0" y="520.0" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#6A4C93" text-anchor="middle" font-weight="bold"><tspan dy="0" font-size="22">t = W</tspan><tspan dy="6" font-size="19">8</tspan><tspan dy="-15" font-size="19">1</tspan><tspan dy="9" font-size="22">·O[1] = 2</tspan></text>
