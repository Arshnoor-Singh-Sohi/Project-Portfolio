<text x="40.0" y="590.0" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#100D12" text-anchor="start" font-weight="normal">Work: 1 multiplication, 1 addition, 1 subtraction. Results: 2 outputs.</text>
<text x="40.0" y="622.0" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#100D12" text-anchor="start" font-weight="normal">Both outputs match the direct DFT: X[1] = 4 and X[5] = 0.</text>
