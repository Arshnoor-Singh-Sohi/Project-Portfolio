<text x="1099.0" y="460.0" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#6A4C93" text-anchor="middle" font-weight="normal">length 2, angle 0°</text>
<path d="M 1004.1 330.9 A 97.7 97.7 0 0 1 1032.8 400.0" stroke="#B8860B" stroke-width="4" fill="none"/>
<text x="1042.4" y="362.0" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#B8860B" text-anchor="start" font-weight="bold">−45°</text>
<text x="905.0" y="530.0" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" text-anchor="start" font-weight="normal">The twiddle turns O[1] by −45°.</text>
<text x="905.0" y="558.0" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" text-anchor="start" font-weight="normal">The length stays 2.</text>
<text x="905.0" y="590.0" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" text-anchor="start" font-weight="normal">Values rounded to two decimals.</text>
<text x="905.0" y="622.0" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" text-anchor="start" font-weight="normal"><tspan dy="0" font-size="20">Exactly: (1 − i)/√2 · √2(1 + i) = 2</tspan></text>
