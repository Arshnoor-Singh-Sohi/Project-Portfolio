<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 660" width="1280" height="660" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="1280" height="660" fill="#FFFFFF"/>
<text x="640.0" y="44.0" font-family="Helvetica, Arial, sans-serif" font-size="28" fill="#100D12" text-anchor="middle" font-weight="bold">One butterfly for k = 1: one multiplication, two outputs</text>
<text x="40.0" y="100.0" font-family="Helvetica, Arial, sans-serif" font-size="23" fill="#100D12" text-anchor="start" font-weight="bold">1. The butterfly</text>
<text x="262.0" y="218.0" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#100D12" text-anchor="end" font-weight="bold"><tspan dy="0" font-size="24">E[1] = 2</tspan></text>
<text x="262.0" y="458.0" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#6A4C93" text-anchor="end" font-weight="bold"><tspan dy="0" font-size="24">O[1] = 1.41 + 1.41i</tspan></text>
<text x="262.0" y="184.0" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#100D12" text-anchor="end" font-weight="normal">from the even samples</text>
